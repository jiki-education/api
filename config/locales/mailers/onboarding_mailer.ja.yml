ja:
  onboarding_mailer:
    overview:
      subject: "2026年にエンジニアになるための2つの柱"
      preview: "ここ数年、私は少しずつ日本語を学んでいます。"
      greeting: "こんにちは。"
      body_markdown: |
        ここ数年、私は**日本語をゆっくりと学んできました**。定期的に日本を訪れて、できるだけ日本語に浸るようにしていますが、なかなか大変です。というのも、今はGoogle翻訳のおかげで、日本で過ごしながら日本語を一言も話さずに済ませるのは、とても簡単だからです。**脳は怠けられる**わけですが、それでも何とかやっていけます。

        プログラミングも、最近は同じ道を歩み始めました。この30年間、IT業界で何かをしたいと思ったら、**プログラミングを学ぶしかありませんでした**。コンピューターとやり取りする唯一の方法だったからです。ところがこの2年、AIエージェントがコードを書く時代になり、状況は変わりました。今では自分の言葉でAIエージェントにやりたいことを伝えれば、**コードを書いてくれます**。指示をコンピューターに訳してくれるのです。

        日本語が流暢になるまで待たなくても日本を探検できるのと同じで、何かを作り始める前に**プログラミングが上手になるまで何年もかける意味は、もうありません**。

        でも、日本文化を本当に楽しみ、日本人の友達を作りたいなら、日本語を学ぶ必要があります。同じように、IT業界でやっていきたいなら、やはりプログラミングを学ぶ必要があります。コードはもう関門ではありません。それでも、**「何とかやっていく」か、本当に飛躍するかの違い**なのです。

        早く上手になるには、学習時間を2つに分けましょう。
        1. **プログラミングを学ぶ。** Jikiの「Coding Fundamentals」コースを進めれば、しっかりした土台ができます。
        2. **何かを作る。** 「Learn to Build」を進めて細部まで踏み込み、実際に使ってもらえるプロダクトを作りましょう。

        **2026年にIT業界に入るにはどうすればいいか**についての私の考えをもっと知りたければ、[こちらのブログ記事](https://jiki.io/blog/how-to-get-into-tech-in-2026)を読んでみてください。

        これから数日間、プログラミングとものづくりの両方について、そして[Jiki](https://jiki.io)を最大限に活用する方法について、もう少し詳しくお伝えします。それでは、**思いきり打ち込んで、楽しんでください！**

        読んでくれてありがとう！
        Jeremy
    coding:
      subject: "プログラミングの基礎をしっかり固めよう"
      preview: "プログラミングの学習は、技術的で難しいというイメージを持たれがちです。"
      greeting: "こんにちは、またお会いしましたね。"
      body_markdown: |
        プログラミングの学習は、技術的で難しいというイメージを持たれがちです。私がプログラミングを学び始めたのは8歳のときで、**突然かっこいいものを作れるようになった**ということ以外、何も知りませんでした。難しいものだなんて知らなかったのです。ただ、自分の創造性を出せる新しい場所ができた、と感じていました。

        プログラミングを学ぶうえで、**それを極めるべき技術的な学問だとは思わないでください**。**自分**の創造性を解き放てる場所、**ものを作ったりパズルを解いたりするのを楽しめる**場所だと思ってほしいのです。プログラミングの本質は、問題を解くことだからです。

        [どのプログラミング言語を学ぶか](https://jiki.io/blog/just-learn-to-code)は問題ではありません。大切なのは、**プログラミングがどう動くのか**をしっかり理解することです。

        学習を進めるうちに、プログラミングが難しく、もどかしく感じられる時期も必ずあります。でもそれは、_プログラミング_が難しいからではなく、**学ぶこと自体が難しい**からです。何かを上達させたいなら、難しすぎると感じる時期を必ず通ります。それでも、踏ん張り続けるしかありません。

        プログラミングの部分に努力する価値があるか不安なら、2026年になってもプログラミングを学ぶべき理由を説明した[こちらのブログ記事](https://jiki.io/blog/should-i-still-learn-to-code-in-2026)を読んでみてください。

        読んでくれてありがとう！
        Jeremy
    premium:
      subject: "Jikiをもっと活用しよう（応援にもなります）"
      preview: "誰もが使えるようにしたい。それがJikiを無料にした理由です。"
      greeting: "こんにちは。"
      body_markdown: |
        Jikiを無料にしたのは、経済的な状況にかかわらず、**誰もが使える**ようにしたいからです。誰でも数百時間分の演習と動画を、見返りを一切求めずに利用できます。

        ただ、**Jikiを運営するにはお金がかかります**。家賃を払い、食べ物（🍜）とカフェイン（☕）も必要です。そこで、きっと役に立つ特典を追加したプレミアムも用意しました。
        - **Ask Jiki**: 詰まったときにすぐ助けてくれたり、疑問を掘り下げたりできるAIチャット。
        - **プレミアムプロジェクト**: 学んでいるスキルを組み合わせられる、より難しい演習。
        - **Learn to Build**: 私と一緒に学べる、さらにたくさんのコンテンツ。
        - **バッジ**: サイトやコミュニティスペースで、プレミアムバッジとして応援を示せます。

        **購買力平価**を使うことで、とても手頃な価格にしています。プレミアムの料金は、お住まいの国でテイクアウトの飲み物を2杯買うのと同じくらいです。世界中どこにいても、納得できる価格に感じられるはずです。

        Jikiを楽しんでいて、**学習を加速させたい**、そして私とJikiチームを応援したいと思ったら、ぜひ[プレミアムにアップグレード](https://jiki.io/premium)してください。

        ありがとうございます。
        Jeremy
    community:
      subject: "ひとりで悩まないで。Jikiのコミュニティに参加しよう"
      preview: "何かを学ぶとき、仲間がいるほうがずっと成功しやすいものです。"
      greeting: "こんにちは。"
      body_markdown: |
        何かを学ぶとき、**仲間がいる**ほうがずっと成功しやすいものです。プログラミングも同じです。

        助けがほしいとき、自分のプログラミングの道のりについて話したいとき、ただ誰かと過ごしたいときは、こんな場所があります。
        - [フォーラム](https://jiki.io/r/forum): じっくり長い文章で会話したいときに向いています。ここで**深く掘り下げましょう**。
        - [ExercismのDiscord](https://jiki.io/r/discord): オンラインの人と**リアルタイムにチャット**したいときに向いています。#jiki-chatと#jiki-get-helpのチャンネルを探してみてください。
        - [YouTube](https://jiki.io/r/youtube): AMA（何でも質問できる会）や他の**ライブ配信**に参加して、私に質問してください！

        この場所には、さまざまな文化の人が集まっています。チャットするときは、**みんなに敬意を払う**ようにしてください。

        それでは、そこでお会いしましょう！
        Jeremy
