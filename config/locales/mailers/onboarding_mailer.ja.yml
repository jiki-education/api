ja:
  onboarding_mailer:
    overview:
      subject: "『ベスト・キッド』って見たことありますか？"
      preview: "よくいただく質問のひとつに、Jikiは誰のためのものかというものがあります。"
      greeting: "こんにちは。"
      body_markdown: |
        「**ワックス・オン、ワックス・オフ**」という言葉は、難しいことを学ぶことの代名詞のようになっています。これは映画『ベスト・キッド』から来ています。主人公のダニエル（つまり、この映画のカラテ・キッドですね）が、師匠のミヤギさんに空手を教えてほしいと頼む場面があります。ミヤギさんは蹴りやパンチのやり方を教える代わりに、ダニエルに家事をやらせます。その中でも特に有名なのが、車にワックスをかける作業です。大切なのは、決まった動きを正確に行うことで、ネタバレになりますが、この修行が空手にも活かせる力を育てていること、そして体を何度も繰り返し鍛えるプロセスそのものが上達につながるのだとわかります。

        プログラミングも少し似ていますが、鍛えるのは体ではなく頭です。誰だって初日から面白いものを作れるようになりたいと思いますが、何よりもまず本当にしっかりした基礎を築く必要があります。正しい方法で**脳を鍛え**、正しい考え方を身につけることが大切です。

        - **プログラミングが初めてなら**、Jikiがこうした頭のトレーニングを一緒に進めてくれます（車のワックスがけよりは、ずっと楽しいはずです！）。そして、知っておくべきことをすべて教えてくれます。
        - **しばらくプログラミングをしてきたなら**、同じ基礎を行ったり来たりしているだけで、前に進んでいないように感じるかもしれません。でも、車にワックスをかけるダニエルと同じで、この初期の段階をきちんとこなすことには大きな価値があります。Jikiと一緒に続けていけば、**深いプログラミングの考え方と確かな基礎力**を育てるお手伝いをします。

        一緒に学べることを楽しみにしています！　質問があれば、このメールに返信してください。私は人間ですし、喜んでお手伝いします 🙂

        最後まで読んでいただき、ありがとうございます！
        Jeremy
    coding:
      subject: "どのプログラミング言語を学べばいいのでしょうか？"
      preview: "プログラミングの学習は、技術的で難しそうだと思われがちです。"
      greeting: "こんにちは、またお会いしましたね。"
      body_markdown: |
        プログラミングの学習は、技術的で難しそうだと思われがちです。私がプログラミングを学び始めたのは8歳のときで、そのころは**急にすごいものを作れるようになった**ということ以外、プログラミングについて何も知りませんでした。難しいものだなんて、知りもしませんでした。ただ、自分の創造性を発揮する新しい場所が急にできた、と感じていただけです。

        多くの初心者は、どのプログラミング言語を学ぶかを決めるのに長い時間をかけます。[そこはあまり関係ありません](https://jiki.io/blog/just-learn-to-code)。大切なのは、**プログラミングがどう動くのか**をしっかり理解することで、Jikiはまさにそこを教えます。

        学習を進めていくと、プログラミングが本当に難しく感じられ、もどかしくなる時期もあります。でも、それは_プログラミング_が難しいからではなく、**学ぶこと自体が難しい**からです。何かで上達したいなら、課題が大きすぎると感じる時期を通らなければなりませんが、そこで諦めずに粘り強く続けることが大切です。

        Jikiは、コードがわかるようになるところまで導いてくれます。その後は、姉妹サイトのExercismを使って、**85種類のプログラミング言語**から好きなものを学べます！

        きっとできますよ！
        Jeremy
    premium:
      subject: "Jikiをもっと活用しよう（チームの応援にも）"
      preview: "Jikiを無料にしたのは、誰にとっても使いやすいものにしたいからです。"
      greeting: "こんにちは。"
      body_markdown: |
        Jikiを無料にしたのは、経済的な状況に関わらず、**誰もが使える**ようにしたいからです。誰でも数百時間分の演習と動画を利用でき、その見返りに何も求めていません。

        ただし、**Jikiの運営にはお金がかかります**。家賃を払い、食事（🍜）やカフェイン（☕）も確保する必要があるので、いくつかの追加特典が付いたプレミアムプランを用意しました。きっと役に立つはずです：
        - **もう行き詰まらない**：Jikiへの質問サポートが無制限に使えます。
        - **さらに自分を追い込める**：プレミアム限定のチャレンジに挑戦できます。
        - **コミュニティの一員になれる**：定期的なライブ配信に参加できます。
        - **もっと深く学べる**：全解説カタログを利用できます。
        - **スキルを証明できる**：公式の認定証を取得できます。
        - **集中して学べる**：広告のない学習環境が使えます。
        - **新機能をいち早く試せる**：新しい機能に先行アクセスできます。
        - **応援していることを示せる**：サイトやコミュニティでプレミアムバッジを表示できます。

        **購買力平価**を使うことで、とても手に取りやすい価格にしています。つまり、プレミアムの料金は、お住まいの国でテイクアウトの飲み物を2杯買うのと同じくらいです。世界のどこにいても、無理のない価格に感じられるはずです。

        Jikiを楽しんでいて、**学習を加速させたい**と思い、そして私とJikiチームを応援したいと思ってくださるなら、ぜひ[プレミアムにアップグレード](https://jiki.io/premium)してください。

        ありがとうございます。
        Jeremy
    community:
      subject: "ひとりで悩まないで。Jikiのコミュニティに参加しよう"
      preview: "何かを学ぶとき、仲間がいるほうがずっと成功しやすいものです。"
      greeting: "こんにちは。"
      body_markdown: |
        何かを学ぶとき、**仲間がいる**ほうがずっと成功しやすいものです。プログラミングも同じです。

        助けがほしいとき、自分のプログラミングの道のりについて話したいとき、ただ誰かと過ごしたいときは、こんな場所があります。
        - [フォーラム](https://jiki.io/r/forum): じっくり長い文章で会話したいときに向いています。ここで**深く掘り下げましょう**。
        - [ExercismのDiscord](https://jiki.io/r/discord): オンラインの人と**リアルタイムにチャット**したいときに向いています。#jiki-chatと#jiki-get-helpのチャンネルを探してみてください。
        - [YouTube](https://jiki.io/r/youtube): AMA（何でも質問できる会）や他の**ライブ配信**に参加して、私に質問してください！

        この場所には、さまざまな文化の人が集まっています。チャットするときは、**みんなに敬意を払う**ようにしてください。

        それでは、そこでお会いしましょう！
        Jeremy
