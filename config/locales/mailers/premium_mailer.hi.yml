hi:
  premium_mailer:
    welcome_to_premium:
      subject: "Jiki Premium में आपका स्वागत है!"
      greeting: "नमस्ते,"
      body_markdown: |
        Jiki Premium की सदस्यता लेने के लिए धन्यवाद!

        आपके पास जो भी फीचर उपलब्ध हैं, वह सब आप [Premium पेज](https://jiki.io/premium) पर देख सकते हैं। हमें उम्मीद है कि Jiki इस्तेमाल करने में आपको खूब मज़ा आएगा और हम जल्द ही आपसे किसी लाइवस्ट्रीम में मिलेंगे!

        अगर आपके कोई सवाल हों, तो बस इस ईमेल का जवाब भेज दीजिए।

        शुभकामनाएँ,  
        Jeremy और टीम
    subscription_ended:
      subject: "आपकी Jiki सदस्यता समाप्त हो गई है"
      greeting: "नमस्ते,"
      body_markdown: |
        आपकी Jiki Premium सदस्यता समाप्त हो गई है और अब आप हमारे मुफ्त प्लान पर हैं।

        हमारे पूरे कोड सीखना सेक्शन तक आपकी पहुँच अब भी पूरी है। अगर आप दोबारा सदस्यता लेना चाहें, तो आप कभी भी अपने [सेटिंग्स पेज](https://jiki.io/settings) से ले सकते हैं।

        Jiki Premium आज़माने के लिए धन्यवाद।

        शुभकामनाएँ,  
        Jeremy और टीम
