uk:
  account_mailer:
    welcome:
      subject: "Ласкаво просимо до Jiki!"
      greeting: "Вітаємо,"
      body_markdown: |
        Ласкаво просимо до [Jiki](https://jiki.io)! Ми дуже раді бачити вас тут.

        Jiki створений для того, щоб провести вас від повного новачка до впевненого програміста. Ви будете працювати над цікавими проєктами й розвʼязувати захопливі задачі, просуватися вперед крок за кроком і дізнаватися дуже багато нового в цій подорожі.

        Якщо колись застрягнете або виникнуть запитання, не соромтеся написати нам. Спершу навчання програмуванню може здаватися складним, але у вас усе вийде!

        Бажаємо гарного настрою та приємної подорожі!

        З повагою,  
        Джеремі та команда
    account_deletion_confirmation:
      subject: "Підтвердіть видалення облікового запису"
      preview: "Підтвердіть, будь ласка, що хочете назавжди видалити свій обліковий запис Jiki"
      greeting: "Вітаємо,"
      body_markdown: |
        Ми отримали запит на видалення вашого облікового запису Jiki.

        Якщо цей запит справді від вас, натисніть кнопку нижче, щоб підтвердити його. Ця дія незворотна, і скасувати її неможливо. Усі ваші дані та весь прогрес буде видалено.

        Якщо ви цього не робили, просто проігноруйте цей лист, і ваш обліковий запис залишиться без змін.
      cta: "Видалити мій обліковий запис"
