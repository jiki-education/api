bn:
  premium_mailer:
    welcome_to_premium:
      subject: "Jiki Premium-এ স্বাগতম!"
      greeting: "স্বাগতম!"
      body_markdown: |
        Jiki Premium-এ সাবস্ক্রাইব করার জন্য আপনাকে ধন্যবাদ!

        আপনি যেসব ফিচার ব্যবহার করতে পারবেন, তার সবগুলো [Premium পেজে](https://jiki.io/premium) দেখতে পাবেন। আশা করি Jiki ব্যবহার করে আপনি দারুণ মজা পাবেন, আর খুব শিগগিরই কোনো লাইভস্ট্রিমে আপনার সাথে দেখা হবে!

        কোনো প্রশ্ন থাকলে এই ইমেইলের উত্তর দিলেই হবে।

        শুভেচ্ছান্তে,  
        জেরেমি ও টিম
    subscription_ended:
      subject: "আপনার Jiki সাবস্ক্রিপশন শেষ হয়েছে"
      greeting: "স্বাগতম!"
      body_markdown: |
        আপনার Jiki Premium সাবস্ক্রিপশন শেষ হয়েছে এবং আপনি এখন আমাদের ফ্রি প্ল্যানে আছেন।

        আমাদের পুরো কোড শেখার সেকশনে আপনার সম্পূর্ণ অ্যাক্সেস এখনও রয়েছে। আবার সাবস্ক্রাইব করতে চাইলে যেকোনো সময় আপনার [সেটিংস পেজ](https://jiki.io/settings) থেকে তা করতে পারবেন।

        Jiki Premium ব্যবহার করে দেখার জন্য ধন্যবাদ।

        শুভেচ্ছান্তে,  
        জেরেমি ও টিম
