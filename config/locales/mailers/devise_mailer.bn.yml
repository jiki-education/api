# Vendored from devise-i18n (bn.yml) - generic transactional copy,
# remapped onto our key shape. Safe to hand-tune toward Jiki's voice.
bn:
  devise:
    mailer:
      confirmation_instructions:
        subject: আপনার ইমেইল নিশ্চিত করুন
        preview: 'আপনার জিকি (Jiki) অ্যাকাউন্টের জন্য ইমেইল ঠিকানাটি নিশ্চিত করুন'
        greeting: স্বাগতম!
        body_markdown: 'আপনার ইমেল ঠিকানা নিশ্চিত করার জন্য নিম্নলিখিত লিঙ্কটি ক্লিক করুন:'
        cta: আমার ইমেইল নিশ্চিত করুন
      reset_password_instructions:
        subject: পাসওয়ার্ড রিসেট করুন
        preview: 'আপনার জিকি (Jiki) অ্যাকাউন্টের পাসওয়ার্ড রিসেট করুন।'
        greeting: স্বাগতম!
        body_markdown: 'আপনার জিকি (Jiki) অ্যাকাউন্টের পাসওয়ার্ড রিসেট করার জন্য একটি অনুরোধ পাওয়া গেছে। পাসওয়ার্ড রিসেট করতে নিচের লিঙ্কে ক্লিক করুন:'
        cta: আমার পাসওয়ার্ড রিসেট করুন
        footer: 'আপনি যদি এই অনুরোধটি না করে থাকেন, তবে এই ইমেলটি উপেক্ষা করতে পারেন—উপরের লিঙ্কে ক্লিক না করলে আপনার পাসওয়ার্ড পরিবর্তিত হবে না।'
