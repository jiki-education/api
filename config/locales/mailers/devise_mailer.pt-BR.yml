# Vendored from devise-i18n (pt-BR.yml) - generic transactional copy,
# remapped onto our key shape. Safe to hand-tune toward Jiki's voice.
pt-BR:
  devise:
    mailer:
      confirmation_instructions:
        subject: Instruções de confirmação
        preview: 'Você pode confirmar sua conta através do link abaixo:'
        greeting: Bem-vindo %{name}!
        body_markdown: 'Você pode confirmar sua conta através do link abaixo:'
        cta: Confirmar minha conta
      reset_password_instructions:
        subject: Instruções de redefinição de senha
        preview: Alguém fez o pedido para redefinir sua senha, e você pode fazer isso clicando no link abaixo.
        greeting: Olá %{name}!
        body_markdown: Alguém fez o pedido para redefinir sua senha, e você pode fazer isso clicando no link abaixo.
        cta: Redefinir minha senha
        footer: Se você não fez este pedido, por favor ignore este e-mail. Sua senha não será alterada até que você acesse o link acima e crie uma nova.
