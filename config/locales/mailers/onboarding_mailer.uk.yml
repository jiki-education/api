uk:
  onboarding_mailer:
    overview:
      subject: "Дві складові шляху до професії розробника у 2026"
      preview: "Останні кілька років я потроху вивчаю японську."
      greeting: "Вітаю,"
      body_markdown: |
        Останні кілька років я **потроху вивчаю японську**. Я регулярно буваю в Японії й намагаюся зануритися в мову, але це непросто, бо сьогодні, з допомогою Google Translate, доволі легко провести час у Японії й не сказати японською жодного слова. **Тож мій мозок може лінуватися**, поки я чудово даю собі раду без знання мови.

        Програмування нещодавно вирушило в таку саму подорож. Останні 30 років, щоб робити бодай щось в IT-індустрії, **треба було навчитися програмувати**. Це був єдиний спосіб спілкуватися з компʼютером. Але за останні два роки, з появою агентного програмування, все змінилося. Тепер можна користуватися рідною мовою й просто сказати ШІ-агенту, що ви хочете зробити, і він **напише код за вас**, переклавши ваші вказівки на зрозумілу компʼютеру мову.

        Так само як мені не треба чекати вільного володіння японською, щоб подорожувати Японією, **більше немає жодного сенсу роками вдосконалювати навички програмування**, перш ніж починати щось створювати.

        Але якщо я хочу справді зануритися в японську культуру й завести друзів у Японії, мені потрібно вивчити японську. І якщо ви хочете увійти в IT-індустрію, вам усе одно потрібно навчитися програмувати. Код більше не обороняє вхід в індустрію, але саме він **відрізняє тих, хто «якось дає собі раду», від тих, хто справді досягає успіху**.

        Щоб швидко досягти хорошого рівня, поділіть свій час на навчання на дві частини:
        1. **Вчіться програмувати.** Пройдіть курс Jiki з основ програмування, і у вас буде міцний фундамент.
        2. **Створюйте.** Пройдіть «Шлях розробника (Learn to Build)», занурюйтеся в деталі та створюйте продукти, якими люди справді зможуть користуватися!

        Якщо хочете дізнатися більше про мої думки щодо того, **як увійти в IT-індустрію у 2026 році**, прочитайте [цю статтю в блозі](https://jiki.io/blog/how-to-get-into-tech-in-2026).

        Упродовж наступних кількох днів я розповім трохи більше і про програмування, і про створення продуктів, і про те, як отримати максимум від [Jiki](https://jiki.io). А поки що **беріться до справи й отримуйте задоволення!**

        Дякую, що прочитали!
        Джеремі
    coding:
      subject: "Закладіть міцний фундамент у програмуванні"
      preview: "Навчання програмуванню відоме своєю складністю та технічністю матеріалу."
      greeting: "І знову вітаю,"
      body_markdown: |
        Навчання програмуванню відоме своєю складністю та технічністю матеріалу. Коли я почав вчитися програмувати, я був восьмирічною дитиною, яка не знала про програмування нічого, крім того, що **раптом можна стало створювати круті штуки**. Я не знав, що це має бути важко. Я просто знав, що в мене раптом виникла нова віддушина для творчості.

        Поки ви вчитеся програмувати, **я не хочу, щоб ви сприймали це як якусь технічну дисципліну, яку треба опанувати**. Я хочу, щоб ви бачили в цьому простір, де можна дати волю **своїй** творчості, де можна **із задоволенням щось створювати** та розвʼязувати головоломки. Бо саме цим програмування і є насправді: розвʼязуванням задач.

        Немає значення, [яку мову програмування ви вивчаєте](https://jiki.io/blog/just-learn-to-code); значення має те, що ви по-справжньому добре зможете опанувати, **як працює програмування**.

        З часом будуть моменти, коли програмування справді здаватиметься важким і виснажливим. Але не тому, що *програмування* є важким, а тому, що **важким є навчання**. Щоб досягти хорошого рівня в будь-чому, доводиться проходити етапи, коли задача здається непосильною, і саме тоді треба не здаватися.

        Якщо ви не впевнені, чи варте програмування ваших зусиль, прочитайте [цю статтю в блозі](https://jiki.io/blog/should-i-still-learn-to-code-in-2026), де пояснено, чому у 2026 році все ще варто вчитися програмувати.

        Дякую, що прочитали!
        Джеремі
    building:
      subject: "Найкращий спосіб навчитися: створювати!"
      preview: "Я справді вірю, що зараз найкращий час, щоб увійти в IT-індустрію."
      greeting: "Вітаю,"
      body_markdown: |
        Я справді вірю, що **зараз найкращий час, щоб увійти в IT-індустрію**. Ще ніколи не було так легко опанувати основи й швидко почати щось створювати.

        Але (і це велике «але»!) багато людей припускаються однієї помилки: вони повністю віддають кермо ШІ-агенту й насправді нічому не вчаться. Спочатку відчувається кураж, адже все ніби виникає як за помахом чарівної палички, але якщо ви тільки віддаєте вказівки Claude чи ChatGPT, то насправді ви нічому не вчитеся!

        Тому я готую **покрокові проєкти**, з якими можна працювати і в яких я _ХОЧУ_, щоб ви користувалися ШІ-агентами й доручали їм більшу частину роботи. Але при цьому я хочу, щоб ви **справді розуміли, що відбувається** на кожному етапі.

        Сенс цих проєктів у тому, щоб вивчити **всі різні складові створення програмного забезпечення**. Ви можете доєднатися до мене, поки я щось створюю, а я пояснюватиму, що саме я роблю та чому, а потім ви зможете разом із ШІ-агентом застосувати ті самі ідеї у своїх проєктах.

        Тільки **не підсідайте на дофамін** від того, що ШІ-агент виконує роботу за вас. Обовʼязково знаходьте час, щоб зрозуміти, що відбувається!

        Сподіваюся, скоро побачимося [на прямій трансляції](https://youtube.com/@jiki-coding)!

        Дякую, що прочитали!
        Джеремі
    premium:
      subject: "Отримайте більше від Jiki (і допоможіть нам)"
      preview: "Ми зробили Jiki безкоштовним, бо хочемо, щоб він був доступний кожному"
      greeting: "Вітаю,"
      body_markdown: |
        Ми зробили Jiki безкоштовним, бо хочемо, щоб він був **доступний кожному**, незалежно від фінансової ситуації. Кожен отримує сотні годин вправ і відео, і все це без підводних каменів.

        Але **утримання Jiki коштує грошей**, а нам треба платити за оренду житла та мати змогу купувати їжу (🍜) і кофеїн (☕), тож ми додали тариф Premium із кількома додатковими перевагами, які, гадаю, справді вам допоможуть:
        - **Запитати Jiki**: наш ШІ-чат, який допоможе швидко зрушити з місця, коли ви застрягли, або розібратися з вашими питаннями.
        - **Преміум-проєкти**: складніші вправи, у яких можна поєднати навички, які ви опановуєте.
        - **Шлях розробника (Learn to Build)**: ще купа матеріалів, де можна вчитися разом зі мною.
        - **Значки**: показуйте свою підтримку на сайті та у просторах спільноти за допомогою значків Premium.

        Ми зробили його дуже доступним завдяки **паритету купівельної спроможності**. Це означає, що Premium коштує приблизно стільки ж, скільки два напої на винос у вашій країні, тож ціна має здаватися прийнятною, де б ви не були у світі.

        Якщо вам подобається Jiki, ви хочете **пришвидшити своє навчання** та підтримати мене й команду Jiki, будь ласка, [перейдіть на Premium](https://jiki.io/premium).

        Дякую,
        Джеремі
    community:
      subject: "Не мучтеся наодинці, приєднуйтеся до спільноти Jiki"
      preview: "Навчатися будь-чому набагато легше, коли ви частина групи."
      greeting: "Вітаю,"
      body_markdown: |
        Ваші шанси досягти успіху в навчанні стрімко зростуть, якщо ви **приєднаєтеся до групи.** З програмуванням так само.

        Якщо хочете отримати допомогу, поговорити про свою подорож у світ програмування чи просто провести час з іншими, ось кілька місць для цього:
        - [Наш форум](https://jiki.io/r/forum): місце для неспішних, розлогих розмов. Тут можна **зануритися в атмосферу**.
        - [Discord Exercism](https://jiki.io/r/discord): місце для **живого спілкування** з тими, хто зараз онлайн. Шукайте канали #jiki-chat і #jiki-get-help.
        - [YouTube](https://jiki.io/r/youtube): приєднуйтеся до наших сесій AMA (запитай мене про будь-що) та інших **прямих трансляцій**, щоб поставити мені свої запитання!

        Памʼятайте, що в цих просторах є люди з багатьох різних культур, тож **будь ласка, ставтеся з повагою** до всіх під час спілкування.

        До зустрічі!
        Джеремі
