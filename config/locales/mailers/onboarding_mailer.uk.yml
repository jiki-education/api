uk:
  onboarding_mailer:
    overview:
      subject: "Чи доводилося бачити «Карате кід»?"
      preview: "Одне з найчастіших питань, які мені ставлять: для кого призначений Jiki."
      greeting: "Вітаю!"
      body_markdown: |
        Фраза **«Wax on, wax off»** стала синонімом навчання складних речей. Вона походить із фільму _«Карате кід»_, де Деніел (наш хлопець-каратист) просить учителя (містера Міяґі) навчити його карате. Замість того щоб вчити його ударів руками й ногами, містер Міяґі змушує його виконувати хатню роботу, передусім натирати воском машини. Уся увага на тому, щоб рухи були точними й правильними, і виявляється (спойлер), що ця дисципліна розвиває навички, які переносяться на карате, а саме повторюване тренування тіла дає результат.

        Програмування трохи схоже на це, тільки для розуму, а не для тіла. Усі ми хочемо вміти створювати цікаві речі з першого дня, але понад усе нам потрібні справді міцні основи. Нам треба **тренувати свій мозок** правильно й розвивати правильний спосіб мислення.

        - **Якщо ми тільки починаємо програмувати**, Jiki проведе нас через ці розумові вправи (сподіваюся, цікавіше, ніж натирати воском машини!) і навчить усього, що потрібно знати.
        - **Якщо ми вже якийсь час програмуємо**, може здаватися, що ми тупцюємо на тих самих основах і не рухаємося вперед. Але, як і Деніел із натиранням машин, у правильному проходженні цих ранніх етапів є величезна цінність. Залишаймося з Jiki, і ми допоможемо розвинути **глибоке програмістське мислення й міцні базові навички**.

        Я дуже радий, що ми разом! Якщо виникнуть запитання, достатньо відповісти на цей лист. Я жива людина і залюбки допоможу 🙂

        Дякую, що прочитали!
        Джеремі
    coding:
      subject: "Яку мову програмування вивчати?"
      preview: "Кажуть, що навчатися програмуванню складно й технічно."
      greeting: "Вітаю знову!"
      body_markdown: |
        Кажуть, що навчатися програмуванню складно й технічно. Коли я починав учитися програмувати, я був восьмирічною дитиною, яка не знала про програмування нічого, крім того, що **раптом можу робити класні речі**. Я не знав, що це має бути складно. Я просто знав, що в мене раптом зʼявився новий вихід для творчості.

        Більшість початківців витрачають купу часу на те, щоб вирішити, яку мову програмування вивчати. [Це не має значення](https://jiki.io/blog/just-learn-to-code). Важливо добре зрозуміти, **як працює програмування**, і саме цього навчає Jiki.

        У міру поступу буватимуть моменти, коли програмування справді здаватиметься складним і дратівливим. Але це не тому, що _програмування_ складне, а тому, що **навчання складне**. Якщо ми хочемо стати добрими в чомусь, доводиться проходити через етапи, коли виклик здається надто великим, і все одно не здаватися.

        Jiki доведе нас до моменту, коли ми розуміємо код, а далі на нашому партнерському сайті Exercism можна вивчити будь-яку з **85 різних мов програмування**!

        У нас усе вийде!
        Джеремі
    premium:
      subject: "Отримати більше від Jiki (і допомогти нам)"
      preview: "Ми зробили Jiki безкоштовним, бо хочемо, щоб він був доступний кожному незалежно від статків."
      greeting: "Вітаю!"
      body_markdown: |
        Ми зробили Jiki безкоштовним, бо хочемо, щоб він був **доступний кожному** незалежно від фінансового становища. Кожен отримує сотні годин вправ і відео, і все це доступне без жодних вимог взамін.

        Але **утримання Jiki коштує грошей**, і нам треба платити за оренду, а ще мати на їжу (🍜) і кофеїн (☕), тож ми додали рівень Преміум з кількома додатковими перевагами, які, думаю, справді допоможуть:
        - **Ніколи не застрягати** завдяки необмеженій підтримці Ask Jiki.
        - **Вийти за власні межі** з Преміум-викликами.
        - **Бути частиною спільноти** завдяки регулярним живим трансляціям.
        - **Копати глибше** з повним каталогом покрокових розборів.
        - **Показати свої навички** з офіційним сертифікатом.
        - **Зберігати зосередженість** завдяки навчанню без реклами.
        - **Отримувати ранній доступ** до нових можливостей.
        - **Показати свою підтримку** Преміум-значками на сайті й у просторах спільноти.

        Ми зробили Преміум дуже доступним завдяки **паритету купівельної спроможності**. Це означає, що він коштує приблизно як два напої на виніс у кожній країні, тож ціна має здаватися прийнятною будь-де у світі.

        Якщо Jiki нам до вподоби, якщо хочемо **прискорити навчання** й підтримати мене та команду Jiki, тоді [переходьмо на Преміум](https://jiki.io/premium).

        Дякую,
        Джеремі
    community:
      subject: "Не мучтеся наодинці, приєднуйтеся до спільноти Jiki"
      preview: "Навчатися будь-чому набагато легше, коли ви частина групи."
      greeting: "Вітаю,"
      body_markdown: |
        Ваші шанси досягти успіху в навчанні стрімко зростуть, якщо ви **приєднаєтеся до групи.** З програмуванням так само.

        Якщо хочете отримати допомогу, поговорити про свою подорож у світ програмування чи просто провести час з іншими, ось кілька місць для цього:
        - [Наш форум](https://jiki.io/r/forum): місце для неспішних, розлогих розмов. Тут можна **зануритися в атмосферу**.
        - [Discord Exercism](https://jiki.io/r/discord): місце для **живого спілкування** з тими, хто зараз онлайн. Шукайте канали #jiki-chat і #jiki-get-help.
        - [YouTube](https://jiki.io/r/youtube): приєднуйтеся до наших сесій AMA (запитай мене про будь-що) та інших **прямих трансляцій**, щоб поставити мені свої запитання!

        Памʼятайте, що в цих просторах є люди з багатьох різних культур, тож **будь ласка, ставтеся з повагою** до всіх під час спілкування.

        До зустрічі!
        Джеремі
