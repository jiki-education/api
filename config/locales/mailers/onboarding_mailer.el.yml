el:
  onboarding_mailer:
    overview:
      subject: "Οι δύο πλευρές του να γίνεις προγραμματιστής το 2026"
      preview: "Τα τελευταία χρόνια μαθαίνω σιγά σιγά ιαπωνικά."
      greeting: "Γεια σου,"
      body_markdown: |
        Τα τελευταία χρόνια μαθαίνω **σιγά σιγά ιαπωνικά**. Επισκέπτομαι την Ιαπωνία τακτικά και προσπαθώ να βυθιστώ στη γλώσσα, αλλά είναι δύσκολο, γιατί στις μέρες μας, με τη βοήθεια του Google Translate, είναι πολύ εύκολο να περάσεις χρόνο στην Ιαπωνία χωρίς να πεις ούτε λέξη ιαπωνικά. **Έτσι ο εγκέφαλός μου μπορεί να τεμπελιάσει**, αλλά τα καταφέρνω μια χαρά.

        Ο προγραμματισμός έχει αρχίσει πρόσφατα να ακολουθεί την ίδια πορεία. Τα τελευταία 30 χρόνια, αν ήθελες να κάνεις οτιδήποτε με την τεχνολογία, **έπρεπε να μάθεις προγραμματισμό**. Ήταν ο μόνος τρόπος να επικοινωνήσεις με έναν υπολογιστή. Όμως τα τελευταία δύο χρόνια, με την άνοδο του προγραμματισμού με πράκτορες, αυτό έχει αλλάξει. Τώρα μπορείς να χρησιμοποιήσεις τη μητρική σου γλώσσα και να πεις σε έναν πράκτορα τεχνητής νοημοσύνης τι θέλεις να κάνει, και **αυτός θα γράψει τον κώδικα για σένα**, μεταφράζοντας τις οδηγίες σου στον υπολογιστή.

        Ακριβώς όπως δε χρειάζεται να περιμένω να μιλάω άπταιστα ιαπωνικά για να εξερευνήσω την Ιαπωνία, **δεν έχει πλέον κανένα νόημα να περνάς χρόνια για να γίνεις καλός στον προγραμματισμό** πριν αρχίσεις να φτιάχνεις πράγματα.

        Αλλά αν θέλω πραγματικά να μπω στην ιαπωνική κουλτούρα και να κάνω Ιάπωνες φίλους, πρέπει να μάθω ιαπωνικά. Και, αν θέλεις να μπεις στον χώρο της τεχνολογίας, πρέπει ακόμα να μάθεις προγραμματισμό. Ο κώδικας ο ίδιος δεν είναι πλέον ο περιοριστικός παράγοντας, αλλά είναι **η διαφορά ανάμεσα στο "να τα βγάζεις πέρα" και στο να ευδοκιμείς πραγματικά**.

        Για να γίνεις καλός γρήγορα, χώρισε τον χρόνο μάθησής σου σε δύο κομμάτια:
        1. **Μάθε προγραμματισμό.** Δούλεψε μέσα από το μάθημα Coding Fundamentals του Jiki και θα αποκτήσεις γερές βάσεις.
        2. **Φτιάξε πράγματα.** Δούλεψε μέσα από το "Learn to Build", μπαίνοντας στα βαθιά, δημιουργώντας προϊόντα που μπορούν πραγματικά να χρησιμοποιήσουν οι άνθρωποι!

        Αν θέλεις να μάθεις περισσότερα για τις σκέψεις μου σχετικά με το **πώς να μπεις στον χώρο της τεχνολογίας το 2026**, διάβασε [αυτό το άρθρο στο blog](https://jiki.io/blog/how-to-get-into-tech-in-2026).

        Τις επόμενες μέρες, θα σου πω λίγα περισσότερα τόσο για τον προγραμματισμό όσο και για την κατασκευή, και πώς μπορείς να αξιοποιήσεις στο έπακρο το [Jiki](https://jiki.io). Μέχρι τότε, **ρίξου στη δουλειά και διασκέδασε!**

        Ευχαριστώ που το διάβασες!
        Jeremy
    coding:
      subject: "Χτίσε γερές βάσεις στον προγραμματισμό"
      preview: "Η εκμάθηση προγραμματισμού έχει τη φήμη ότι είναι τεχνική και δύσκολη."
      greeting: "Γεια σου ξανά,"
      body_markdown: |
        Η εκμάθηση προγραμματισμού έχει τη φήμη ότι είναι τεχνική και δύσκολη. Όταν ξεκίνησα να μαθαίνω προγραμματισμό, ήμουν ένα 8χρονο παιδί που δεν ήξερε τίποτα για τον προγραμματισμό εκτός από το ότι **ξαφνικά μπορούσα να φτιάχνω ωραία πράγματα**. Δεν ήξερα ότι υποτίθεται ότι ήταν δύσκολο. Απλώς ήξερα ότι ξαφνικά είχα μια νέα διέξοδο για τη δημιουργικότητά μου.

        Καθώς μαθαίνεις προγραμματισμό, **δε θέλω να το βλέπεις ως κάποια τεχνική πειθαρχία που πρέπει να κατακτήσεις**, θέλω να το βλέπεις ως ένα μέρος όπου μπορείς να απελευθερώσεις τη **δική σου** δημιουργικότητα, όπου μπορείς να **διασκεδάσεις φτιάχνοντας πράγματα** και λύνοντας γρίφους. Γιατί αυτό είναι πραγματικά ο προγραμματισμός - επίλυση προβλημάτων.

        Δεν έχει σημασία [ποια γλώσσα προγραμματισμού μαθαίνεις](https://jiki.io/blog/just-learn-to-code), αυτό που έχει σημασία είναι να αποκτήσεις πραγματικά καλή κατανόηση του **πως λειτουργεί ο προγραμματισμός**.

        Καθώς προχωράς, θα υπάρξουν στιγμές που ο προγραμματισμός θα σου φαίνεται δύσκολος και απογοητευτικός. Αλλά αυτό δε συμβαίνει επειδή ο _προγραμματισμός_ είναι δύσκολος, αλλά επειδή **η μάθηση είναι δύσκολη**. Αν θέλεις να γίνεις καλός σε οτιδήποτε, πρέπει να περάσεις από φάσεις όπου η πρόκληση μοιάζει υπερβολική, αλλά πρέπει να επιμείνεις.

        Αν δεν είσαι σίγουρος αν το κομμάτι του προγραμματισμού αξίζει τον κόπο, ρίξε μια ματιά σε [αυτό το άρθρο στο blog](https://jiki.io/blog/should-i-still-learn-to-code-in-2026) που εξηγεί γιατί πρέπει να μάθεις ακόμα προγραμματισμό το 2026.

        Ευχαριστώ που το διάβασες!
        Jeremy
    building:
      subject: "Ο καλύτερος τρόπος να μάθεις είναι να φτιάχνεις πράγματα!"
      preview: "Πραγματικά πιστεύω ότι τώρα είναι η καλύτερη δυνατή στιγμή για να μπεις στον χώρο της τεχνολογίας."
      greeting: "Γεια σου,"
      body_markdown: |
        Πραγματικά πιστεύω ότι **τώρα είναι η καλύτερη δυνατή στιγμή για να μπεις στον χώρο της τεχνολογίας**. Ποτέ δεν υπήρξε ευκολότερη εποχή για να μάθεις τα βασικά και να μπορείς γρήγορα να φτιάχνεις πράγματα.

        Αλλά (και αυτό είναι ένα μεγάλο αλλά!) εκεί που πολλοί άνθρωποι κάνουν λάθος είναι ότι παραδίδουν εντελώς τα ηνία σε έναν πράκτορα τεχνητής νοημοσύνης και δε μαθαίνουν πραγματικά. Και αυτό φαίνεται υπέροχο για λίγο - μπορείς μαγικά να κάνεις όλα αυτά τα πράγματα να εμφανίζονται - αλλά αν το μόνο που κάνεις είναι να λες στον Claude ή στο ChatGPT τι να κάνει, δε μαθαίνεις πραγματικά τίποτα!

        Έτσι, ετοιμάζω **βήμα-βήμα πρότζεκτ** με τα οποία μπορείς να δουλέψεις, όπου _ΘΕΛΩ_ να χρησιμοποιείς πράκτορες τεχνητής νοημοσύνης για να κάνουν μεγάλο μέρος της δουλειάς για σένα. Αλλά όπου θέλω να σιγουρευτείς ότι **πραγματικά καταλαβαίνεις τι συμβαίνει** σε κάθε στάδιο.

        Το νόημα αυτών των πρότζεκτ είναι να μπορέσεις να μάθεις **όλα τα διαφορετικά κομμάτια της ανάπτυξης λογισμικού**. Μπορείς να με συνοδεύσεις καθώς φτιάχνω πράγματα, και θα εξηγήσω ακριβώς τι κάνω και γιατί, και μετά μπορείς να συνεργαστείς με έναν πράκτορα τεχνητής νοημοσύνης για να εφαρμόσεις αυτές τις ίδιες ιδέες στα δικά σου πρότζεκτ.

        Απλώς **μην εθιστείς στις δόσεις ντοπαμίνης** βλέποντας τον πράκτορα τεχνητής νοημοσύνης να κάνει τη δουλειά για σένα. Φρόντισε να αφιερώσεις χρόνο για να καταλάβεις τι συμβαίνει!

        Ελπίζω να σε δω [σε μια ζωντανή μετάδοση](https://youtube.com/@jiki-coding) σύντομα!

        Ευχαριστώ που το διάβασες!
        Jeremy
    premium:
      subject: "Αξιοποίησε περισσότερο το Jiki (και βοήθησέ μας)"
      preview: "Προσφέρουμε το Jiki δωρεάν επειδή θέλουμε να είναι προσβάσιμο σε όλους ανεξάρτητα"
      greeting: "Γεια σου,"
      body_markdown: |
        Προσφέρουμε το Jiki δωρεάν επειδή θέλουμε να είναι **προσβάσιμο σε όλους** ανεξάρτητα από την οικονομική τους κατάσταση. Όλοι έχουν πρόσβαση σε εκατοντάδες ώρες ασκήσεων και βίντεο, όλα διαθέσιμα χωρίς να ζητάμε τίποτα σε αντάλλαγμα.

        Αλλά **το Jiki κοστίζει χρήματα για να λειτουργεί**, και πρέπει να μπορούμε να πληρώνουμε τα ενοίκιά μας και να αγοράζουμε φαγητό (🍜) και καφεΐνη (☕), οπότε προσθέσαμε μια βαθμίδα Premium που προσφέρει κάποια επιπλέον οφέλη που νομίζω ότι θα σε βοηθήσουν πραγματικά:
        - **Ask Jiki**: Η τεχνητή νοημοσύνη μας για συνομιλία που σε βοηθά να ξεκολλήσεις γρήγορα ή να εξερευνήσεις τις ερωτήσεις σου.
        - **Premium Projects**: Πιο δύσκολες ασκήσεις, όπου μπορείς να συνδυάσεις τις δεξιότητες που μαθαίνεις.
        - **Learn to Build**: Πολύ περισσότερο περιεχόμενο όπου μπορείς να μάθεις δίπλα μου.
        - **Badges**: Δείξε την υποστήριξή σου στον ιστότοπο και σε κοινοτικούς χώρους με τα σήματα Premium.

        Το κάναμε εξαιρετικά προσιτό χρησιμοποιώντας **τιμολόγηση προσαρμοσμένη στην τοπική αγοραστική δύναμη**. Αυτό σημαίνει ότι το Premium κοστίζει περίπου όσο δύο ροφήματα για το δρόμο στη χώρα σου, οπότε θα πρέπει να φαίνεται λογική τιμή όπου κι αν βρίσκεσαι στον κόσμο.

        Αν απολαμβάνεις το Jiki, θέλεις να **επιταχύνεις τη μάθησή σου** και θέλεις να υποστηρίξεις εμένα και την ομάδα του Jiki, τότε σε παρακαλώ [αναβάθμισε σε Premium](https://jiki.io/premium).

        Ευχαριστώ,
        Jeremy
    community:
      subject: "Μην παλεύεις μόνος - Μπες στην κοινότητα του Jiki"
      preview: "Είναι πολύ πιο πιθανό να πετύχεις μαθαίνοντας κάτι αν είσαι μέλος μιας ομάδας."
      greeting: "Γεια σου,"
      body_markdown: |
        Είναι πολύ πιο πιθανό να πετύχεις μαθαίνοντας οτιδήποτε αν **είσαι μέλος μιας ομάδας**. Ο προγραμματισμός δε διαφέρει.

        Αν θα ήθελες να λάβεις βοήθεια, να συζητήσεις για την πορεία σου στον προγραμματισμό ή απλώς να κάνεις παρέα με άλλους, υπάρχουν μερικά μέρη για να το κάνεις:
        - [Το φόρουμ μας](https://jiki.io/r/forum): Το μέρος για πιο αργές, εκτενείς συζητήσεις. **Πήγαινε πιο βαθιά** εδώ.
        - [Το Discord του Exercism](https://jiki.io/r/discord): Το μέρος για **ζωντανή συνομιλία** με άλλους που είναι συνδεδεμένοι. Ψάξε για τα κανάλια #jiki-chat και #jiki-get-help.
        - [YouTube](https://jiki.io/r/youtube): Πάρε μέρος στις συνεδρίες ερωτήσεων και απαντήσεων (Ask Me Anything) και σε άλλες **ζωντανές μεταδόσεις** για να μου κάνεις τις ερωτήσεις σου!

        Θυμήσου ότι σε αυτούς τους χώρους υπάρχουν άνθρωποι από πολλούς διαφορετικούς πολιτισμούς, οπότε **σε παρακαλώ να είσαι ευγενικός** με όλους όσο συνομιλείς.

        Τα λέμε εκεί!
        Jeremy
