el:
  onboarding_mailer:
    overview:
      subject: "Έχεις δει ποτέ το \"Karate Kid\";"
      preview: "Μία από τις ερωτήσεις που μου κάνουν πιο συχνά είναι σε ποιον απευθύνεται το Jiki."
      greeting: "Γεια σου,"
      body_markdown: |
        Η φράση **"Wax on, wax off"** έχει γίνει συνώνυμη με το να μαθαίνεις δύσκολα πράγματα. Προέρχεται από το _The Karate Kid_, όπου ο Ντάνιελ (ο δικός μας καράτε κιντ) ζητάει από έναν δάσκαλο (τον κύριο Μιγιάγκι) να του μάθει καράτε. Αντί να του μάθει κλωτσιές και γροθιές, ο κύριος Μιγιάγκι τον βάζει να κάνει δουλειές του σπιτιού, και πιο διάσημη απ' όλες, να γυαλίζει αυτοκίνητα. Το ζητούμενο είναι να κάνεις τις κινήσεις ακριβώς σωστά, και τελικά (σπόιλερ) αυτή η πειθαρχία χτίζει δεξιότητες που μεταφέρονται στο καράτε, και η επαναλαμβανόμενη εκγύμναση του σώματος είναι αυτό που σε κάνει καλό.

        Ο προγραμματισμός είναι λίγο παρόμοιος, αλλά για το μυαλό, όχι για το σώμα. Όλοι θέλουμε να μπορούμε να φτιάχνουμε ενδιαφέροντα πράγματα από την πρώτη μέρα, αλλά πάνω απ' όλα χρειάζεται να χτίσουμε πολύ γερές βάσεις. Χρειάζεται να **γυμνάσουμε το μυαλό μας** με τον σωστό τρόπο και να αναπτύξουμε τον σωστό τρόπο σκέψης.

        - **Αν μόλις ξεκινάς τον προγραμματισμό**, το Jiki θα σε περάσει από αυτές τις νοητικές ασκήσεις (ελπίζουμε με πιο ενδιαφέροντα τρόπο απ' ό,τι το γυάλισμα αυτοκινήτων!) και θα σου μάθει όλα όσα χρειάζεται να ξέρεις.
        - **Αν προγραμματίζεις καιρό**, μπορεί να νιώθεις ότι πατάς ξανά και ξανά τα ίδια βασικά, χωρίς να προχωράς. Όμως, όπως ο Ντάνιελ που γυάλιζε αυτοκίνητα, υπάρχει τεράστια αξία στο να κάνεις σωστά αυτά τα πρώτα στάδια. Μείνε με το Jiki και θα σε βοηθήσουμε να αναπτύξεις **βαθιά προγραμματιστική νοοτροπία και γερές θεμελιώδεις δεξιότητες**.

        Χαίρομαι πολύ που είσαι μαζί μας! Αν έχεις ερωτήσεις, απλώς απάντησε σε αυτό το email. Είμαι άνθρωπος και θα χαρώ να βοηθήσω 🙂

        Ευχαριστώ που το διάβασες!
        Jeremy
    coding:
      subject: "Ποια γλώσσα προγραμματισμού να μάθω;"
      preview: "Η εκμάθηση προγραμματισμού έχει τη φήμη ότι είναι τεχνική και δύσκολη."
      greeting: "Γεια σου ξανά,"
      body_markdown: |
        Η εκμάθηση προγραμματισμού έχει τη φήμη ότι είναι τεχνική και δύσκολη. Όταν άρχισα να μαθαίνω προγραμματισμό, ήμουν ένα παιδί 8 χρονών που δεν ήξερε τίποτα για τον προγραμματισμό πέρα από το ότι **ξαφνικά μπορούσα να φτιάχνω ωραία πράγματα**. Δεν ήξερα ότι υποτίθεται ότι είναι δύσκολο. Ήξερα μόνο ότι ξαφνικά είχα μια νέα διέξοδο για τη δημιουργικότητά μου.

        Οι περισσότεροι αρχάριοι περνούν ατελείωτες ώρες προσπαθώντας να αποφασίσουν ποια γλώσσα προγραμματισμού να μάθουν. [Δεν έχει σημασία](https://jiki.io/blog/just-learn-to-code). Αυτό που έχει σημασία είναι να αποκτήσεις πολύ καλή κατανόηση του **πώς λειτουργεί ο προγραμματισμός**, και αυτό είναι που σου μαθαίνει το Jiki.

        Καθώς προχωράς, θα υπάρξουν στιγμές που ο προγραμματισμός θα σου φαίνεται πραγματικά δύσκολος και κουραστικός. Δε φταίει όμως ότι ο _προγραμματισμός_ είναι δύσκολος, φταίει ότι **η μάθηση είναι δύσκολη**. Αν θέλεις να γίνεις καλός σε κάτι, πρέπει να περάσεις από φάσεις όπου η πρόκληση μοιάζει υπερβολική, και να επιμείνεις.

        Το Jiki θα σε φτάσει στο σημείο να καταλαβαίνεις τον κώδικα, και μετά μπορείς να χρησιμοποιήσεις την αδελφή μας ιστοσελίδα, το Exercism, για να μάθεις οποιαδήποτε από τις **85 διαφορετικές γλώσσες προγραμματισμού**!

        Τα καταφέρνεις!
        Jeremy
    premium:
      subject: "Πάρε περισσότερα από το Jiki (και βοήθησέ μας)"
      preview: "Κάναμε το Jiki δωρεάν γιατί θέλουμε να είναι προσβάσιμο σε όλους, ανεξαρτήτως οικονομικής κατάστασης."
      greeting: "Γεια σου,"
      body_markdown: |
        Κάναμε το Jiki δωρεάν γιατί θέλουμε να είναι **προσβάσιμο σε όλους**, ανεξάρτητα από την οικονομική τους κατάσταση. Όλοι έχουν εκατοντάδες ώρες ασκήσεων και βίντεο, όλα διαθέσιμα χωρίς να ζητάμε τίποτα σε αντάλλαγμα.

        Όμως **το Jiki κοστίζει για να λειτουργεί**, και πρέπει να μπορούμε να πληρώνουμε το νοίκι μας και να έχουμε χρήματα για φαγητό (🍜) και καφεΐνη (☕), οπότε προσθέσαμε ένα πακέτο Premium με μερικά επιπλέον προνόμια που πιστεύω ότι θα σε βοηθήσουν πραγματικά:
        - **Μη μένεις ποτέ κολλημένος** με απεριόριστη υποστήριξη Ask Jiki.
        - **Πήγαινε πιο μακριά** με τις προκλήσεις Premium.
        - **Γίνε μέρος της κοινότητας** με τακτικές ζωντανές μεταδόσεις.
        - **Εμβάθυνε** με τον πλήρη κατάλογο αναλυτικών λύσεων.
        - **Ανέδειξε τις δεξιότητές σου** με ένα επίσημο πιστοποιητικό.
        - **Μείνε συγκεντρωμένος** με εμπειρία μάθησης χωρίς διαφημίσεις.
        - **Απόκτησε πρώιμη πρόσβαση** σε νέες λειτουργίες.
        - **Δείξε την υποστήριξή σου** με σήματα Premium στον ιστότοπο και στους χώρους της κοινότητας.

        Το κάναμε εξαιρετικά προσιτό χρησιμοποιώντας **τιμολόγηση προσαρμοσμένη στην τοπική αγοραστική δύναμη**. Αυτό σημαίνει ότι το Premium κοστίζει περίπου όσο δύο ποτά σε πακέτο στη χώρα σου, οπότε θα σου φαίνεται λογική τιμή όπου κι αν βρίσκεσαι στον κόσμο.

        Αν σου αρέσει το Jiki, θέλεις να **επιταχύνεις τη μάθησή σου** και θέλεις να στηρίξεις εμένα και την ομάδα του Jiki, τότε [αναβάθμισε σε Premium](https://jiki.io/premium).

        Ευχαριστώ,
        Jeremy
    community:
      subject: "Μην παλεύεις μόνος - Μπες στην κοινότητα του Jiki"
      preview: "Είναι πολύ πιο πιθανό να πετύχεις μαθαίνοντας κάτι αν είσαι μέλος μιας ομάδας."
      greeting: "Γεια σου,"
      body_markdown: |
        Είναι πολύ πιο πιθανό να πετύχεις μαθαίνοντας οτιδήποτε αν **είσαι μέλος μιας ομάδας**. Ο προγραμματισμός δε διαφέρει.

        Αν θα ήθελες να λάβεις βοήθεια, να συζητήσεις για την πορεία σου στον προγραμματισμό ή απλώς να κάνεις παρέα με άλλους, υπάρχουν μερικά μέρη για να το κάνεις:
        - [Το φόρουμ μας](https://jiki.io/r/forum): Το μέρος για πιο αργές, εκτενείς συζητήσεις. **Πήγαινε πιο βαθιά** εδώ.
        - [Το Discord του Exercism](https://jiki.io/r/discord): Το μέρος για **ζωντανή συνομιλία** με άλλους που είναι συνδεδεμένοι. Ψάξε για τα κανάλια #jiki-chat και #jiki-get-help.
        - [YouTube](https://jiki.io/r/youtube): Πάρε μέρος στις συνεδρίες ερωτήσεων και απαντήσεων (Ask Me Anything) και σε άλλες **ζωντανές μεταδόσεις** για να μου κάνεις τις ερωτήσεις σου!

        Θυμήσου ότι σε αυτούς τους χώρους υπάρχουν άνθρωποι από πολλούς διαφορετικούς πολιτισμούς, οπότε **σε παρακαλώ να είσαι ευγενικός** με όλους όσο συνομιλείς.

        Τα λέμε εκεί!
        Jeremy
