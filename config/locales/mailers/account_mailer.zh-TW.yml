zh-TW:
  account_mailer:
    welcome:
      subject: "歡迎加入 Jiki！"
      greeting: "你好，"
      body_markdown: |
        歡迎來到 [Jiki](https://jiki.io)！我們真的很開心能在這裡見到你。

        Jiki 的設計，就是要帶你從完全的初學者，一路成為有自信的開發者。你會動手做有趣的專案、解決有意思的問題，一次一小步地慢慢前進，並在過程中學到很多東西。

        如果遇到卡住的地方，或有任何問題，別客氣，隨時和我們聯絡。一開始學寫程式可能會覺得有點吃不消，但你一定可以的喔！

        祝你玩得開心，好好享受這趟旅程喔！

        祝好，  
        Jeremy 與團隊
    account_deletion_confirmation:
      subject: "確認刪除你的帳號"
      preview: "請確認你想永久刪除你的 Jiki 帳號"
      greeting: "你好，"
      body_markdown: |
        我們收到了一項請求，要刪除你的 Jiki 帳號。

        如果這是你本人提出的要求，請點擊下方按鈕確認。這個動作是永久的，無法復原，你所有的學習進度和資料都會被刪除。

        如果不是你提出的，你可以放心忽略這封郵件，你的帳號不會有任何改變。
      cta: "刪除我的帳號"
