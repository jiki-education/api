fa:
  onboarding_mailer:
    overview:
      subject: "فیلم The Karate Kid را دیده‌اید؟"
      preview: "یکی از پرسش‌هایی که بیشتر از همه از من می‌شود این است که جیکی برای چه کسانی است."
      greeting: "سلام،"
      body_markdown: |
        عبارت **«Wax on, wax off»** با یادگیری کارهای سخت گره خورده است. این عبارت از فیلم _The Karate Kid_ می‌آید، جایی که دانیل (بچه کاراته‌کار ما) از یک معلم (آقای میاگی) می‌خواهد کاراته را به او یاد بدهد. آقای میاگی به جای اینکه به او یاد بدهد چطور لگد بزند و مشت بزند، از او می‌خواهد کارهای خانه را انجام دهد که مشهورترین‌شان واکس زدن ماشین‌هاست. تمرکز روی انجام دقیق و درست حرکت‌هاست و در پایان (اسپویل!) معلوم می‌شود که همین نظم و تکرار مهارت‌هایی می‌سازد که به کاراته منتقل می‌شوند و این تمرین دادن مکرر بدن است که شما را خوب می‌کند.

        برنامه‌نویسی هم کمی شبیه همین است، اما برای ذهن، نه بدن. همه‌ی ما می‌خواهیم از همان روز اول چیزهای جذاب بسازیم، اما بیش از هر چیز باید پایه‌های واقعاً محکمی بسازیم. باید مغزمان را به روش درست **تمرین بدهیم** و شیوه‌های درست فکر کردن را در خود پرورش دهیم.

        - **اگر تازه‌کار هستید**، جیکی شما را قدم به قدم در این تمرین‌های ذهنی همراهی می‌کند (امیدواریم به شکلی جذاب‌تر از واکس زدن ماشین!) و هر چیزی را که لازم است بدانید به شما یاد می‌دهد.
        - **اگر مدتی است برنامه‌نویسی می‌کنید**، شاید حس کنید که دارید همان مبانی همیشگی را دوباره طی می‌کنید و جلو نمی‌روید. اما درست مثل دانیل که ماشین واکس می‌زد، انجام درست همین مرحله‌های اول ارزش بسیار زیادی دارد. با جیکی بمانید تا به شما کمک کنیم **ذهنیت عمیق برنامه‌نویسی و مهارت‌های پایه‌ای محکم** بسازید.

        از اینکه به جمع ما پیوستید هیجان‌زده‌ام! اگر سؤالی داشتید، فقط همین ایمیل را پاسخ دهید. من یک آدم واقعی هستم و با خوشحالی کمک می‌کنم. 🙂

        ممنون که خواندید!
        جرمی
    coding:
      subject: "کدام زبان برنامه‌نویسی را یاد بگیرم؟"
      preview: "یاد گرفتن برنامه‌نویسی به سخت و فنی بودن شهره است."
      greeting: "سلام دوباره،"
      body_markdown: |
        یاد گرفتن برنامه‌نویسی به سخت و فنی بودن شهره است. وقتی شروع به یادگیری برنامه‌نویسی کردم، یک بچه‌ی ۸ ساله بودم که هیچ چیزی از برنامه‌نویسی نمی‌دانست، جز اینکه **حالا می‌توانستم چیزهای باحالی بسازم**. نمی‌دانستم قرار است سخت باشد. فقط می‌دانستم که ناگهان یک راه تازه برای خلاقیتم پیدا کرده‌ام.

        بیشتر تازه‌کارها مدت‌ها وقت صرف این می‌کنند که تصمیم بگیرند کدام زبان برنامه‌نویسی را یاد بگیرند. [این موضوع اهمیتی ندارد](https://jiki.io/blog/just-learn-to-code). چیزی که اهمیت دارد این است که درک خیلی خوبی از **اینکه برنامه‌نویسی چطور کار می‌کند** بسازید و جیکی دقیقاً همین را یاد می‌دهد.

        با پیشرفتتان، زمان‌هایی پیش می‌آید که برنامه‌نویسی واقعاً سخت و ناامیدکننده به نظر می‌رسد. اما این به خاطر سخت بودنِ _برنامه‌نویسی_ نیست، به خاطر این است که **یادگیری سخت است**. اگر می‌خواهید در هر کاری خوب شوید، باید دوره‌هایی را پشت سر بگذارید که چالش بیش از حد بزرگ به نظر می‌رسد و در همین دوره‌ها باید پایداری کنید.

        جیکی شما را به جایی می‌رساند که کد را بفهمید و بعد می‌توانید از وب‌سایت خواهر ما، Exercism، استفاده کنید و هر یک از **۸۵ زبان برنامه‌نویسی مختلف** را یاد بگیرید!

        شما از پسش برمی‌آیید!
        جرمی
    premium:
      subject: "بیشتر از جیکی بهره ببرید (و به ما کمک کنید)"
      preview: "جیکی را رایگان کردیم چون می‌خواهیم برای همه، در هر شرایطی، در دسترس باشد."
      greeting: "سلام،"
      body_markdown: |
        جیکی را رایگان کردیم چون می‌خواهیم **برای همه** در دسترس باشد، هر وضعیت مالی‌ای که داشته باشند. همه صدها ساعت تمرین و ویدیو دریافت می‌کنند، بدون اینکه چیزی در ازایش خواسته شود.

        اما **اجرای جیکی هزینه دارد** و ما باید اجاره‌مان را بدهیم و پول غذا (🍜) و کافئین (☕) را داشته باشیم، برای همین یک سطح پریمیوم اضافه کرده‌ایم که چند مزیت اضافه دارد و به نظرم واقعاً به کمکتان می‌آید:
        - **هیچ‌وقت گیر نکنید** با پشتیبانی نامحدود «از جیکی بپرسید».
        - **خودتان را بیشتر به چالش بکشید** با چالش‌های پریمیوم.
        - **بخشی از جامعه باشید** با پخش‌های زنده‌ی منظم.
        - **عمیق‌تر بروید** با کاتالوگ کامل راهنماهای قدم‌به‌قدم ما.
        - **مهارت‌هایتان را نشان دهید** با یک گواهی رسمی.
        - **متمرکز بمانید** با تجربه‌ی یادگیری بدون تبلیغات.
        - **دسترسی زودتر داشته باشید** به قابلیت‌های جدید.
        - **حمایتتان را نشان دهید** با نشان‌های پریمیوم در سایت و در فضاهای جامعه.

        جیکی را با **برابری قدرت خرید** خیلی مقرون‌به‌صرفه کرده‌ایم. یعنی هزینه‌ی پریمیوم تقریباً برابر با قیمت دو نوشیدنی بیرون‌بر در کشور شماست، پس هر جای دنیا که باشید باید قیمت معقولی به نظر برسد.

        اگر از جیکی لذت می‌برید، می‌خواهید **یادگیریتان را سرعت ببخشید** و از من و تیم جیکی حمایت کنید، لطفاً [به پریمیوم ارتقا دهید](https://jiki.io/premium).

        ممنون،
        جرمی
    community:
      subject: "تنها تقلا نکنید، به انجمن جیکی بپیوندید"
      preview: "اگر عضو یک گروه باشید، احتمال موفقیتتان در یادگیری خیلی بیشتر است."
      greeting: "سلام،"
      body_markdown: |
        اگر **عضو یک گروه باشید**، احتمال موفقیتتان در یادگیری هر چیزی خیلی بیشتر است. کدنویسی هم فرقی نمی‌کند.

        اگر دوست دارید کمک بگیرید، درباره‌ی مسیر کدنویسی‌تان گپ بزنید یا فقط با دیگران وقت بگذرانید، جاهایی برای این کار هست:
        - [انجمن ما](https://jiki.io/r/forum): جایی برای گفت‌وگوهای آرام‌تر و طولانی‌تر. **اینجا عمیق‌تر پیش بروید**.
        - [دیسکوردِ Exercism](https://jiki.io/r/discord): جایی برای **گفت‌وگوی هم‌زمان** با کسانی که آنلاین‌اند. کانال‌های #jiki-chat و #jiki-get-help را پیدا کنید.
        - [یوتیوب](https://jiki.io/r/youtube): در AMAهای ما (هرچه می‌خواهید بپرسید) و دیگر **پخش‌های زنده** شرکت کنید و سؤال‌هایتان را بپرسید!

        یادتان باشد که در این فضاها آدم‌هایی از فرهنگ‌های گوناگون حضور دارند، پس هنگام گفت‌وگو با همه **محترمانه رفتار کنید**.

        آنجا می‌بینمتان!
        جرمی
