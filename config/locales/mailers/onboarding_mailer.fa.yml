fa:
  onboarding_mailer:
    overview:
      subject: "دو نیمه‌ی برنامه‌نویس شدن در سال ۲۰۲۶"
      preview: "چند سالی است که آرام‌آرام ژاپنی یاد می‌گیرم."
      greeting: "سلام،"
      body_markdown: |
        این چند سال گذشته **آرام‌آرام ژاپنی یاد می‌گرفتم**. مرتب به ژاپن سفر می‌کنم و سعی می‌کنم در زبان غرق شوم، اما سخت است، چون این روزها با کمک Google Translate خیلی راحت می‌توان مدتی در ژاپن بود و حتی یک کلمه ژاپنی حرف نزد. **پس مغزم می‌تواند تنبل باشد**، اما با همین حال و احوال خوب کنار می‌آیم.

        کدنویسی هم اخیراً همین مسیر را در پیش گرفته است. در ۳۰ سال گذشته، اگر می‌خواستید با فناوری کاری انجام دهید، **باید کدنویسی یاد می‌گرفتید**. این تنها راه گفت‌وگو با رایانه بود. اما در دو سال گذشته، با ظهور کدنویسی عامل‌محور، این وضعیت عوض شده است. حالا می‌توانید به زبان مادری خودتان به یک عامل AI بگویید چه کاری می‌خواهید انجام دهد و **او کد را برایتان می‌نویسد**؛ یعنی دستورالعمل‌های شما را به زبان رایانه ترجمه می‌کند.

        همان‌طور که لازم نیست اول در ژاپنی روان شوم تا بتوانم ژاپن را کشف کنم، **دیگر هیچ منطقی ندارد که پیش از شروع ساختن، سال‌ها را صرف خوب شدن در کدنویسی کنید**.

        اما اگر بخواهم واقعاً در فرهنگ ژاپن غرق شوم و دوستانی ژاپنی پیدا کنم، باید ژاپنی یاد بگیرم. و اگر شما هم می‌خواهید وارد دنیای فناوری شوید، هنوز باید کدنویسی یاد بگیرید. کد دیگر نگهبان دروازه نیست، اما **تفاوت میان «سر کردن» و واقعاً شکوفا شدن است**.

        برای اینکه سریع خوب شوید، زمان یادگیری‌تان را به دو بخش تقسیم کنید:
        1. **برنامه‌نویسی را یاد بگیرید.** دوره‌ی مبانی برنامه‌نویسی جیکی را پیش ببرید و پایه‌های محکمی پیدا می‌کنید.
        2. **بسازید.** دوره‌ی «ساختن را یاد بگیرید» را پیش ببرید، در جزئیاتش غرق شوید و محصولاتی بسازید که مردم واقعاً بتوانند از آن‌ها استفاده کنند!

        اگر می‌خواهید بیشتر درباره‌ی نظرم در مورد **چگونگی ورود به دنیای فناوری در ۲۰۲۶** بدانید، [این پست وبلاگ](https://jiki.io/blog/how-to-get-into-tech-in-2026) را بخوانید.

        در چند روز آینده کمی بیشتر درباره‌ی هر دو بخش (کدنویسی و ساختن) و اینکه چطور می‌توانید بیشترین بهره را از [جیکی](https://jiki.io) ببرید برایتان می‌نویسم. تا آن موقع، **دست به کار شوید و خوش بگذرانید!**

        ممنون که خواندید!
        جرمی
    coding:
      subject: "مبانی محکم برنامه‌نویسی بسازید"
      preview: "یادگیری کدنویسی به سخت و فنی بودن معروف است."
      greeting: "سلام دوباره،"
      body_markdown: |
        یادگیری کدنویسی به فنی و سخت بودن معروف است. وقتی خودم شروع کردم به یادگیری کدنویسی، بچه‌ای ۸ ساله بودم که از برنامه‌نویسی هیچ سر در نمی‌آورد، جز اینکه **یک‌دفعه می‌توانستم چیزهای باحالی بسازم**. نمی‌دانستم قرار است سخت باشد. فقط می‌دانستم که یک‌دفعه راه تازه‌ای برای خلاقیتم پیدا کرده‌ام.

        همان‌طور که کدنویسی یاد می‌گیرید، **نمی‌خواهم آن را یک رشته‌ی فنی ببینید که باید در آن استاد شوید**؛ می‌خواهم آن را جایی ببینید که می‌توانید خلاقیت **خودتان** را آزاد کنید، جایی که **از ساختن و حل معماها لذت ببرید**. چون کدنویسی واقعاً همین است: حل مسئله.

        مهم نیست [چه زبان برنامه‌نویسی یاد می‌گیرید](https://jiki.io/blog/just-learn-to-code)؛ مهم این است که درک خیلی خوبی از **اینکه کدنویسی چطور کار می‌کند** پیدا کنید.

        در مسیر پیشرفت‌تان، زمان‌هایی می‌رسد که کدنویسی واقعاً سخت و ناامیدکننده به نظر می‌رسد. اما دلیلش این نیست که _کدنویسی_ سخت است، دلیلش این است که **یادگیری سخت است**. اگر می‌خواهید در هر کاری خوب شوید، باید دوره‌هایی را بگذرانید که چالش بیش از اندازه سنگین به نظر می‌رسد، اما باید پایداری کنید.

        اگر مطمئن نیستید که بخش کدنویسی ارزش این تلاش را دارد، [این پست وبلاگ](https://jiki.io/blog/should-i-still-learn-to-code-in-2026) را بخوانید؛ توضیح می‌دهد چرا هنوز در سال ۲۰۲۶ باید کدنویسی یاد بگیرید.

        ممنون که خواندید!
        جرمی
    building:
      subject: "بهترین راه یادگیری، ساختن است!"
      preview: "واقعاً باور دارم که الان بهترین زمان ممکن برای ورود به دنیای فناوری است."
      greeting: "سلام،"
      body_markdown: |
        واقعاً باور دارم که **الان بهترین زمان ممکن برای ورود به دنیای فناوری است**. تا حالا یادگیری مبانی و رسیدن سریع به مرحله‌ی ساختن این‌قدر آسان نبوده است.

        اما (و این «اما»ی بزرگی است!) خیلی‌ها از این جهت اشتباه می‌کنند که افسار کار را کامل به یک عامل AI می‌سپارند و واقعاً یاد نمی‌گیرند. این کار برای مدتی حس خیلی خوبی دارد، می‌توانید با یک جادو همه‌ی این‌ها را ظاهر کنید، اما اگر کارتان فقط این باشد که به Claude یا ChatGPT بگویید چه کار کنند، در واقع چیزی یاد نمی‌گیرید!

        بنابراین دارم **پروژه‌های گام‌به‌گامی** آماده می‌کنم که می‌توانید با آن‌ها کار کنید؛ پروژه‌هایی که در آن‌ها _می‌خواهم_ از عامل‌های AI استفاده کنید تا بخش زیادی از کار را برایتان انجام دهند، اما می‌خواهم مطمئن شوید که **در هر مرحله واقعاً می‌فهمید چه اتفاقی می‌افتد**.

        این پروژه‌ها به شما کمک می‌کنند **همه‌ی بخش‌های مختلف ساختن نرم‌افزار** را یاد بگیرید. می‌توانید همراه من باشید وقتی چیزی می‌سازم؛ دقیقاً توضیح می‌دهم چه کار می‌کنم و چرا، و بعد می‌توانید با یک عامل AI همان ایده‌ها را روی پروژه‌های خودتان پیاده کنید.

        فقط **به دوپامینِ اینکه عامل AI کارتان را انجام می‌دهد معتاد نشوید**. حتماً وقت بگذارید و بفهمید چه خبر است!

        امیدوارم به‌زودی [در یک پخش زنده](https://youtube.com/@jiki-coding) ببینمتان!

        ممنون که خواندید!
        جرمی
    premium:
      subject: "بیشتر از جیکی بهره ببرید (و به ما کمک کنید)"
      preview: "جیکی را رایگان کردیم چون می‌خواهیم برای همه در دسترس باشد."
      greeting: "سلام،"
      body_markdown: |
        جیکی را رایگان کردیم چون می‌خواهیم **برای همه در دسترس باشد**، فارغ از وضعیت مالی هر کس. همه صدها ساعت تمرین و ویدیو در اختیار دارند و در ازایش چیزی نمی‌خواهیم.

        اما **گرداندن جیکی هزینه دارد** و باید بتوانیم اجاره‌ی خانه‌مان را بدهیم و پول غذا (🍜) و کافئین (☕) داشته باشیم؛ بنابراین یک سطح Premium اضافه کرده‌ایم که چند مزیت بیشتر دارد و فکر می‌کنم واقعاً کمکتان می‌کند:
        - **از جیکی بپرسید**: چت AI ما که کمکتان می‌کند سریع از گیرافتادن بیرون بیایید یا سؤال‌هایتان را بررسی کنید.
        - **پروژه‌های Premium**: تمرین‌های سخت‌تر، که در آن‌ها می‌توانید مهارت‌هایی را که یاد می‌گیرید با هم ترکیب کنید.
        - **ساختن را یاد بگیرید**: کلی محتوای بیشتر که می‌توانید در کنار من یاد بگیرید.
        - **نشان‌ها**: با نشان‌های Premium پشتیبانی خودتان را در سایت و در فضاهای اجتماعی به نمایش بگذارید.

        با **برابری قدرت خرید** قیمت را واقعاً مناسب کرده‌ایم. یعنی هزینه‌ی Premium تقریباً اندازه‌ی قیمت دو نوشیدنی بیرون‌بر در کشور خودتان است، پس در هر جای دنیا که باشید قیمت معقولی به نظر می‌رسد.

        اگر از جیکی لذت می‌برید، می‌خواهید **به یادگیری خودتان سرعت بدهید** و دوست دارید از من و تیم جیکی حمایت کنید، لطفاً [به Premium ارتقا دهید](https://jiki.io/premium).

        سپاسگزارم،
        جرمی
    community:
      subject: "تنها تقلا نکنید، به انجمن جیکی بپیوندید"
      preview: "اگر عضو یک گروه باشید، احتمال موفقیتتان در یادگیری خیلی بیشتر است."
      greeting: "سلام،"
      body_markdown: |
        اگر **عضو یک گروه باشید**، احتمال موفقیتتان در یادگیری هر چیزی خیلی بیشتر است. کدنویسی هم فرقی نمی‌کند.

        اگر دوست دارید کمک بگیرید، درباره‌ی مسیر کدنویسی‌تان گپ بزنید یا فقط با دیگران وقت بگذرانید، جاهایی برای این کار هست:
        - [انجمن ما](https://jiki.io/r/forum): جایی برای گفت‌وگوهای آرام‌تر و طولانی‌تر. **اینجا عمیق‌تر پیش بروید**.
        - [دیسکوردِ Exercism](https://jiki.io/r/discord): جایی برای **گفت‌وگوی هم‌زمان** با کسانی که آنلاین‌اند. کانال‌های #jiki-chat و #jiki-get-help را پیدا کنید.
        - [یوتیوب](https://jiki.io/r/youtube): در AMAهای ما (هرچه می‌خواهید بپرسید) و دیگر **پخش‌های زنده** شرکت کنید و سؤال‌هایتان را بپرسید!

        یادتان باشد که در این فضاها آدم‌هایی از فرهنگ‌های گوناگون حضور دارند، پس هنگام گفت‌وگو با همه **محترمانه رفتار کنید**.

        آنجا می‌بینمتان!
        جرمی
