  onboarding_mailer:
    overview:
      subject: "هل سبق أن شاهدت فيلم Karate Kid؟"
      preview: "من أكثر الأسئلة التي تُطرح عليّ: لمن صُمّم Jiki؟"
      greeting: "مرحبًا،"
      body_markdown: |
        أصبحت عبارة **«Wax on, wax off»** مرادفةً لتعلّم الأشياء الصعبة. وهي تأتي من فيلم _The Karate Kid_، حيث يطلب دانيال (فتى الكاراتيه عندنا) من معلّم (السيد ميياغي) أن يعلّمه الكاراتيه. وبدلًا من تعليمه الركلات واللكمات، يكلّفه السيد ميياغي بأعمال المنزل، وأشهرها تلميع السيارات. التركيز هنا على أداء الحركات بدقة، ويتّضح (حرق أحداث) أن هذا الانضباط يبني مهارات قابلة للنقل إلى الكاراتيه، وأن تدريب جسدك مرارًا وتكرارًا هو ما يجعلك جيدًا.

        تعلّم البرمجة يشبه هذا قليلًا، لكنه للعقل لا للجسد. كلنا نريد أن نصنع أشياء ممتعة من اليوم الأول، لكننا قبل كل شيء نحتاج إلى أساسات متينة جدًا. نحتاج إلى **تدريب أدمغتنا** بالطريقة الصحيحة وتطوير طرق التفكير الصحيحة.

        - **إذا كنت جديدًا على البرمجة**، فسيأخذك Jiki عبر هذه التمارين الذهنية (ونأمل أن تكون أكثر متعة من تلميع السيارات!) ويعلّمك كل ما تحتاج إلى معرفته.
        - **إذا كنت تبرمج منذ فترة**، فقد تشعر أنك تدور على نفس الأساسيات دون أن تتقدّم. لكن تمامًا كما كان دانيال يلمّع السيارات، هناك قيمة كبيرة في أداء هذه المراحل الأولى على نحو سليم. ابقَ مع Jiki وسنساعدك على تطوير **عقلية برمجية عميقة ومهارات أساسية متينة**.

        يسعدني انضمامك إلينا! إن كان لديك أي سؤال، فما عليك إلا الردّ على هذا البريد. أنا إنسان ويسعدني مساعدتك 🙂

        شكرًا لقراءتك!
        Jeremy
    coding:
      subject: "ما لغة البرمجة التي يجب أن أتعلّمها؟"
      preview: "تعلّم البرمجة معروف بأنه تقني وصعب."
      greeting: "مرحبًا مجددًا،"
      body_markdown: |
        تعلّم البرمجة معروف بأنه تقني وصعب. حين بدأت تعلّم البرمجة، كنت طفلًا في الثامنة لا يعرف عن البرمجة سوى أنني **أستطيع فجأة صنع أشياء رائعة**. لم أكن أعرف أنه يُفترض أن يكون صعبًا. كنت أعرف فقط أن لديّ فجأة منفذًا جديدًا لإبداعي.

        يقضي معظم المبتدئين وقتًا طويلًا في محاولة الاختيار بين لغات البرمجة التي يجب تعلّمها. [لا يهم ذلك](https://jiki.io/blog/just-learn-to-code). المهم أن تبني فهمًا جيدًا حقًا لـ**كيف تعمل البرمجة**، وهذا ما يعلّمه Jiki.

        مع تقدّمك، ستأتي أوقات تشعر فيها أن البرمجة صعبة ومحبطة فعلًا. لكن السبب ليس أن _البرمجة_ صعبة، بل لأن **التعلّم صعب**. إذا أردت أن تبرع في أي شيء، فعليك أن تمرّ بمراحل يبدو فيها التحدي أكبر من طاقتك، لكن عليك أن تصبر وتواصل.

        سيأخذك Jiki إلى نقطة تفهم فيها الكود، وبعدها يمكنك استخدام موقعنا الشقيق، Exercism، لتعلّم أي من **85 لغة برمجة مختلفة**!

        أنت قادر على ذلك!
        Jeremy
    premium:
      subject: "استفد أكثر من Jiki (وساعدنا)"
      preview: "جعلنا Jiki مجانيًا ليكون في متناول الجميع."
      greeting: "مرحبًا،"
      body_markdown: |
        جعلنا Jiki مجانيًا لأننا نريده **متاحًا للجميع** بغضّ النظر عن حالتهم المالية. يحصل الجميع على مئات الساعات من التمارين والفيديوهات، متاحة كلها دون أن نطلب شيئًا في المقابل.

        لكن **تشغيل Jiki يكلّف مالًا**، ونحتاج إلى دفع الإيجار وتأمين الطعام (🍜) والكافيين (☕)، لذلك أضفنا خطة Premium تمنح بعض المزايا الإضافية التي أظنها ستساعدك حقًا:
        - **لا تعلق أبدًا** مع دعم Ask Jiki غير المحدود.
        - **ادفع نفسك أكثر** مع تحديات Premium.
        - **كن جزءًا من المجتمع** مع بثوث مباشرة منتظمة.
        - **تعمّق أكثر** مع كتالوج الشروحات الكامل.
        - **اعرض مهاراتك** مع شهادة رسمية.
        - **ابقَ مركّزًا** مع تجربة تعلّم بلا إعلانات.
        - **احصل على وصول مبكر** إلى الميزات الجديدة.
        - **أظهر دعمك** مع شارات Premium على الموقع وفي مساحات المجتمع.

        جعلنا السعر مناسبًا جدًا باستخدام **تعادل القوة الشرائية**. وهذا يعني أن Premium يكلّف تقريبًا مثل مشروبين للطلبات الخارجية في بلدك، فيبدو سعرًا معقولًا أينما كنت في العالم.

        إذا كنت تستمتع بـ Jiki، وتريد **تسريع تعلّمك**، وتريد دعمي أنا وفريق Jiki، فرجاءً [قم بالترقية إلى Premium](https://jiki.io/premium).

        شكرًا لك،
        Jeremy
    community:
      subject: "لا تكافح وحدك، انضمّ إلى مجتمع Jiki"
      preview: "فرصك في النجاح في تعلّم أي شيء أكبر بكثير إذا كنت جزءًا من مجموعة."
      greeting: "مرحبًا،"
      body_markdown: |
        فرصك في النجاح في تعلّم أي شيء أكبر بكثير إذا كنت **جزءًا من مجموعة**. والبرمجة لا تختلف عن ذلك.

        إن أردت الحصول على مساعدة، أو الحديث عن رحلتك في البرمجة، أو مجرد التسكّع مع الآخرين، فهناك أماكن لفعل ذلك:
        - [منتدانا](https://jiki.io/r/forum): المكان المناسب للمحادثات الأطول والمتأنّية. **تعمّق** أكثر هنا.
        - [ديسكورد Exercism](https://jiki.io/r/discord): المكان المناسب لـ**الدردشة الفورية** مع الآخرين المتصلين الآن. ابحث عن قناتَي #jiki-chat و#jiki-get-help.
        - [يوتيوب](https://jiki.io/r/youtube): انضمّ إلى جلسات «اسألني أي شيء» وغيرها من **البثوث المباشرة** لتطرح عليّ أسئلتك!

        تذكّر أنّ في هذه المساحات أشخاصًا من ثقافات مختلفة كثيرة، لذا **يُرجى أن تكون محترمًا** مع الجميع أثناء الدردشة.

        أراك هناك!
        جيريمي
