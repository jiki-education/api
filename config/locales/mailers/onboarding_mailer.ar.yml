ar:
  onboarding_mailer:
    overview:
      subject: "نصفا طريقك لتصبح مطوّرًا في 2026"
      preview: "خلال السنوات القليلة الماضية كنت أتعلّم اليابانية ببطء."
      greeting: "مرحبًا،"
      body_markdown: |
        خلال السنوات القليلة الماضية كنت **أتعلّم اليابانية ببطء**. أزور اليابان بانتظام وأحاول أن أغمر نفسي في اللغة، لكن الأمر صعب، لأنّه في أيامنا هذه، وبمساعدة Google Translate، أصبح من السهل جدًا أن تقضي وقتًا في اليابان دون أن تنطق كلمة يابانية. **لذا يمكن لعقلي أن يتكاسل**، لكنني أتدبّر أمري جيدًا.

        وقد بدأت البرمجة مؤخرًا تسلك الرحلة نفسها. فعلى مدى 30 عامًا الماضية، إن أردت أن تفعل أي شيء في مجال التقنية، **كان عليك أن تتعلّم البرمجة**. كانت هذه هي الطريقة الوحيدة لتتواصل مع الحاسوب. لكن خلال العامين الماضيين، مع صعود الوكلاء الأذكياء في عالم البرمجة، تغيّر ذلك. يمكنك الآن أن تستخدم لغتك الأم وتخبر وكيل ذكاء اصطناعي بما تريد أن يفعله، **وسيكتب الكود نيابة عنك**، أي يترجم تعليماتك إلى الحاسوب.

        وكما لا يتعيّن عليّ أن أنتظر حتى أتقن اليابانية قبل أن أستكشف اليابان، **لم يعد من المنطقي أن تقضي سنوات في إتقان البرمجة** قبل أن تبدأ ببناء الأشياء.

        لكن إن أردت أن أدخل فعلًا في الثقافة اليابانية وأتكوّن صداقات يابانية، فأنا بحاجة إلى تعلّم اليابانية. وبالمثل، إن أردت أن تدخل مجال التقنية، فأنت ما زلت بحاجة إلى تعلّم البرمجة. لم يعد الكود هو الحارس على البوابة، لكنه **الفرق بين «أن تتدبّر أمرك» و«أن تزدهر حقًا»**.

        لكي تتحسّن بسرعة، قسّم وقت تعلّمك إلى قسمين:
        1. **تعلّم البرمجة.** اشتغل على دورة أساسيات البرمجة من Jiki وستحصل على أساس متين.
        2. **اصنع الأشياء.** اشتغل على «تعلّم البناء»، وتعمّق في التفاصيل، واصنع منتجات يستطيع الناس استخدامها فعلًا!

        إن أردت معرفة المزيد عن أفكاري حول **كيف تدخل مجال التقنية في 2026**، فاقرأ [هذا المقال](https://jiki.io/blog/how-to-get-into-tech-in-2026).

        خلال الأيام القليلة المقبلة سأخبرك بالمزيد عن جانبي البرمجة والبناء، وعن كيفية الاستفادة القصوى من [Jiki](https://jiki.io). حتى ذلك الحين، **ابدأ العمل واستمتع!**

        شكرًا لقراءتك!
        جيريمي
    coding:
      subject: "ابنِ أساسيات برمجية راسخة"
      preview: "تعلّم البرمجة معروف بأنه تقني وصعب."
      greeting: "مرحبًا مرة أخرى،"
      body_markdown: |
        تعلّم البرمجة معروف بأنه تقني وصعب. عندما بدأت أتعلّم البرمجة، كنت طفلًا عمري 8 سنوات ولا يعرف شيئًا عن البرمجة سوى أنّ **بإمكاني فجأة أن أصنع أشياء رائعة**. لم أكن أعرف أنه من المفترض أن يكون صعبًا. كنت أعرف فقط أنّ لديّ فجأة متنفّسًا جديدًا لإبداعي.

        وأنت تتعلّم البرمجة، **لا أريدك أن تراها كتخصّص تقني عليك إتقانه**، بل أريدك أن تراها مكانًا تطلق فيه **إبداعك**، حيث **تستمتع بصناعة الأشياء** وحلّ الألغاز. فهذا ما هي البرمجة حقًا: حلّ المشكلات.

        لا يهمّ [أي لغة برمجة تتعلّم](https://jiki.io/blog/just-learn-to-code)، المهم أن تبني فهمًا جيدًا حقًا **لكيفية عمل البرمجة**.

        مع تقدّمك، ستأتي أوقات تشعر فيها فعلًا بأنّ البرمجة صعبة ومحبطة. لكن هذا ليس لأنّ _البرمجة_ صعبة، بل لأنّ **التعلّم صعب**. إن أردت أن تتقن أي شيء، عليك أن تمرّ بمراحل يبدو فيها التحدي أكبر من طاقتك، لكن عليك أن تثابر.

        إن لم تكن متأكدًا مما إذا كان جانب البرمجة يستحقّ الجهد، فاقرأ [هذا المقال](https://jiki.io/blog/should-i-still-learn-to-code-in-2026) الذي يشرح لماذا ما زال عليك أن تتعلّم البرمجة في 2026.

        شكرًا لقراءتك!
        جيريمي
    building:
      subject: "أفضل أسلوب للتعلّم هو أن تصنع الأشياء!"
      preview: "أعتقد حقًا أنّ الآن هو أفضل وقت ممكن لدخول مجال التقنية."
      greeting: "مرحبًا،"
      body_markdown: |
        أعتقد حقًا أنّ **الآن هو أفضل وقت ممكن لدخول مجال التقنية**. لم يكن هناك وقت أسهل لتعلّم الأساسيات والقدرة بسرعة على صناعة الأشياء.

        لكن (وهذا «لكن» كبير!) الخطأ الذي يقع فيه كثير من الناس هو أنهم يسلّمون زمام الأمور بالكامل إلى وكيل ذكاء اصطناعي ولا يتعلّمون فعلًا. وهذا يبدو رائعًا لفترة قصيرة، إذ يمكنك أن تُظهر كل هذه الأشياء كأنها سحر، لكن إن كان كل ما تفعله هو أن تخبر Claude أو ChatGPT بما يجب فعله، فأنت لا تتعلّم شيئًا حقًا!

        لذلك أُعِدّ **مشاريع خطوة بخطوة** يمكنك العمل عليها، حيث _أريدك_ أن تستخدم وكلاء الذكاء الاصطناعي للقيام بكثير من العمل نيابة عنك. لكن أريدك أيضًا أن تتأكد من **أنك تفهم فعلًا ما يحدث** في كل مرحلة.

        الهدف من هذه المشاريع هو أن تتعلّم **كل الأجزاء المختلفة لبناء البرمجيات**. يمكنك أن تنضمّ إليّ وأنا أبني الأشياء، وسأشرح بالضبط ما أفعله ولماذا، ثم يمكنك العمل مع وكيل ذكاء اصطناعي لتطبّق الأفكار نفسها على مشاريعك.

        فقط **لا تُدمن جرعات الدوبامين** التي يمنحك إياها وكيل الذكاء الاصطناعي حين يقوم بعملك نيابة عنك. تأكد من أن تأخذ وقتك لتفهم ما يجري!

        آمل أن أراك [في بثّ مباشر](https://youtube.com/@jiki-coding) قريبًا!

        شكرًا لقراءتك!
        جيريمي
    premium:
      subject: "استفد أكثر من Jiki (وساعدنا)"
      preview: "جعلنا Jiki مجانيًا لأننا نريده في متناول الجميع"
      greeting: "مرحبًا،"
      body_markdown: |
        جعلنا Jiki مجانيًا لأننا نريده **في متناول الجميع** بصرف النظر عن حالتهم المالية. الجميع يحصل على مئات الساعات من التمارين والفيديوهات، متاحة كلها دون أن نطلب شيئًا في المقابل.

        لكن **تشغيل Jiki يكلّف مالًا**، ونحن بحاجة إلى دفع الإيجار وتوفير الطعام (🍜) والكافيين (☕)، لذا أضفنا مستوى Premium يمنح مزايا إضافية أعتقد أنها ستساعدك حقًا:
        - **اسأل Jiki**: دردشة ذكاء اصطناعي تساعدك على تجاوز العقبات بسرعة أو استكشاف أسئلتك.
        - **مشاريع Premium**: تمارين أصعب تجمع فيها المهارات التي تتعلّمها.
        - **تعلّم البناء**: محتوى أكثر بكثير تتعلّم فيه إلى جانبي.
        - **الشارات**: اعرض دعمك على الموقع وفي مساحات المجتمع من خلال شارات Premium.

        جعلنا السعر مناسبًا جدًا باستخدام **تعادل القوة الشرائية**. وهذا يعني أنّ تكلفة Premium تقريبًا مثل تكلفة مشروبين سفريّين في بلدك، لذا يفترض أن تبدو سعرًا معقولًا أينما كنت في العالم.

        إن كنت تستمتع باستخدام Jiki وتريد **تسريع تعلّمك**، وترغب في دعمي ودعم فريق Jiki، فالرجاء [الترقية إلى Premium](https://jiki.io/premium).

        شكرًا لك،
        جيريمي
    community:
      subject: "لا تكافح وحدك، انضمّ إلى مجتمع Jiki"
      preview: "فرصك في النجاح في تعلّم أي شيء أكبر بكثير إذا كنت جزءًا من مجموعة."
      greeting: "مرحبًا،"
      body_markdown: |
        فرصك في النجاح في تعلّم أي شيء أكبر بكثير إذا كنت **جزءًا من مجموعة**. والبرمجة لا تختلف عن ذلك.

        إن أردت الحصول على مساعدة، أو الحديث عن رحلتك في البرمجة، أو مجرد التسكّع مع الآخرين، فهناك أماكن لفعل ذلك:
        - [منتدانا](https://jiki.io/r/forum): المكان المناسب للمحادثات الأطول والمتأنّية. **تعمّق** أكثر هنا.
        - [ديسكورد Exercism](https://jiki.io/r/discord): المكان المناسب لـ**الدردشة الفورية** مع الآخرين المتصلين الآن. ابحث عن قناتَي #jiki-chat و#jiki-get-help.
        - [يوتيوب](https://jiki.io/r/youtube): انضمّ إلى جلسات «اسألني أي شيء» وغيرها من **البثوث المباشرة** لتطرح عليّ أسئلتك!

        تذكّر أنّ في هذه المساحات أشخاصًا من ثقافات مختلفة كثيرة، لذا **يُرجى أن تكون محترمًا** مع الجميع أثناء الدردشة.

        أراك هناك!
        جيريمي
