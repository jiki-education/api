fa:
  premium_mailer:
    welcome_to_premium:
      subject: "به جیکی پرمیوم خوش آمدید!"
      greeting: "سلام،"
      body_markdown: |
        از اینکه در جیکی پرمیوم مشترک شدید سپاسگزاریم!

        در [صفحه‌ی پرمیوم](https://jiki.io/premium) می‌توانید همه‌ی امکاناتی را که در اختیار دارید ببینید. امیدواریم از کار با جیکی کلی لذت ببرید و به‌زودی شما را در یک پخش زنده ببینیم!

        اگر سؤالی دارید، فقط به همین ایمیل پاسخ دهید.

        ارادتمند،  
        جرمی و تیم
    subscription_ended:
      subject: "اشتراک جیکی شما به پایان رسید"
      greeting: "سلام،"
      body_markdown: |
        اشتراک جیکی پرمیوم شما به پایان رسید و از این پس در طرح رایگان ما هستید.

        هنوز به کل بخش «برنامه‌نویسی را یاد بگیرید» دسترسی کامل دارید. اگر می‌خواهید دوباره مشترک شوید، هر زمان که بخواهید می‌توانید از [صفحه‌ی تنظیمات](https://jiki.io/settings) این کار را انجام دهید.

        ممنون که جیکی پرمیوم را امتحان کردید.

        ارادتمند،  
        جرمی و تیم
