es-419:
  onboarding_mailer:
    overview:
      subject: "¿Alguna vez viste Karate Kid?"
      preview: "Una de las preguntas que más me hacen es para quién es Jiki."
      greeting: "Hola,"
      body_markdown: |
        La frase **«Dar cera, pulir cera»** se ha vuelto sinónimo de aprender cosas difíciles. Viene de _Karate Kid_, donde Daniel (nuestro niño karateca) le pide a un maestro (el señor Miyagi) que le enseñe kárate. En lugar de enseñarle a patear y golpear, el señor Miyagi le hace hacer tareas de la casa, y la más famosa es encerar autos. La idea es hacer los movimientos exactos correctamente, y resulta (spoiler) que esa disciplina desarrolla habilidades que se pueden transferir al kárate, y que el proceso de entrenar el cuerpo una y otra vez es lo que te hace bueno.

        La programación se parece un poco a eso, pero para la mente, no para el cuerpo. Todos queremos poder crear cosas interesantes desde el primer día, pero más que nada necesitamos construir bases realmente sólidas. Necesitamos **entrenar nuestro cerebro** de la forma correcta y desarrollar las formas correctas de pensar.

        - **Si recién empiezas a programar**, Jiki te va a llevar por estos ejercicios mentales (ojalá de una forma más interesante que encerar autos) y te va a enseñar todo lo que necesitas saber.
        - **Si ya llevas un tiempo programando**, puede que sientas que estás repasando lo mismo de siempre, sin avanzar. Pero igual que Daniel encerando autos, hay un valor enorme en hacer bien estas primeras etapas. Quédate con Jiki y te ayudaremos a desarrollar **una mentalidad de programación profunda y habilidades fundamentales sólidas**.

        ¡Me alegra mucho que estés aquí! Si tienes preguntas, solo responde a este correo. Soy una persona real y con gusto te ayudo 🙂

        ¡Gracias por leer!
        Jeremy
    coding:
      subject: "¿Qué lenguaje de programación debería aprender?"
      preview: "Aprender a programar tiene fama de ser técnico y difícil."
      greeting: "Hola de nuevo,"
      body_markdown: |
        Aprender a programar tiene fama de ser técnico y difícil. Cuando empecé a programar, era un niño de 8 años que no sabía nada de programación, salvo que **de pronto podía hacer cosas geniales**. No sabía que se suponía que era difícil. Solo sabía que de repente tenía una nueva salida para mi creatividad.

        La mayoría de los principiantes pasan muchísimo tiempo tratando de decidir qué lenguaje de programación aprender. [No importa](https://jiki.io/blog/just-learn-to-code). Lo que importa es que construyas una comprensión realmente buena de **cómo funciona la programación**, y eso es lo que enseña Jiki.

        A medida que avances, habrá momentos en los que programar sí se sienta difícil y frustrante. Pero no es porque _programar_ sea difícil, sino porque **aprender es difícil**. Si quieres ser bueno en algo, tienes que pasar por etapas en las que el desafío se sienta demasiado, pero tienes que persistir.

        Jiki te va a llevar a un punto en el que entiendas el código, y después puedes usar nuestro sitio hermano, Exercism, para aprender cualquiera de **85 lenguajes de programación**.

        ¡Vas a lograrlo!
        Jeremy
    premium:
      subject: "Saca más provecho de Jiki (y ayúdanos)"
      preview: "Hicimos Jiki gratis porque queremos que sea accesible para todos."
      greeting: "Hola,"
      body_markdown: |
        Hicimos Jiki gratis porque queremos que sea **accesible para todos**, sin importar su situación económica. Todos tienen acceso a cientos de horas de ejercicios y videos, disponibles sin pedir nada a cambio.

        Pero **mantener Jiki cuesta dinero**, y necesitamos poder pagar el alquiler, la comida (🍜) y el café (☕), así que agregamos un plan Premium con algunos beneficios extra que creo que te van a ayudar mucho:
        - **No te quedes atascado nunca** con soporte ilimitado para preguntarle a Jiki.
        - **Ve más lejos** con los desafíos Premium.
        - **Sé parte de la comunidad** con transmisiones en vivo periódicas.
        - **Profundiza más** con nuestro catálogo completo de explicaciones paso a paso.
        - **Muestra tus habilidades** con un certificado oficial.
        - **Mantén el enfoque** con una experiencia de aprendizaje sin anuncios.
        - **Ten acceso anticipado** a las nuevas funcionalidades.
        - **Demuestra tu apoyo** con insignias Premium en el sitio y en los espacios de la comunidad.

        Lo hicimos súper accesible con **precios ajustados al poder adquisitivo local**. Eso significa que Premium cuesta más o menos lo mismo que dos bebidas para llevar en tu país, así que debería sentirse como un precio razonable estés donde estés en el mundo.

        Si estás disfrutando Jiki, quieres **acelerar tu aprendizaje** y quieres apoyarme a mí y al equipo de Jiki, entonces por favor [cambia a Premium](https://jiki.io/premium).

        Gracias,
        Jeremy
    community:
      subject: "No luches solo: únete a la comunidad de Jiki"
      preview: "Es mucho más probable que tengas éxito aprendiendo cualquier cosa si formas parte de un grupo."
      greeting: "Hola,"
      body_markdown: |
        Es mucho más probable que tengas éxito aprendiendo cualquier cosa si **formas parte de un grupo**. En la programación no es diferente.

        Si te gustaría recibir ayuda, conversar sobre tu camino en la programación o simplemente pasar el rato con otros, hay algunos lugares para hacerlo:
        - [Nuestro foro](https://jiki.io/r/forum): El lugar para conversaciones más lentas y de formato largo. **Profundiza** aquí.
        - [Discord de Exercism](https://jiki.io/r/discord): El lugar para **chatear en tiempo real** con otros que están en línea. Busca los canales #jiki-chat y #jiki-get-help.
        - [YouTube](https://jiki.io/r/youtube): Únete a nuestras AMA (pregúntame lo que quieras) y otras **transmisiones en vivo** para hacerme tus preguntas.

        Recuerda que en estos espacios hay personas de muchas culturas diferentes, así que **por favor sé respetuoso** con todos mientras conversas.

        ¡Nos vemos allí!
        Jeremy
