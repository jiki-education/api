ko:
  account_mailer:
    welcome:
      subject: "Jiki에 오신 것을 환영해요!"
      greeting: "안녕하세요,"
      body_markdown: |
        [Jiki](https://jiki.io)에 오신 것을 환영해요! 함께하게 되어 정말 기뻐요.

        Jiki는 완전한 초보자가 자신 있게 코딩하는 사람이 될 수 있도록 설계됐어요. 재미있는 프로젝트를 만들고 흥미로운 문제를 풀면서 한 걸음씩 나아가고, 그 여정에서 정말 많은 것을 배우게 될 거예요.

        막히거나 궁금한 점이 있으면 언제든지 연락해요. 코딩을 처음 배울 때는 벅차게 느껴질 수 있지만, 잘 해낼 수 있어요!

        즐겁게 코딩하고, 이 여정을 마음껏 즐겨요!

        감사합니다,  
        Jeremy와 팀
    account_deletion_confirmation:
      subject: "계정 삭제 확인"
      preview: "Jiki 계정을 영구적으로 삭제하려는 것이 맞는지 확인해 주세요"
      greeting: "안녕하세요,"
      body_markdown: |
        Jiki 계정 삭제 요청을 받았어요.

        본인이 요청한 것이 맞다면 아래 버튼을 눌러 확인해 주세요. 이 작업은 영구적이며 되돌릴 수 없어요. 지금까지의 모든 진행 상황과 데이터가 삭제돼요.

        요청한 적이 없다면 이 메일은 그냥 무시해도 괜찮아요. 계정은 그대로 유지돼요.
      cta: "계정 삭제하기"
