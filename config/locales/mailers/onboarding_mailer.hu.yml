hu:
  onboarding_mailer:
    overview:
      subject: "Láttad már a Karate kölyköt?"
      preview: "Az egyik leggyakoribb kérdés, amit kapok, hogy kinek szól a Jiki."
      greeting: "Szia,"
      body_markdown: |
        A **„Wax on, wax off”** kifejezés mára egybeforrt a nehéz dolgok megtanulásával. A _Karate kölyök_ című filmből származik, amelyben Daniel (a mi karatekölykünk) megkér egy mestert (Mr. Miyagi), hogy tanítsa meg karatézni. Ahelyett, hogy rúgásokat és ütéseket tanítana neki, Mr. Miyagi házimunkát végeztet vele, a leghíresebbet: autóviaszolást. A hangsúly azon van, hogy a mozdulatokat pontosan, helyesen hajtsa végre, és kiderül (spoiler), hogy ez a fegyelem átvihető készségeket épít a karatéhoz, és hogy a tested ismételt edzése az, ami jóvá tesz.

        A programozás valamennyire hasonló, csak nem a testet, hanem az elmét edzi. Mindannyian szeretnénk már az első naptól érdekes dolgokat alkotni, de mindennél jobban valóban szilárd alapokra van szükségünk. **Edzeni kell az agyunkat** a megfelelő módon, és ki kell alakítanunk a megfelelő gondolkodásmódot.

        - **Ha most ismerkedsz a programozással**, a Jiki végigvezet ezeken a gondolkodási gyakorlatokon (remélhetőleg sokkal érdekesebb módon, mint az autóviaszolás!), és megtanít mindent, amit tudnod kell.
        - **Ha már egy ideje programozol**, lehet, hogy úgy érzed, ugyanazokon az alapokon lépkedsz, és nem haladsz előre. De ahogy Daniel az autóviaszolásnál, úgy itt is hatalmas értéke van annak, ha ezt a korai szakaszt rendesen végigcsinálod. Maradj a Jikivel, és segítünk kifejleszteni **egy mély programozói szemléletet és szilárd alapkészségeket**.

        Örülök, hogy itt vagy! Ha bármi kérdésed van, csak válaszolj erre az e-mailre. Ember vagyok, és szívesen segítek 🙂

        Köszönöm, hogy elolvastad!
        Jeremy
    coding:
      subject: "Milyen programozási nyelvet tanuljak?"
      preview: "A programozás tanulásáról azt tartják, hogy technikai és nehéz."
      greeting: "Szia újra,"
      body_markdown: |
        A programozás tanulásáról azt tartják, hogy technikai és nehéz. Amikor elkezdtem programozni tanulni, egy 8 éves kölyök voltam, aki semmit nem tudott a programozásról azon kívül, hogy **hirtelen menő dolgokat tud csinálni**. Nem tudtam, hogy elvileg nehéznek kellene lennie. Csak azt tudtam, hogy hirtelen új kifejezési formát kaptam a kreativitásomnak.

        A legtöbb kezdő órákat tölt azzal, hogy eldöntse, milyen programozási nyelvet tanuljon. [Nem ez a lényeg](https://jiki.io/blog/just-learn-to-code). Az számít, hogy igazán jól megértsd, **hogyan működik a programozás**, és erre tanít meg a Jiki.

        Ahogy haladsz előre, lesznek olyan időszakok, amikor a programozás tényleg nehéznek és frusztrálónak tűnik. De ez nem azért van, mert a _programozás_ nehéz, hanem azért, mert **a tanulás nehéz**. Ha bármiben jó akarsz lenni, át kell esned olyan szakaszokon, amikor a kihívás túl nagynak tűnik, de kitartónak kell maradnod.

        A Jiki eljuttat odáig, hogy érted a kódot, utána pedig a testvérweboldalunkon, az Exercismen, akár **85 különböző programozási nyelvet** is megtanulhatsz!

        Menni fog!
        Jeremy
    premium:
      subject: "Hozz ki többet a Jikiből (és segíts nekünk)"
      preview: "Ingyenessé tettük a Jikit, hogy mindenki számára elérhető legyen, anyagi helyzettől függetlenül."
      greeting: "Szia,"
      body_markdown: |
        Azért tettük ingyenessé a Jikit, mert szeretnénk, hogy **mindenki számára elérhető legyen**, anyagi helyzettől függetlenül. Mindenki több száz órányi feladatot és videót kap, mindezt anélkül, hogy bármit is kérnénk cserébe.

        De **a Jiki működtetése pénzbe kerül**, és ki kell tudnunk fizetni a lakbért, meg engedni magunknak egy kis kaját (🍜) és koffeint (☕), ezért bevezettünk egy Prémium csomagot, ami néhány olyan extra előnyt kínál, amiről szerintem tényleg hasznos lesz neked:
        - **Soha ne akadj el**: korlátlanul kérdezheted Jikit.
        - **Feszegetd a határaidat** a Prémium kihívásokkal.
        - **Légy része a közösségnek** rendszeres élő közvetítésekkel.
        - **Áss mélyebbre** a végigvezetések teljes katalógusával.
        - **Mutasd meg a tudásodat** egy hivatalos tanúsítvánnyal.
        - **Maradj fókuszban** a reklámmentes tanulási élménnyel.
        - **Kapj korai hozzáférést** az új funkciókhoz.
        - **Mutasd meg a támogatásodat** Prémium jelvényekkel az oldalon és a közösségi felületeken.

        A **vásárlóerő-paritás** segítségével szuper megfizethetővé tettük. Ez azt jelenti, hogy a Prémium nagyjából annyiba kerül, mint két elviteles ital az országodban, így bárhol is élsz a világon, méltányos árnak fog tűnni.

        Ha élvezed a Jikit, szeretnéd **felgyorsítani a tanulásodat**, és támogatnál engem meg a Jiki csapatát, akkor kérlek [válts Prémiumra](https://jiki.io/premium).

        Köszönöm,
        Jeremy
    community:
      subject: "Ne küszködj egyedül: csatlakozz a Jiki közösségéhez"
      preview: "Bármit sokkal nagyobb eséllyel tanulsz meg, ha egy csoport része vagy."
      greeting: "Szia,"
      body_markdown: |
        Bármit sokkal nagyobb eséllyel tanulsz meg, ha **egy csoport része vagy**. A programozás sem kivétel.

        Ha segítséget szeretnél kérni, beszélgetnél a programozási utadról, vagy csak lógnál egy kicsit másokkal, van rá néhány hely:
        - [A fórumunk](https://jiki.io/r/forum): Ide gyere a lassabb, hosszabb beszélgetésekért. Itt tudsz **mélyebbre ásni**.
        - [Az Exercism Discordja](https://jiki.io/r/discord): Ide gyere, ha **valós idejű beszélgetésre** vágysz azokkal, akik éppen online vannak. Keresd a #jiki-chat és a #jiki-get-help csatornákat.
        - [YouTube](https://jiki.io/r/youtube): Csatlakozz az AMA-khoz (Ask Me Anything, azaz „kérdezz bármit”) és a többi **élő közvetítéshez**, és tedd fel nekem a kérdéseidet!

        Ne feledd, hogy ezeken a helyeken sok különböző kultúrából érkeznek emberek, ezért kérlek, **légy tiszteletteljes** mindenkivel, amikor beszélgetsz.

        Ott találkozunk!
        Jeremy
