fa:
  account_mailer:
    welcome:
      subject: "به جیکی خوش آمدید!"
      greeting: "سلام،"
      body_markdown: |
        به [جیکی](https://jiki.io) خوش آمدید! خیلی خوشحالیم که اینجا هستید.

        جیکی طوری طراحی شده است که شما را از یک مبتدی کامل به یک برنامه‌نویس با اعتمادبه‌نفس تبدیل کند. روی پروژه‌های سرگرم‌کننده کار می‌کنید و مسائل جالبی را حل می‌کنید، هر بار یک قدم کوچک پیش می‌روید و در این مسیر مطالب زیادی یاد می‌گیرید.

        اگر جایی گیر کردید یا سؤالی داشتید، حتماً با ما در تماس باشید. یادگیری برنامه‌نویسی در ابتدا ممکن است کمی ترسناک به نظر برسد، اما شما از عهده‌اش برمی‌آیید!

        خوش بگذرد و از این مسیر لذت ببرید!

        با احترام،  
        جرمی و تیم
    account_deletion_confirmation:
      subject: "تأیید حذف حساب کاربری"
      preview: "لطفاً تأیید کنید که می‌خواهید حساب جیکی خود را برای همیشه حذف کنید"
      greeting: "سلام،"
      body_markdown: |
        درخواستی برای حذف حساب جیکی شما دریافت کردیم.

        اگر این درخواست از طرف خودتان است، برای تأیید روی دکمه‌ی زیر کلیک کنید. این کار همیشگی است و قابل برگشت نیست. تمام پیشرفت و اطلاعات شما حذف خواهد شد.

        اگر خودتان این درخواست را نداده‌اید، می‌توانید این ایمیل را با خیال راحت نادیده بگیرید؛ حسابتان بدون تغییر باقی می‌ماند.
      cta: "حذف حساب کاربری من"
