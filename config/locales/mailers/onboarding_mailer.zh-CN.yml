zh-CN:
  onboarding_mailer:
    overview:
      subject: "看过《龙威小子》吗？"
      preview: "我最常被问到的问题之一，就是 Jiki 到底适合谁。"
      greeting: "你好，"
      body_markdown: |
        **“Wax on, wax off”**这个说法，已经成了学习难事的代名词。它来自电影_《龙威小子》_，片中丹尼尔（我们的空手道小子）请一位老师（宫城先生）教他空手道。宫城先生没有教他怎么踢腿、怎么出拳，而是让他做家务，最有名的就是给汽车打蜡。重点是每个动作都要准确地做到位。结果（剧透一下）这种训练培养出的技能可以迁移到空手道上，而且正是反复训练身体的过程让你变得厉害。

        编程有点类似，只不过练的是头脑，不是身体。我们都希望从第一天起就能做出有趣的东西，但比什么都重要的是先打好真正扎实的基础。我们需要用正确的方式**训练大脑**，养成正确的思维方式。

        - **如果你是编程新手**，Jiki 会带你完成这些思维练习（希望比给汽车打蜡有趣得多！），并教会你所有需要知道的东西。
        - **如果你已经编程一段时间了**，可能会觉得自己一直在重复同样的基础，没有往前走。但就像丹尼尔给汽车打蜡一样，把早期这些阶段认真做好，价值巨大。跟着 Jiki 走，我们会帮你培养**深入的编程思维和扎实的基础技能**。

        很高兴你能加入！有任何问题，直接回复这封邮件就行。我是真人，很乐意帮忙 🙂

        感谢阅读！
        Jeremy
    coding:
      subject: "我该学哪门编程语言？"
      preview: "学编程一向被说成是技术性强、很难的事。"
      greeting: "又见面了，"
      body_markdown: |
        学编程一向被说成是技术性强、很难的事。我刚开始学编程的时候，是个 8 岁的孩子，对编程一无所知，只知道**我突然能做出很酷的东西了**。我不知道它本来应该很难。我只知道，我忽然多了一个发挥创造力的出口。

        大多数初学者会花很长时间纠结该学哪门编程语言。[这并不重要](https://jiki.io/blog/just-learn-to-code)。关键在于，你要深入理解**编程是怎么运作的**，而这正是 Jiki 教的东西。

        随着你不断进步，总会有一些时候，编程确实让人又难受又挫败。但这不是因为_编程_难，而是因为**学习本身很难**。如果你想在任何事情上做到出色，就必须经历那种挑战看起来太大的阶段，并且坚持下来。

        Jiki 会把你带到能读懂代码的程度，之后你就可以用我们的姐妹网站 Exercism，学习**85 种不同的编程语言**！

        你一定行的！
        Jeremy
    premium:
      subject: "在 Jiki 收获更多（也帮帮我们）"
      preview: "我们把 Jiki 做成免费的，是希望人人都能用得上。"
      greeting: "你好，"
      body_markdown: |
        我们把 Jiki 做成免费的，是因为我们希望它**人人都用得上**，不管经济状况如何。每个人都能得到几百小时的练习和视频，全部免费开放，不求任何回报。

        但**运营 Jiki 是要花钱的**，我们也得付房租、买吃的（🍜）和咖啡（☕），所以我们加了一个 Premium 会员等级，附带一些我觉得真的能帮到你的额外福利：
        - **再也不会卡住**：无限次 Ask Jiki 答疑支持。
        - **更进一步**：Premium 专属挑战。
        - **成为社区的一分子**：定期直播。
        - **深入挖掘**：完整的步骤讲解库。
        - **展示你的能力**：官方证书。
        - **保持专注**：没有广告的学习体验。
        - **抢先体验**：新功能优先开放。
        - **表达你的支持**：在网站和社区空间佩戴 Premium 徽章。

        我们通过**购买力平价**把价格定得非常实惠。也就是说，Premium 的价格大约相当于你所在国家两杯外带饮料的钱，所以不管你在世界哪里，这个价格都该显得合理。

        如果你喜欢 Jiki，想**加快学习进度**，也愿意支持我和 Jiki 团队，那就请[升级到 Premium](https://jiki.io/premium)吧。

        谢谢你，
        Jeremy
    community:
      subject: "别一个人硬撑，加入 Jiki 社区"
      preview: "学任何东西，有一群人一起，成功的可能性都会大很多。"
      greeting: "你好，"
      body_markdown: |
        学任何东西的时候，如果你**属于一个群体**，成功的可能性都会大很多。编程也不例外。

        如果你想找人帮忙、聊聊自己的编程历程，或者只是想和大家待在一起，有几个地方可以去：
        - [我们的论坛](https://jiki.io/r/forum)：适合慢节奏、长篇的交流。在这里**聊得更深入**。
        - [Exercism 的 Discord](https://jiki.io/r/discord)：和在线的人**实时聊天**的地方。找找 #jiki-chat 和 #jiki-get-help 频道。
        - [YouTube](https://jiki.io/r/youtube)：来参加我们的 AMA（你问我答）和其他**直播**，把你的问题都抛给我！

        记住，这些地方有来自很多不同文化背景的人，所以聊天的时候**请尊重每一个人**。

        到时候见！
        Jeremy
