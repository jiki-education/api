zh-CN:
  onboarding_mailer:
    overview:
      subject: "2026 年成为开发者的两个部分"
      preview: "过去几年我一直在慢慢学日语。"
      greeting: "你好，"
      body_markdown: |
        过去几年我一直在**慢慢学日语**。我经常去日本，也尽量让自己沉浸在日语里，但这并不容易，因为现在有了 Google 翻译，在日本待上一段时间却一句日语都不说，实在太容易了。**所以我的大脑可以偷懒**，但日子照样能过下去。

        编程最近也开始走上同一条路。过去 30 年里，如果你想用科技做点什么，**就必须学会写代码**。那是你和计算机交流的唯一方式。但最近两年，随着智能体编程的兴起，情况变了。现在你可以用母语告诉 AI 智能体你想让它做什么，**它会替你写代码**，把你的指令翻译给计算机。

        就像我不必等日语说得流利才去探索日本一样，**现在也完全没必要先花好几年把编程练好**，才开始动手做东西。

        但如果我想真正融入日本文化、交到日本朋友，我就得学日语。同样，如果你想进入科技行业，也依然需要学会写代码。代码不再是守门人，但它是**“勉强混过去”和“真正做出成绩”之间的差别**。

        想快点变强，就把学习时间分成两块：
        1. **学会写代码。** 把 Jiki 的 Coding Fundamentals 课程学一遍，你就能打下很好的基础。
        2. **动手做东西。** 跟着 Learn to Build，钻进细节，做出别人真的能用的产品！

        如果你想了解更多我对**2026 年如何进入科技行业**的想法，可以读读[这篇博客文章](https://jiki.io/blog/how-to-get-into-tech-in-2026)。

        接下来几天，我会再多聊聊编程和动手做这两方面，以及怎样把 [Jiki](https://jiki.io) 用得更充分。在那之前，**动手去做，玩得开心！**

        感谢阅读！
        Jeremy
    coding:
      subject: "打下扎实的编程基础"
      preview: "学编程总被说成又专业又难。"
      greeting: "又见面了，"
      body_markdown: |
        学编程总被说成又专业又难。我开始学编程的时候才 8 岁，对编程一无所知，只知道**我突然能做出很酷的东西了**。我不知道它本来应该很难，我只知道自己突然多了一个发挥创造力的出口。

        学编程的过程中，**我不希望你把它当成一门要攻克的技术学科**，我希望你把它看成能释放**你**创造力的地方，在这里你可以**开心地做东西**、解开谜题。因为编程的本质就是解决问题。

        你[学哪种编程语言](https://jiki.io/blog/just-learn-to-code)并不重要，重要的是真正理解**编程是怎么运作的**。

        学下去，总会有一些时候，编程确实让人觉得又难又沮丧。但这不是因为_编程_难，而是因为**学习本身就难**。想把任何一件事做好，都得经历挑战大到快扛不住的阶段，而你必须坚持过去。

        如果你还不确定学编程值不值得花这份力气，可以读读[这篇博客文章](https://jiki.io/blog/should-i-still-learn-to-code-in-2026)，里面说明了为什么 2026 年你依然应该学编程。

        感谢阅读！
        Jeremy
    building:
      subject: "最好的学习方式就是动手做！"
      preview: "我真心觉得，现在进入科技行业是最好的时机。"
      greeting: "你好，"
      body_markdown: |
        我真心觉得，**现在进入科技行业是最好的时机**。学习基础、快速做出东西，从来没有像现在这么容易。

        但是（这个“但是”很重要！）很多人走偏的地方在于，他们把缰绳完全交给了 AI 智能体，自己其实并没有真的在学。刚开始那一下感觉确实很爽，你能像变魔术一样让这些东西冒出来，可如果你做的只是告诉 Claude 或 ChatGPT 该干什么，那你其实什么都没学到！

        所以我正在做一系列**一步一步的项目**，你可以在里面动手实践。在这些项目里，我_就是希望_你用 AI 智能体替你完成很多工作，但同时我也希望你在每个阶段都确认**自己真的搞懂了正在发生什么**。

        这些项目的目的，是让你学到**做软件涉及的各个不同部分**。你可以跟着我一起做东西，我会详细说明我在做什么、为什么这么做，然后你可以和 AI 智能体一起，把这些思路用到自己的项目上。

        只是**别对 AI 智能体替你干活带来的多巴胺快感上瘾**。一定要花时间弄明白到底发生了什么！

        希望很快能在[直播](https://youtube.com/@jiki-coding)里见到你！

        感谢阅读！
        Jeremy
    premium:
      subject: "从 Jiki 获得更多（也帮我们一把）"
      preview: "我们把 Jiki 做成免费，是希望无论谁都能用上它。"
      greeting: "你好，"
      body_markdown: |
        我们把 Jiki 做成免费，是因为希望**每个人都能用上**它，不管经济状况如何。每个人都能获得几百小时的练习和视频，不需要任何回报。

        但**运营 Jiki 是要花钱的**，我们也得付房租、买吃的（🍜）和咖啡（☕），所以我们加了一个 Premium 会员，提供一些我觉得会真正帮到你的额外好处：
        - **Ask Jiki**：我们的 AI 聊天，帮你快速摆脱卡壳，或者把问题聊得更透。
        - **Premium Projects**：更难的练习，可以把你正在学的技能组合起来。
        - **Learn to Build**：更多内容，你可以和我一起学。
        - **徽章**：用 Premium 徽章在网站和社区空间里展示你的支持。

        我们用**购买力平价**把它定得非常实惠。也就是说，Premium 的价格大约相当于你所在国家两杯外带饮料的钱，所以不管你在世界哪个地方，都会觉得价格挺合理。

        如果你喜欢 Jiki，想**加快自己的学习进度**，也愿意支持我和 Jiki 团队，那就[升级到 Premium](https://jiki.io/premium)吧。

        谢谢，
        Jeremy
    community:
      subject: "别一个人硬撑，加入 Jiki 社区"
      preview: "学任何东西，有一群人一起，成功的可能性都会大很多。"
      greeting: "你好，"
      body_markdown: |
        学任何东西的时候，如果你**属于一个群体**，成功的可能性都会大很多。编程也不例外。

        如果你想找人帮忙、聊聊自己的编程历程，或者只是想和大家待在一起，有几个地方可以去：
        - [我们的论坛](https://jiki.io/r/forum)：适合慢节奏、长篇的交流。在这里**聊得更深入**。
        - [Exercism 的 Discord](https://jiki.io/r/discord)：和在线的人**实时聊天**的地方。找找 #jiki-chat 和 #jiki-get-help 频道。
        - [YouTube](https://jiki.io/r/youtube)：来参加我们的 AMA（你问我答）和其他**直播**，把你的问题都抛给我！

        记住，这些地方有来自很多不同文化背景的人，所以聊天的时候**请尊重每一个人**。

        到时候见！
        Jeremy
