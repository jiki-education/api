sr:
  onboarding_mailer:
    overview:
      subject: "Sećaš li se filma Karate kid?"
      preview: "Jedno od pitanja koja najčešće dobijam jeste kome je Jiki namenjen."
      greeting: "Zdravo,"
      body_markdown: |
        Fraza **„Wax on, wax off”** postala je sinonim za učenje teških stvari. Potiče iz filma _Karate kid_, u kojem Daniel (naš karate kid) zamoli učitelja (gospodina Mijagija) da ga nauči karateu. Umesto da ga uči kako da šutira i udara, gospodin Mijagi ga tera da obavlja kućne poslove, a najpoznatiji je voskiranje automobila. Fokus je na tome da se tačni pokreti izvode pravilno, i ispostavlja se (spojler) da ta disciplina gradi veštine koje se prenose na karate i da je upravo stalno treniranje tela ono što te čini dobrim.

        Programiranje je pomalo slično, ali za um, a ne za telo. Svi želimo da već od prvog dana možemo da pravimo zanimljive stvari, ali nam je pre svega potrebno da izgradimo zaista čvrste osnove. Treba da **treniramo svoj mozak** na pravi način i da razvijemo pravi način razmišljanja.

        - **Ako tek počinješ da programiraš**, Jiki će te provesti kroz ove mentalne vežbe (nadamo se zanimljivije nego kroz voskiranje automobila!) i naučiće te svemu što treba da znaš.
        - **Ako već neko vreme programiraš**, možda imaš osećaj da gaziš preko istih osnova i da ne napreduješ. Ali baš kao sa Danielovim voskiranjem automobila, ogromna je vrednost u tome da ove rane faze uradiš kako treba. Ostani uz Jiki i pomoći ćemo ti da razviješ **dubok programerski mentalitet i čvrste temeljne veštine**.

        Drago mi je što si tu! Ako imaš bilo kakva pitanja, samo odgovori na ovaj imejl. Ja sam čovek i rado ću pomoći 🙂

        Hvala na čitanju!
        Džeremi
    coding:
      subject: "Koji programski jezik da učim?"
      preview: "Učenje programiranja ima reputaciju nečeg tehničkog i teškog."
      greeting: "Zdravo ponovo,"
      body_markdown: |
        Učenje programiranja ima reputaciju nečeg tehničkog i teškog. Kada sam počinjao da učim da programiram, bio sam osmogodišnji klinac koji nije znao ništa o programiranju osim da **odjednom mogu da pravim kul stvari**. Nisam znao da bi to trebalo da bude teško. Znao sam samo da sam odjednom dobio novi izlaz za svoju kreativnost.

        Većina početnika provodi čitavu večnost odlučujući koji programski jezik da uči. [Nije važno](https://jiki.io/blog/just-learn-to-code). Važno je da zaista dobro razumeš **kako programiranje funkcioniše**, a tome te uči Jiki.

        S vremenom će biti trenutaka kada će ti se programiranje zaista činiti teškim i frustrirajućim. Ali to nije zato što je _programiranje_ teško, već zato što je **učenje teško**. Ako želiš da u nečemu napreduješ, moraš da prođeš kroz faze u kojima izazov deluje prevelik, ali moraš da istraješ.

        Jiki će te dovesti do tačke kada razumeš kod, a onda na našem sestrinskom sajtu, Exercismu, možeš da učiš bilo koji od **85 različitih programskih jezika**!

        Možeš ti to!
        Džeremi
    premium:
      subject: "Izvuci više iz Jikija (i pomozi nam)"
      preview: "Jiki je besplatan jer želimo da bude dostupan svima, bez obzira na sve."
      greeting: "Zdravo,"
      body_markdown: |
        Jiki smo učinili besplatnim jer želimo da **bude dostupan svima**, bez obzira na finansijsku situaciju. Svako dobija stotine sati vežbi i videa, sve dostupno bez ičega zauzvrat.

        Ali **da bi Jiki radio, potreban je novac**, a mi moramo da platimo kiriju i priuštimo sebi hranu (🍜) i kofein (☕), pa smo dodali Premium paket sa dodatnim pogodnostima za koje mislim da će ti zaista pomoći:
        - **Nikad ne zapni** uz neograničenu podršku Ask Jiki.
        - **Pomeri svoje granice** uz Premium izazove.
        - **Budi deo zajednice** uz redovne prenose uživo.
        - **Zakopaj dublje** uz naš kompletan katalog vodiča kroz rešenja.
        - **Pokaži svoje umeće** uz zvanični sertifikat.
        - **Ostani u fokusu** uz učenje bez reklama.
        - **Dobij rani pristup** novim funkcionalnostima.
        - **Pokaži podršku** uz Premium značke na sajtu i u zajedničkim prostorima.

        Učinili smo ga izuzetno pristupačnim pomoću **pariteta kupovne moći**. To znači da Premium košta otprilike kao dva pića za poneti u tvojoj zemlji, pa bi trebalo da ti cena deluje razumno gde god da živiš u svetu.

        Ako uživaš u Jikiju, želiš da **ubrzaš svoje učenje** i da podržiš mene i Jiki tim, onda te molim da [pređeš na Premium](https://jiki.io/premium).

        Hvala,
        Džeremi
    community:
      subject: "Zajedno je lakše, pridruži se Jiki zajednici"
      preview: "Mnogo je veća šansa da uspeš u učenju bilo čega ako si deo grupe."
      greeting: "Zdravo,"
      body_markdown: |
        Mnogo je veća šansa da u bilo čemu uspeš ako si **deo grupe**. Isto je i sa programiranjem.

        Ako želiš da dobiješ pomoć, popričaš o svom programerskom putu ili se samo družiš sa drugima, evo nekoliko mesta za to:
        - [Naš forum](https://jiki.io/r/forum): mesto za sporije, duže razgovore. Ovde **idi dublje**.
        - [Exercismov Discord](https://jiki.io/r/discord): mesto za **razgovor u realnom vremenu** sa onima koji su trenutno online. Potraži kanale #jiki-chat i #jiki-get-help.
        - [YouTube](https://jiki.io/r/youtube): pridruži se našim AMA sesijama (Ask Me Anything, pitaj me bilo šta) i drugim **lajv strimovima** i postavi mi svoja pitanja!

        Imaj u vidu da na tim mestima ima ljudi iz mnogo različitih kultura, pa se u razgovoru **prema svima ophodi s poštovanjem**.

        Vidimo se tamo!
        Džeremi
