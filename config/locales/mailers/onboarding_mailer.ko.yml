ko:
  onboarding_mailer:
    overview:
      subject: "Karate Kid를 본 적 있나요?"
      preview: "제가 가장 자주 받는 질문 중 하나는 Jiki가 누구를 위한 곳이냐는 거예요."
      greeting: "안녕하세요,"
      body_markdown: |
        **"Wax on, wax off"**라는 말은 이제 어려운 것을 배우는 일을 뜻하는 표현이 됐어요. _Karate Kid_에서 다니엘(우리의 가라테 소년)은 선생님(미야기 씨)에게 가라테를 가르쳐 달라고 부탁해요. 미야기 씨는 발차기와 주먹 지르기를 가르치는 대신 다니엘에게 집안일을 시켜요. 그중 가장 유명한 것이 바로 자동차 왁스칠이죠. 핵심은 동작을 정확하게 해내는 데 있고, 알고 보면(스포일러) 이 훈련이 가라테에도 그대로 이어지는 능력을 길러 주며, 몸을 반복해서 단련하는 과정 자체가 실력을 만들어 준다는 것이 드러나요.

        코딩도 조금 비슷해요. 다만 몸이 아니라 머리를 위한 것이죠. 누구나 첫날부터 재미있는 것을 만들고 싶어 하지만, 그 무엇보다 정말 탄탄한 기본기를 쌓는 것이 중요해요. 올바른 방식으로 **머리를 단련하고**, 올바른 사고방식을 길러야 해요.

        - **코딩이 처음이라면**, Jiki가 이런 머리 훈련을 차근차근 안내해 줄 거예요(자동차 왁스칠보다는 훨씬 재미있기를 바라요!). 그리고 알아야 할 모든 것을 가르쳐 줘요.
        - **코딩을 한동안 해 왔다면**, 같은 기초만 맴돌고 앞으로 나아가지 못한다고 느낄 수 있어요. 하지만 다니엘이 자동차에 왁스칠을 하던 것처럼, 이 초반 단계를 제대로 해내는 데에는 엄청난 가치가 있어요. Jiki와 함께 계속 가면 **깊이 있는 코딩 사고방식과 탄탄한 기본기**를 키울 수 있게 도와줄게요.

        함께하게 되어 정말 기뻐요! 궁금한 점이 있으면 이 메일에 그냥 답장해 주세요. 저는 사람이니까 기꺼이 도와드릴게요 🙂

        읽어 주셔서 고마워요!
        Jeremy
    coding:
      subject: "어떤 프로그래밍 언어를 배워야 할까요?"
      preview: "코딩을 배우는 일은 기술적이고 어렵다는 인식이 있어요."
      greeting: "다시 인사드려요,"
      body_markdown: |
        코딩을 배우는 일은 기술적이고 어렵다는 인식이 있어요. 제가 코딩을 배우기 시작했을 때는 프로그래밍에 대해 아무것도 모르는 여덟 살짜리 아이였어요. 다만 **갑자기 멋진 걸 만들 수 있다**는 것만은 알았죠. 코딩이 원래 어렵다고 하는 건 몰랐어요. 그저 갑자기 제 창의력을 펼칠 새로운 통로가 생겼다는 것만 알았어요.

        대부분의 초보자는 어떤 프로그래밍 언어를 배울지 결정하는 데 오랜 시간을 쏟아요. [그건 중요하지 않아요](https://jiki.io/blog/just-learn-to-code). 중요한 건 **코딩이 어떻게 동작하는지** 정말 잘 이해하는 것이고, Jiki가 바로 그것을 가르쳐요.

        앞으로 나아가다 보면 코딩이 정말 어렵고 답답하게 느껴질 때가 있어요. 하지만 그건 _코딩_이 어려워서가 아니라 **배우는 일이 어렵기** 때문이에요. 무엇이든 잘하고 싶다면, 도전이 너무 버겁게 느껴지는 시기를 지나야 하고, 그때 버텨 내야 해요.

        Jiki는 코드를 이해할 수 있는 지점까지 데려다줄 거예요. 그다음에는 자매 사이트인 Exercism에서 **85가지 프로그래밍 언어** 중 무엇이든 배울 수 있어요!

        할 수 있어요!
        Jeremy
    premium:
      subject: "Jiki를 더 많이 활용해요 (그리고 저희도 도와주세요)"
      preview: "Jiki를 무료로 만든 건 누구나 형편과 상관없이 접근할 수 있게 하려는 거예요."
      greeting: "안녕하세요,"
      body_markdown: |
        Jiki를 무료로 만든 건 형편과 상관없이 **누구나 접근할 수 있게** 하고 싶어서예요. 누구나 수백 시간 분량의 연습 문제와 영상을 아무것도 바라지 않고 이용할 수 있어요.

        하지만 **Jiki를 운영하는 데는 돈이 들어요**. 월세도 내야 하고, 먹을 것(🍜)과 카페인(☕)도 챙겨야 하죠. 그래서 몇 가지 추가 혜택을 담은 프리미엄 요금제를 만들었어요. 분명 도움이 될 거라고 생각해요:
        - **막힐 일이 없어요**: Jiki에게 묻기 기능을 무제한으로 이용할 수 있어요.
        - **더 나아가 보세요**: 프리미엄 챌린지로 스스로를 밀어붙일 수 있어요.
        - **커뮤니티의 일원이 되어 보세요**: 정기 라이브 방송이 있어요.
        - **더 깊이 파고들어요**: 전체 해설 카탈로그를 볼 수 있어요.
        - **실력을 보여주세요**: 공식 수료증이 있어요.
        - **집중력을 유지해요**: 광고 없는 학습 환경을 제공해요.
        - **새 기능을 먼저 만나요**: 새로운 기능을 먼저 써볼 수 있어요.
        - **응원을 보여주세요**: 사이트와 커뮤니티 공간에서 프리미엄 배지를 달 수 있어요.

        **구매력 평가**를 반영해서 아주 저렴하게 책정했어요. 프리미엄 가격이 사는 나라에서 테이크아웃 음료 두 잔 값 정도라는 뜻이에요. 그래서 세계 어디에 있든 합리적인 가격으로 느껴질 거예요.

        Jiki를 즐기고 있고, **학습 속도를 높이고** 싶고, 저와 Jiki 팀을 응원하고 싶다면 [프리미엄으로 업그레이드해 주세요](https://jiki.io/premium).

        고마워요,
        Jeremy
    community:
      subject: "혼자 힘들어하지 말아요, Jiki 커뮤니티에 와요"
      preview: "무엇이든 함께하는 사람들이 있으면 성공할 가능성이 훨씬 높아요."
      greeting: "안녕하세요,"
      body_markdown: |
        무엇이든 **여럿이 함께하면** 성공할 가능성이 훨씬 높아요. 코딩도 마찬가지예요.

        도움을 받고 싶거나, 코딩 여정에 대해 이야기하고 싶거나, 그냥 다른 사람들과 어울리고 싶다면 이런 곳들이 있어요:
        - [우리 포럼](https://jiki.io/r/forum): 천천히 길게 이야기를 나누기 좋은 곳이에요. 여기서 **더 깊이 파고들어요**.
        - [Exercism의 디스코드](https://jiki.io/r/discord): 지금 접속해 있는 사람들과 **실시간 채팅**을 하기 좋은 곳이에요. #jiki-chat과 #jiki-get-help 채널을 찾아봐요.
        - [YouTube](https://jiki.io/r/youtube): 저희 AMA(무엇이든 물어보는 자리)와 다른 **라이브 방송**에 참여해서 궁금한 점을 물어봐요!

        이 공간에는 다양한 문화권에서 온 사람들이 있다는 걸 기억해요. 대화할 때는 모두에게 **서로 존중하는 태도**를 보여줘요.

        그곳에서 만나요!
        Jeremy
