ko:
  onboarding_mailer:
    overview:
      subject: "2026년, 개발자가 되는 두 갈래 길"
      preview: "지난 몇 년 동안 저는 일본어를 천천히 배워 왔어요."
      greeting: "안녕하세요,"
      body_markdown: |
        지난 몇 년 동안 저는 **일본어를 천천히 배워 왔어요**. 일본에 자주 가고 그 언어에 푹 빠져 보려고 하지만 쉽지 않아요. 요즘은 구글 번역 덕분에 일본에서 일본어를 한마디도 하지 않고 지내기가 꽤 쉬우니까요. **그래서 제 뇌는 게을러질 수 있어요**. 그래도 생활하는 데는 전혀 문제가 없어요.

        코딩도 최근에 같은 길을 걷기 시작했어요. 지난 30년 동안 IT로 뭔가를 하려면 **코딩을 배워야 했어요**. 컴퓨터와 소통할 수 있는 유일한 방법이었으니까요. 그런데 지난 2년 사이 에이전트 코딩이 등장하면서 상황이 달라졌어요. 이제는 모국어로 AI 에이전트에게 원하는 일을 말하면 **대신 코드를 써 줘요**. 내가 한 지시를 컴퓨터가 알아듣는 말로 옮겨 주는 셈이죠.

        제가 일본어가 유창해질 때까지 기다렸다가 일본을 둘러보는 게 아니듯, **무언가를 만들기 전에 코딩을 잘하는 데 몇 년을 쏟는 건 이제 의미가 없어요**.

        하지만 일본 문화에 제대로 빠져들고 일본 친구를 사귀고 싶다면 일본어를 배워야 해요. 마찬가지로 IT 분야에 들어가고 싶다면 여전히 코딩을 배워야 해요. 코드는 더 이상 관문이 아니지만, **"그럭저럭 지내는 것"과 정말 잘 해내는 것의 차이**를 만들어요.

        빨리 실력을 키우고 싶다면 학습 시간을 두 갈래로 나눠 봐요:
        1. **코딩을 배워요.** Jiki의 Coding Fundamentals 강의를 따라가면 훌륭한 기초를 다질 수 있어요.
        2. **직접 만들어요.** Learn to Build를 따라가면서 세부적인 부분까지 파고들고, 사람들이 실제로 쓸 수 있는 제품을 만들어 봐요!

        **2026년에 IT 분야에 들어가는 방법**에 대한 제 생각이 더 궁금하다면 [이 블로그 글](https://jiki.io/blog/how-to-get-into-tech-in-2026)을 읽어 봐요.

        앞으로 며칠 동안 코딩과 만들기, 두 갈래에 대해 조금 더 알려 드릴게요. [Jiki](https://jiki.io)를 어떻게 하면 최대한 활용할 수 있는지도요. 그때까지 **마음껏 파고들면서 즐겨 봐요!**

        읽어 주셔서 고마워요!
        Jeremy
    coding:
      subject: "탄탄한 코딩 기초 다지기"
      preview: "코딩을 배우는 건 어렵고 기술적이라는 인식이 있어요."
      greeting: "다시 인사드려요,"
      body_markdown: |
        코딩을 배우는 건 어렵고 기술적이라는 인식이 있어요. 제가 코딩을 처음 배우기 시작했을 때는 프로그래밍에 대해 아무것도 모르는 여덟 살 아이였어요. 그저 **갑자기 멋진 걸 만들 수 있게 됐다**는 것만 알았죠. 코딩이 원래 어려운 거라는 것도 몰랐어요. 그냥 갑자기 제 창의력을 펼칠 새로운 통로가 생겼다는 것만 알았어요.

        코딩을 배우면서 **꼭 정복해야 하는 기술 분야라고 생각하지는 않았으면 해요**. 코딩은 **자신만의** 창의력을 마음껏 펼칠 수 있는 곳이에요. **무언가를 만들고 퍼즐을 푸는 걸 즐길 수 있는** 곳이기도 하고요. 코딩의 본질이 바로 문제 해결이니까요.

        [어떤 프로그래밍 언어를 배우는지](https://jiki.io/blog/just-learn-to-code)는 중요하지 않아요. 중요한 건 **코딩이 어떻게 돌아가는지**를 정말 잘 이해하는 거예요.

        공부를 해 나가다 보면 코딩이 정말 어렵고 답답하게 느껴질 때도 있어요. 하지만 그건 _코딩_이 어려워서가 아니라 **배우는 일 자체가 어렵기** 때문이에요. 무엇이든 잘하고 싶다면 힘들다고 느껴지는 시기를 반드시 지나야 하고, 그때는 포기하지 않고 버텨야 해요.

        코딩에 그만큼 공을 들일 가치가 있는지 확신이 서지 않는다면, 2026년에도 왜 코딩을 배워야 하는지 설명한 [이 블로그 글](https://jiki.io/blog/should-i-still-learn-to-code-in-2026)을 읽어 봐요.

        읽어 주셔서 고마워요!
        Jeremy
    building:
      subject: "가장 잘 배우는 방법은 직접 만들어 보는 거예요!"
      preview: "지금이 IT 분야에 뛰어들기에 가장 좋은 때라고 정말 믿어요."
      greeting: "안녕하세요,"
      body_markdown: |
        **지금이 IT 분야에 뛰어들기에 가장 좋은 때**라고 정말 믿어요. 기본기를 배우고 빠르게 무언가를 만들어 내기가 이보다 쉬웠던 적은 없어요.

        그런데 (아주 큰 '그런데'예요!) 많은 사람이 실수하는 지점이 있어요. 고삐를 전부 AI 에이전트에게 넘겨 버리고 정작 배우지는 않는 거예요. 잠깐은 정말 좋아 보여요. 마법처럼 뭐든 뚝딱 나타나니까요. 하지만 그냥 Claude나 ChatGPT에게 이것저것 시키기만 한다면 아무것도 배우지 못하는 거예요!

        그래서 저는 함께 해 볼 수 있는 **단계별 프로젝트**를 준비하고 있어요. 이 프로젝트에서는 AI 에이전트에게 많은 작업을 맡기길 _바라요_. 다만 각 단계에서 **무슨 일이 일어나고 있는지 제대로 이해하고 있는지**는 꼭 확인해 봐요.

        이 프로젝트의 목적은 **소프트웨어를 만드는 여러 부분**을 모두 배우는 거예요. 제가 무언가를 만들 때 함께 따라와도 좋아요. 제가 무엇을, 왜 하는지 자세히 설명해 드릴게요. 그러면 AI 에이전트와 함께 같은 아이디어를 자기 프로젝트에 적용해 볼 수 있어요.

        다만 AI 에이전트가 일을 대신 해 주는 **도파민 중독이 되지는 말아요**. 시간을 들여서 무슨 일이 벌어지고 있는지 이해하는 걸 잊지 말아요!

        곧 [라이브 방송](https://youtube.com/@jiki-coding)에서 만나면 좋겠어요!

        읽어 주셔서 고마워요!
        Jeremy
    premium:
      subject: "Jiki를 더 알차게 활용해요 (그리고 저희도 도와주세요)"
      preview: "Jiki를 무료로 만든 건 누구에게나 열려 있게 하고 싶어서예요"
      greeting: "안녕하세요,"
      body_markdown: |
        Jiki를 무료로 만든 이유는 경제 상황과 상관없이 **누구에게나 열려 있길** 바라기 때문이에요. 누구나 수백 시간 분량의 연습 문제와 영상을 아무 조건 없이 이용할 수 있어요.

        하지만 **Jiki를 운영하려면 돈이 들어요**. 월세도 내고 밥(🍜)과 카페인(☕)도 해결해야 하죠. 그래서 정말 도움이 될 만한 혜택을 담은 Premium 요금제를 만들었어요:
        - **Ask Jiki**: 막혔을 때 빠르게 벗어나거나 궁금한 점을 파고들 수 있게 도와주는 AI 채팅이에요.
        - **Premium Projects**: 배우고 있는 기술을 조합해 볼 수 있는 더 어려운 연습 문제예요.
        - **Learn to Build**: 저와 함께 배울 수 있는 훨씬 많은 콘텐츠예요.
        - **배지**: Premium 배지로 사이트와 커뮤니티 공간에서 후원을 자랑할 수 있어요.

        저희는 **국가별 구매력에 맞춘 가격**을 적용해서 아주 부담 없는 가격으로 만들었어요. Premium 요금은 사는 나라에서 테이크아웃 음료 두 잔 값 정도예요. 세계 어디에 있든 합리적인 가격이라고 느껴질 거예요.

        Jiki가 즐겁고 **학습 속도를 더 높이고** 싶고, 저와 Jiki 팀을 응원하고 싶다면 [Premium으로 업그레이드](https://jiki.io/premium)해 봐요.

        고마워요,
        Jeremy
    community:
      subject: "혼자 힘들어하지 말아요, Jiki 커뮤니티에 와요"
      preview: "무엇이든 함께하는 사람들이 있으면 성공할 가능성이 훨씬 높아요."
      greeting: "안녕하세요,"
      body_markdown: |
        무엇이든 **여럿이 함께하면** 성공할 가능성이 훨씬 높아요. 코딩도 마찬가지예요.

        도움을 받고 싶거나, 코딩 여정에 대해 이야기하고 싶거나, 그냥 다른 사람들과 어울리고 싶다면 이런 곳들이 있어요:
        - [우리 포럼](https://jiki.io/r/forum): 천천히 길게 이야기를 나누기 좋은 곳이에요. 여기서 **더 깊이 파고들어요**.
        - [Exercism의 디스코드](https://jiki.io/r/discord): 지금 접속해 있는 사람들과 **실시간 채팅**을 하기 좋은 곳이에요. #jiki-chat과 #jiki-get-help 채널을 찾아봐요.
        - [YouTube](https://jiki.io/r/youtube): 저희 AMA(무엇이든 물어보는 자리)와 다른 **라이브 방송**에 참여해서 궁금한 점을 물어봐요!

        이 공간에는 다양한 문화권에서 온 사람들이 있다는 걸 기억해요. 대화할 때는 모두에게 **서로 존중하는 태도**를 보여줘요.

        그곳에서 만나요!
        Jeremy
