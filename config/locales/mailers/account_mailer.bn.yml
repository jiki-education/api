  account_mailer:
    welcome:
      subject: "জিকিতে স্বাগতম!"
      greeting: "স্বাগতম!"
      body_markdown: |
        [Jiki](https://jiki.io)-তে স্বাগতম! আপনাকে এখানে পেয়ে আমরা সত্যিই খুব আনন্দিত।

        জিকি এমনভাবে তৈরি করা হয়েছে যাতে একেবারে নতুন একজন শিক্ষার্থীও আত্মবিশ্বাসী কোডার হয়ে উঠতে পারেন। আপনি মজার মজার প্রজেক্টে কাজ করবেন, আকর্ষণীয় সমস্যা সমাধান করবেন, ছোট ছোট ধাপে এগিয়ে যাবেন এবং এই যাত্রায় অনেক কিছু শিখবেন।

        কখনও আটকে গেলে বা কোনও প্রশ্ন থাকলে নির্দ্বিধায় আমাদের সাথে যোগাযোগ করুন। কোড শেখাটা প্রথমে একটু কঠিন মনে হতে পারে, কিন্তু আপনি ঠিকই পারবেন!

        শুভকামনা, আর যাত্রাটা উপভোগ করুন!

        শুভেচ্ছান্তে,  
        জেরেমি ও টিম
    account_deletion_confirmation:
      subject: "আপনার অ্যাকাউন্টটি ডিলিট নিশ্চিত করুন"
      preview: "আপনি আপনার জিকি অ্যাকাউন্টটি পার্মানেন্টলি ডিলিট করে ফেলতে চান কি না নিশ্চিত করুন"
      greeting: "স্বাগতম!"
      body_markdown: |
        আপনার জিকি অ্যাকাউন্টটি ডিলিটের একটি অনুরোধ আমরা পেয়েছি।

        অনুরোধটি যদি আপনারই হয়ে থাকে, তাহলে নিশ্চিত করতে নিচের বাটনে ক্লিক করুন। এই কাজটি স্থায়ী এবং এটি আর ফেরানো যাবে না। আপনার সমস্ত অগ্রগতি ও ডেটা মুছে যাবে।

        আপনি যদি এই অনুরোধ না করে থাকেন, তাহলে নির্দ্বিধায় এই ইমেইলটি উপেক্ষা করতে পারেন, আপনার অ্যাকাউন্ট অপরিবর্তিত থাকবে।
      cta: "আমার অ্যাকাউন্ট মুছে ফেলুন"
