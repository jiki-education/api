uk:
  premium_mailer:
    welcome_to_premium:
      subject: "Ласкаво просимо до Jiki Premium!"
      greeting: "Вітаємо,"
      body_markdown: |
        Дякуємо за підписку на Jiki Premium!

        Усі можливості, до яких тепер відкрито доступ, зібрані на [сторінці Premium](https://jiki.io/premium). Сподіваємося, що користуватися Jiki буде дуже цікаво і що незабаром побачимося на прямій трансляції!

        Якщо виникнуть запитання, просто дайте відповідь на цей лист.

        З повагою,  
        Джеремі та команда
    subscription_ended:
      subject: "Підписку на Jiki завершено"
      greeting: "Вітаємо,"
      body_markdown: |
        Підписка на Jiki Premium завершилася, тож тепер діє наш безкоштовний тариф.

        Повний доступ до всього розділу «Вчимося програмувати» зберігається. Поновити підписку можна будь-коли на [сторінці налаштувань](https://jiki.io/settings).

        Дякуємо, що спробували Jiki Premium.

        З повагою,  
        Джеремі та команда
