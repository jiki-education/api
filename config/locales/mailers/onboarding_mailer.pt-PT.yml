pt-PT:
  onboarding_mailer:
    overview:
      subject: "Já viste o Karate Kid?"
      preview: "Uma das perguntas que mais me fazem é para quem é o Jiki."
      greeting: "Olá,"
      body_markdown: |
        A expressão **"Wax on, wax off"** tornou-se sinónimo de aprender coisas difíceis. Vem do filme _The Karate Kid_, em que o Daniel (o nosso karate kid) pede a um professor (o Mr. Miyagi) que lhe ensine karaté. Em vez de lhe ensinar a dar pontapés e socos, o Mr. Miyagi põe-no a fazer tarefas domésticas, a mais famosa das quais é encerar carros. O foco está em fazer os movimentos certos, com exatidão. E acontece (spoiler) que essa disciplina constrói competências que se transferem para o karaté, e que é o treino repetido do corpo que te torna bom.

        A programação é um pouco parecida, mas para a mente, não para o corpo. Todos queremos conseguir fazer coisas interessantes desde o primeiro dia, mas acima de tudo precisamos de construir bases realmente sólidas. Precisamos de **treinar o cérebro** da forma certa e de desenvolver as formas de pensar certas.

        - **Se estás a começar a programar**, o Jiki vai levar-te por estes exercícios mentais (esperemos que de uma forma bem mais interessante do que encerar carros!) e ensinar-te tudo o que precisas de saber.
        - **Se já programas há algum tempo**, podes ter a sensação de que andas sempre sobre as mesmas bases, sem avançar. Mas, tal como o Daniel a encerar carros, há um valor enorme em fazer bem estas fases iniciais. Fica com o Jiki e ajudamos-te a desenvolver **uma mentalidade de programação profunda e competências de base sólidas**.

        Fico muito contente por te teres juntado a nós! Se tiveres alguma dúvida, responde a este e-mail. Sou uma pessoa real e terei todo o gosto em ajudar 🙂

        Obrigado por leres!
        Jeremy
    coding:
      subject: "Que linguagem de programação devo aprender?"
      preview: "Aprender a programar tem a reputação de ser algo técnico e difícil."
      greeting: "Olá outra vez,"
      body_markdown: |
        Aprender a programar tem a reputação de ser algo técnico e difícil. Quando comecei a aprender a programar, era um miúdo de 8 anos que não sabia nada de programação, a não ser que **de repente conseguia fazer coisas fixes**. Não sabia que supostamente era difícil. Só sabia que tinha, de repente, uma nova forma de expressar a minha criatividade.

        A maioria dos principiantes passa imenso tempo a tentar decidir que linguagem de programação aprender. [Não importa](https://jiki.io/blog/just-learn-to-code). O que importa é que construas uma compreensão realmente boa de **como funciona a programação**, e é isso que o Jiki ensina.

        À medida que avanças, vai haver alturas em que programar vai mesmo parecer difícil e frustrante. Mas não é porque a _programação_ é difícil, é porque **aprender é difícil**. Se queres ficar bom em qualquer coisa, tens de passar por fases em que o desafio parece demasiado, mas tens de perseverar.

        O Jiki leva-te até ao ponto em que entendes código, e depois podes usar o nosso site irmão, o Exercism, para aprender qualquer uma de **85 linguagens de programação diferentes**!

        Vais conseguir!
        Jeremy
    premium:
      subject: "Tira mais partido do Jiki (e ajuda-nos)"
      preview: "Tornámos o Jiki gratuito porque queremos que seja acessível a todos, independentemente da situação financeira."
      greeting: "Olá,"
      body_markdown: |
        Tornámos o Jiki gratuito porque queremos que seja **acessível a todos**, independentemente da sua situação financeira. Todos têm acesso a centenas de horas de exercícios e vídeos, sem que se peça nada em troca.

        Mas **manter o Jiki a funcionar custa dinheiro**, e precisamos de conseguir pagar a renda e ter dinheiro para comida (🍜) e cafeína (☕), por isso criámos um plano Premium com alguns benefícios extra que acho que te vão ajudar mesmo muito:
        - **Nunca fiques encalhado**: podes perguntar ao Jiki sem limites.
        - **Supera-te** com os desafios Premium.
        - **Faz parte da comunidade**, com transmissões em direto regulares.
        - **Vai mais fundo** com o nosso catálogo completo de explicações passo a passo.
        - **Mostra o que vales** com um certificado oficial.
        - **Mantém-te concentrado** com uma experiência de aprendizagem sem anúncios.
        - **Tem acesso antecipado** a novas funcionalidades.
        - **Mostra o teu apoio** com distintivos Premium no site e nos espaços da comunidade.

        Tornámo-lo superacessível com a **Paridade do Poder de Compra**. Isto significa que o Premium custa mais ou menos o mesmo que duas bebidas para levar no teu país, por isso deve parecer-te um preço razoável em qualquer parte do mundo.

        Se estás a gostar do Jiki, queres **acelerar a tua aprendizagem** e queres apoiar-me a mim e à equipa do Jiki, então [passa para Premium](https://jiki.io/premium).

        Obrigado,
        Jeremy
    community:
      subject: "Não Lutes Sozinho - Junta-te à Comunidade da Jiki"
      preview: "Tens muito mais probabilidade de ter sucesso a aprender qualquer coisa se fizeres parte de um grupo."
      greeting: "Olá,"
      body_markdown: |
        Tens muito mais probabilidade de ter sucesso a aprender qualquer coisa se **fizeres parte de um grupo**. A programação não é diferente.

        Se gostarias de obter ajuda, conversar sobre a tua jornada de programação, ou simplesmente conviver com outras pessoas, há alguns sítios para o fazeres:
        - [O nosso fórum](https://jiki.io/r/forum): O sítio para ires para conversas mais lentas e longas. **Aprofunda** aqui.
        - [Discord do Exercism](https://jiki.io/r/discord): O sítio para ires para **conversas em tempo real** com outras pessoas que estão online. Procura os canais #jiki-chat e #jiki-get-help.
        - [YouTube](https://jiki.io/r/youtube): Junta-te às nossas AMAs (Pergunta-me Qualquer Coisa) e outras **transmissões em direto** para me fazeres as tuas perguntas!

        Lembra-te de que há pessoas de muitas culturas diferentes nestes espaços, por isso **por favor, sê respeitoso** com todos enquanto conversas.

        Vemo-nos lá!
        Jeremy
