fr:
  onboarding_mailer:
    overview:
      subject: "Tu as déjà vu « Karate Kid » ?"
      preview: "Une des questions qu'on me pose le plus : à qui s'adresse Jiki ?"
      greeting: "Salut,"
      body_markdown: |
        L'expression **« Wax on, wax off »** est devenue synonyme d'apprentissage de choses difficiles. Elle vient de _The Karate Kid_, où Daniel (notre karaté kid) demande à un professeur (M. Miyagi) de lui apprendre le karaté. Plutôt que de lui apprendre à donner des coups de pied et de poing, M. Miyagi lui fait faire des corvées, la plus célèbre étant de cirer des voitures. L'important, c'est d'exécuter les gestes exactement comme il faut, et il s'avère (attention, spoiler) que cette discipline développe des capacités transférables au karaté, et que c'est en entraînant son corps encore et encore qu'on devient bon.

        La programmation, c'est un peu la même chose, mais pour l'esprit plutôt que pour le corps. On veut tous pouvoir créer des trucs intéressants dès le premier jour, mais plus que tout, on a besoin de bases vraiment solides. Il faut **entraîner notre cerveau** de la bonne façon et développer les bonnes façons de penser.

        - **Si tu débutes en programmation**, Jiki va te faire passer par ces exercices mentaux (avec un peu plus d'intérêt que le cirage de voitures, on l'espère !) et t'apprendre tout ce que tu dois savoir.
        - **Si tu codes depuis un moment**, tu as peut-être l'impression de repasser sans cesse sur les mêmes bases sans avancer. Mais, comme Daniel qui cire des voitures, il y a une énorme valeur à bien faire ces premières étapes. Reste avec Jiki et on t'aidera à développer **un véritable état d'esprit de programmeur et des compétences de base solides**.

        Je suis ravi de t'avoir à bord ! Si tu as des questions, réponds simplement à cet email. Je suis un humain, et je serai content de t'aider 🙂

        Merci de m'avoir lu !
        Jeremy
    coding:
      subject: "Quel langage de programmation apprendre ?"
      preview: "Apprendre à coder a la réputation d'être technique et difficile."
      greeting: "Salut à nouveau,"
      body_markdown: |
        Apprendre à coder a la réputation d'être technique et difficile. Quand j'ai commencé, j'étais un gamin de 8 ans qui ne connaissait rien à la programmation, à part que **je pouvais soudain créer des trucs cools**. Je ne savais pas que c'était censé être difficile. Je savais juste que j'avais soudain un nouveau moyen d'exprimer ma créativité.

        La plupart des débutants passent un temps fou à se demander quel langage de programmation apprendre. [Ça n'a pas d'importance](https://jiki.io/blog/just-learn-to-code). Ce qui compte, c'est de bien comprendre **comment le code fonctionne**, et c'est exactement ce que Jiki enseigne.

        Au fil de ta progression, il y aura des moments où coder te paraîtra vraiment dur et frustrant. Mais ce n'est pas parce que _coder_ est difficile, c'est parce qu'**apprendre est difficile**. Si tu veux devenir bon dans quoi que ce soit, tu dois traverser des phases où le défi semble trop grand, mais il faut persévérer.

        Jiki t'amènera à un point où tu comprends le code, et tu pourras ensuite utiliser notre site jumeau, Exercism, pour apprendre n'importe lequel de **85 langages de programmation** !

        Tu vas y arriver !
        Jeremy
    premium:
      subject: "Profite encore plus de Jiki (et aide-nous)"
      preview: "On a rendu Jiki gratuit pour qu'il soit accessible à tout le monde, sans exception"
      greeting: "Salut,"
      body_markdown: |
        On a rendu Jiki gratuit parce qu'on veut qu'il soit **accessible à tout le monde**, quelle que soit sa situation financière. Chacun a accès à des centaines d'heures d'exercices et de vidéos, sans rien avoir à donner en retour.

        Mais **faire tourner Jiki coûte de l'argent**, et il faut bien payer nos loyers, nous nourrir (🍜) et nous offrir de la caféine (☕), alors on a ajouté une offre Premium avec quelques avantages de plus qui, je pense, vont vraiment t'aider :
        - **Ne reste jamais bloqué** grâce à l'assistance Ask Jiki illimitée.
        - **Dépasse-toi** avec les défis Premium.
        - **Fais partie de la communauté** grâce à des _livestreams_ réguliers.
        - **Approfondis** grâce à notre catalogue complet de solutions guidées.
        - **Mets tes compétences en valeur** avec un certificat officiel.
        - **Reste concentré** grâce à une expérience d'apprentissage sans publicité.
        - **Accède en avant-première** aux nouvelles fonctionnalités.
        - **Montre ton soutien** avec des badges Premium sur le site et dans les espaces communautaires.

        On l'a rendu super abordable grâce à la **parité de pouvoir d'achat**. Concrètement, le Premium coûte à peu près le prix de deux boissons à emporter dans ton pays, donc le tarif devrait te sembler raisonnable où que tu sois dans le monde.

        Si tu prends plaisir à utiliser Jiki, si tu veux **accélérer ton apprentissage** et nous soutenir, moi et l'équipe Jiki, alors [passe au Premium](https://jiki.io/premium).

        Merci,
        Jeremy
    community:
      subject: "Ne galère pas tout seul, rejoins la communauté Jiki"
      preview: "Tu as beaucoup plus de chances de réussir à apprendre si tu fais partie d'un groupe."
      greeting: "Salut,"
      body_markdown: |
        Tu as beaucoup plus de chances de réussir à apprendre quoi que ce soit si **tu fais partie d'un groupe**. La programmation ne fait pas exception.

        Si tu veux de l'aide, discuter de ton parcours en programmation ou simplement passer du temps avec d'autres, voici quelques endroits où le faire :
        - [Notre forum](https://jiki.io/r/forum) : l'endroit idéal pour des conversations plus posées et plus longues. C'est ici qu'on **va plus loin**.
        - [Le Discord d'Exercism](https://jiki.io/r/discord) : l'endroit idéal pour **discuter en temps réel** avec les autres personnes connectées. Cherche les salons #jiki-chat et #jiki-get-help.
        - [YouTube](https://jiki.io/r/youtube) : participe à nos AMA (des sessions où tu peux tout me demander) et à nos autres **directs** pour me poser tes questions !

        N'oublie pas qu'il y a des personnes de cultures très différentes dans ces espaces, alors **sois respectueux** envers tout le monde quand tu discutes.

        À bientôt !
        Jeremy
