hi:
  account_mailer:
    welcome:
      subject: "Jiki में आपका स्वागत है!"
      greeting: "नमस्ते,"
      body_markdown: |
        [Jiki](https://jiki.io) में आपका स्वागत है! हमें बहुत खुशी है कि आप यहाँ हैं।

        Jiki को इस तरह बनाया गया है कि आप बिल्कुल शुरुआत से लेकर आत्मविश्वास के साथ कोड लिखने तक पहुँच जाएँ। आप कई मज़ेदार प्रोजेक्ट पर काम करेंगे और दिलचस्प समस्याएँ हल करेंगे। आप एक-एक छोटे कदम से आगे बढ़ेंगे और इस यात्रा में बहुत कुछ सीखेंगे।

        अगर कभी आप अटक जाएँ या कोई सवाल हो, तो बिना झिझक हमें बताइए। शुरू में कोड सीखना भारी लग सकता है, लेकिन आप यह ज़रूर कर लेंगे!

        मज़े कीजिए और इस यात्रा का आनंद लीजिए!

        शुभकामनाएँ,  
        Jeremy और टीम
    account_deletion_confirmation:
      subject: "अपना अकाउंट हटाने की पुष्टि कीजिए"
      preview: "कृपया पुष्टि कीजिए कि आप अपना Jiki अकाउंट हमेशा के लिए हटाना चाहते हैं।"
      greeting: "नमस्ते,"
      body_markdown: |
        हमें आपका Jiki अकाउंट हटाने का अनुरोध मिला है।

        अगर यह अनुरोध आपने ही किया है, तो पुष्टि के लिए नीचे दिए गए बटन पर क्लिक कीजिए। यह कार्रवाई हमेशा के लिए है और इसे बदला नहीं जा सकता। आपकी सारी प्रगति और सारा डेटा हटा दिया जाएगा।

        अगर आपने यह अनुरोध नहीं किया है, तो आप निश्चिंत होकर इस ईमेल को अनदेखा कर सकते हैं और आपका अकाउंट वैसा ही रहेगा।
      cta: "मेरा अकाउंट हटाएँ"
