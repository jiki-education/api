zh-TW:
  onboarding_mailer:
    overview:
      subject: "你看過《小子難纏》嗎？"
      preview: "我最常被問到的問題之一，就是 Jiki 到底適合誰。"
      greeting: "嗨，"
      body_markdown: |
        **「Wax on, wax off」**這句話，已經成了「學習困難事物」的代名詞。它出自電影《小子難纏》，片中丹尼爾（我們的小子難纏）請一位老師（宮城先生）教他空手道。宮城先生沒有教他怎麼踢、怎麼出拳，而是要他做家事，最有名的就是替車子上蠟。重點在於把每個動作做到位，結果發現（劇透一下），這種紀律培養出的能力可以轉移到空手道上，而反覆鍛鍊身體的過程，正是讓你變強的原因。

        寫程式有點像這樣，只是鍛鍊的對象是頭腦，不是身體。我們都希望從第一天就能做出有趣的東西，但更重要的是建立真正扎實的基礎。我們需要用正確的方式**訓練我們的腦袋**，培養正確的思考方式。

        - **如果你剛開始接觸寫程式**，Jiki 會帶你走過這些腦力練習（希望比替車子上蠟有趣一點！），並教你所有你需要知道的事。
        - **如果你已經寫了一段時間的程式**，可能會覺得自己一直在同樣的基礎上打轉，沒有前進。但就像丹尼爾替車子上蠟一樣，把這些早期階段做好，價值非常大。繼續跟著 Jiki，我們會幫你培養**深刻的寫程式思維和扎實的基礎能力**。

        很高興你加入！有任何問題，直接回覆這封信就好。我是真人，很樂意幫忙 🙂

        謝謝你讀完這封信！
        Jeremy
    coding:
      subject: "我該學哪一種程式語言？"
      preview: "學寫程式總給人技術門檻高、很困難的印象。"
      greeting: "又見面了，"
      body_markdown: |
        學寫程式總給人技術門檻高、很困難的印象。我開始學寫程式的時候，只是個 8 歲的小孩，對程式一無所知，只知道**我突然能做出很酷的東西了**。我不知道大家都說它很難。我只知道自己突然多了一個發揮創意的新出口。

        大多數初學者花很多時間決定該學哪一種程式語言。[其實這不重要](https://jiki.io/blog/just-learn-to-code)。真正重要的是，你要真正理解**寫程式是怎麼運作的**，而這正是 Jiki 要教你的。

        隨著你進步，有些時候寫程式真的會讓人覺得困難又挫折。但這不是因為_寫程式_很難，而是因為**學習本來就很難**。想在任何事情上變強，你都必須經歷那種挑戰大到快撐不住的階段，然後堅持下去。

        Jiki 會帶你走到能看懂程式碼的程度，之後你就可以用我們的姊妹網站 Exercism，學**85 種不同的程式語言**！

        你可以的！
        Jeremy
    premium:
      subject: "從 Jiki 得到更多（也幫幫我們）"
      preview: "我們讓 Jiki 免費，是希望不論狀況如何，每個人都能使用它。"
      greeting: "嗨，"
      body_markdown: |
        我們把 Jiki 變成免費，是希望**每個人都能使用**，不論經濟狀況如何。每個人都能取得數百小時的練習和影片，完全不需要付出任何東西。

        但**經營 Jiki 是需要花錢的**，我們得付房租，還得買食物（🍜）和咖啡因（☕），所以我們推出了 Premium 方案，提供一些我認為真的會幫到你的額外好處：
        - **再也不會卡住**：無限次數的 Ask Jiki 支援。
        - **挑戰自己的極限**：Premium 挑戰。
        - **成為社群的一份子**：定期直播。
        - **深入學習**：完整的逐步解說目錄。
        - **展現你的實力**：官方證書。
        - **保持專注**：沒有廣告的學習體驗。
        - **搶先體驗**：新功能。
        - **表達你的支持**：在網站和社群空間展示 Premium 徽章。

        我們用**購買力平價**讓價格變得非常親民。意思是，Premium 的費用大約等於你所在國家兩杯外帶飲料的價格，所以不管你住在世界哪個角落，都會覺得價格很合理。

        如果你喜歡 Jiki，想**加快學習腳步**，也想支持我和 Jiki 團隊，歡迎[升級 Premium](https://jiki.io/premium)。

        謝謝你，
        Jeremy
    community:
      subject: "別一個人苦撐，加入 Jiki 社群吧"
      preview: "學任何東西，只要有一群人一起，成功的機會就大得多。"
      greeting: "嗨，"
      body_markdown: |
        學任何東西，只要**你有一群人一起**，成功的機會就大得多。寫程式也不例外。

        如果你想找人幫忙、聊聊你的寫程式旅程，或只是想和大家一起待著，這裡有幾個地方可以去：
        - [我們的論壇](https://jiki.io/r/forum)：適合慢慢聊、深入討論的地方。想**聊得更深**，就來這裡。
        - [Exercism 的 Discord](https://jiki.io/r/discord)：和其他在線上的人**即時聊天**的地方。找找 #jiki-chat 和 #jiki-get-help 這兩個頻道。
        - [YouTube](https://jiki.io/r/youtube)：來參加我們的 AMA（Ask Me Anything，什麼都可以問）和其他**直播**，把你的問題問我！

        記得，這些地方有來自各種不同文化的人，所以聊天時請**尊重每一個人**。

        到時候見！
        Jeremy
