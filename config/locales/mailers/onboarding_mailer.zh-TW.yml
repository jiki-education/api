zh-TW:
  onboarding_mailer:
    overview:
      subject: "2026 年成為開發者的兩個關鍵"
      preview: "這幾年來，我一直在慢慢學日文。"
      greeting: "嗨，"
      body_markdown: |
        這幾年來，我一直在**慢慢學日文**。我經常去日本，也努力讓自己沉浸在日文環境裡，但這並不容易，因為現在有 Google Translate 幫忙，你很容易在日本待上一段時間，卻一句日文都不用說。**所以我的腦袋可以偷懶**，但我還是過得好好的。

        最近，寫程式也開始走上同一條路。過去 30 年來，如果你想在科技業做點什麼，**你就得學會寫程式**，那是你和電腦溝通的唯一方式。但過去兩年，隨著 AI 代理寫程式的興起，情況變了。現在你可以用自己的母語，告訴 AI 代理你想做什麼，**它就會幫你把程式碼寫好**，把你的指令翻譯給電腦聽。

        就像我不用等到日文流利，才能去探索日本一樣，**現在也完全沒必要先花好幾年變成寫程式高手**，才能開始動手做東西。

        但如果我真的想深入日本文化、交到日本朋友，我就得學日文。同樣地，如果你想進入科技業，你還是得學會寫程式。程式碼不再是守門人，但它是**「勉強過得去」和真正發光發熱之間的差別**。

        想快速變強，把你的學習時間分成兩塊：
        1. **學會寫程式。** 把 Jiki 的「Coding Fundamentals」課程走完，你就會有很扎實的基礎。
        2. **動手做東西。** 跟著「Learn to Build」走，深入了解細節，做出真正能用的產品！

        如果你想多了解我對**2026 年怎麼進入科技業**的想法，可以讀讀[這篇部落格文章](https://jiki.io/blog/how-to-get-into-tech-in-2026)。

        接下來幾天，我會再多跟你聊聊寫程式和動手做這兩個面向，還有你可以怎麼把 [Jiki](https://jiki.io) 用得更好。在那之前，**就一頭栽進去，好好玩吧！**

        感謝閱讀！
        Jeremy
    coding:
      subject: "打下扎實的寫程式基礎"
      preview: "大家總覺得學寫程式既專業又困難。"
      greeting: "嗨，又見面了！"
      body_markdown: |
        學寫程式一向給人技術門檻高、很困難的印象。我開始學寫程式的時候，是個 8 歲的小孩，對寫程式一無所知，只知道**我突然能做出很酷的東西**。我不知道這件事應該很難。我只知道，我突然多了一個發揮創意的新出口。

        在你學寫程式的過程中，**我不希望你把它看成什麼得征服的技術學科**，我希望你把它看成一個可以釋放**你**創意的地方，一個能**開心做東西**、解謎題的地方。因為寫程式真正的本質，就是解決問題。

        [你學哪一種程式語言](https://jiki.io/blog/just-learn-to-code)並不重要，重要的是你要真正弄懂**寫程式是怎麼運作的**。

        隨著你往前進，有些時候寫程式真的會讓你覺得又難又挫折。但這不是因為_寫程式_很難，而是因為**學習本來就很難**。想在任何事情上變強，你都得經歷挑戰大到讓人吃不消的階段，而你得撐過去。

        如果你不確定學寫程式這部分值不值得投入，可以讀讀[這篇部落格文章](https://jiki.io/blog/should-i-still-learn-to-code-in-2026)，裡面說明了為什麼 2026 年你還是該學寫程式。

        感謝閱讀！
        Jeremy
    building:
      subject: "最好的學習方式就是動手做！"
      preview: "我真的認為，現在是進入科技業最好的時機。"
      greeting: "嗨，"
      body_markdown: |
        我真的相信，**現在是進入科技業最好的時機**。要學基本功、要能很快做出東西，從來沒有比現在更容易的時候。

        但是（這是個很重要的但是！）很多人走錯的地方，是把主導權整個交給 AI 代理，自己卻沒有真的在學。一開始這感覺很棒，你可以像變魔術一樣讓東西自己冒出來，但如果你做的事只是告訴 Claude 或 ChatGPT 該做什麼，那你其實什麼都沒學到！

        所以我在準備一些**按部就班的專案**，讓你可以跟著做。在這些專案裡，我_希望_你用 AI 代理幫你分擔很多工作，但我也要你確定，在每個階段你都**真的搞懂發生了什麼事**。

        這些專案的目的，是讓你學到**打造軟體的所有不同環節**。你可以跟著我一起做東西，我會清楚說明我在做什麼、為什麼這麼做，然後你可以和 AI 代理合作，把同樣的想法套用到你自己的專案上。

        只是要提醒你，**別對 AI 代理幫你做完事情的那種多巴胺快感上癮**。一定要花時間搞懂到底發生了什麼事！

        希望很快能在[直播](https://youtube.com/@jiki-coding)上見到你！

        感謝閱讀！
        Jeremy
    premium:
      subject: "從 Jiki 得到更多（也幫我們一把）"
      preview: "我們把 Jiki 做成免費，是希望每個人都能使用，不論經濟狀況。"
      greeting: "嗨，"
      body_markdown: |
        我們把 Jiki 做成免費，是因為我們希望不管經濟狀況如何，**每個人都能使用它**。每個人都能拿到數百小時的練習和影片，完全開放，不求任何回報。

        但**經營 Jiki 是要花錢的**，我們也得付房租、買食物（🍜）和咖啡（☕），所以我們加了 Premium 方案，提供一些我覺得真的會幫到你的額外好處：
        - **Ask Jiki**：我們的 AI 聊天，幫你快速脫離卡關，或一起探索你的問題。
        - **Premium Projects**：更難的練習，讓你把正在學的技能組合起來。
        - **Learn to Build**：超多內容，讓你可以跟我一起學。
        - **Badges**：用 Premium 徽章，在網站和社群空間展現你的支持。

        我們用**購買力平價**，讓價格變得超級親民。意思是，Premium 的價格大約等於你所在國家兩杯外帶飲料的錢，所以不管你在世界哪個角落，都會覺得這個價格很合理。

        如果你喜歡 Jiki、想**加快學習速度**，也想支持我和 Jiki 團隊，歡迎[升級到 Premium](https://jiki.io/premium)。

        謝謝你，
        Jeremy
    community:
      subject: "別一個人苦撐，加入 Jiki 社群吧"
      preview: "學任何東西，只要有一群人一起，成功的機會就大得多。"
      greeting: "嗨，"
      body_markdown: |
        學任何東西，只要**你有一群人一起**，成功的機會就大得多。寫程式也不例外。

        如果你想找人幫忙、聊聊你的寫程式旅程，或只是想和大家一起待著，這裡有幾個地方可以去：
        - [我們的論壇](https://jiki.io/r/forum)：適合慢慢聊、深入討論的地方。想**聊得更深**，就來這裡。
        - [Exercism 的 Discord](https://jiki.io/r/discord)：和其他在線上的人**即時聊天**的地方。找找 #jiki-chat 和 #jiki-get-help 這兩個頻道。
        - [YouTube](https://jiki.io/r/youtube)：來參加我們的 AMA（Ask Me Anything，什麼都可以問）和其他**直播**，把你的問題問我！

        記得，這些地方有來自各種不同文化的人，所以聊天時請**尊重每一個人**。

        到時候見！
        Jeremy
