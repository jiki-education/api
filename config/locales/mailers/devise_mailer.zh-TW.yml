# Vendored from devise-i18n (zh-TW.yml) - generic transactional copy,
# remapped onto our key shape. Safe to hand-tune toward Jiki's voice.
zh-TW:
  devise:
    mailer:
      confirmation_instructions:
        subject: 帳號驗證步驟
        preview: 您可以利用下面的連結確認您的帳戶的電子郵件：
