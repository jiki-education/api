de:
  onboarding_mailer:
    overview:
      subject: "Hast du Karate Kid gesehen?"
      preview: "Eine der Fragen, die mir am häufigsten gestellt wird: Für wen ist Jiki eigentlich gedacht?"
      greeting: "Hallo,"
      body_markdown: |
        Der Satz **„Wax on, wax off“** ist zum Synonym dafür geworden, schwierige Dinge zu lernen. Er stammt aus _Karate Kid_, wo Daniel (unser Karatekid) einen Lehrer (Mr. Miyagi) bittet, ihm Karate beizubringen. Statt ihm beizubringen, wie man tritt und schlägt, lässt Mr. Miyagi ihn Hausarbeit erledigen, am berühmtesten das Polieren von Autos. Der Fokus liegt darauf, die Bewegungen genau richtig auszuführen, und es stellt sich heraus (Spoiler), dass diese Disziplin Fähigkeiten aufbaut, die sich auf Karate übertragen lassen, und dass genau das wiederholte Training des eigenen Körpers dich gut macht.

        Programmieren ist ein bisschen ähnlich, nur für den Kopf statt für den Körper. Wir alle wollen vom ersten Tag an coole Sachen machen können, aber mehr als alles andere brauchen wir wirklich solide Grundlagen. Wir müssen **unser Gehirn** richtig trainieren und die richtigen Denkweisen entwickeln.

        - **Wenn du neu beim Programmieren bist**, nimmt Jiki dich mit durch diese mentalen Übungen (hoffentlich interessanter als Autos zu polieren!) und bringt dir alles bei, was du wissen musst.
        - **Wenn du schon eine Weile programmierst**, kann es sich anfühlen, als würdest du immer wieder dieselben Grundlagen durchkauen und nicht vorankommen. Aber genau wie Daniel beim Autopolieren steckt enorm viel Wert darin, diese frühen Phasen richtig zu machen. Bleib bei Jiki und wir helfen dir, **eine tiefe Programmier-Denkweise und solide Grundfähigkeiten** zu entwickeln.

        Ich freue mich, dass du dabei bist! Bei Fragen antworte einfach auf diese E-Mail. Ich bin ein Mensch und helfe gerne 🙂

        Danke fürs Lesen!
        Jeremy
    coding:
      subject: "Welche Programmiersprache soll ich lernen?"
      preview: "Programmieren lernen gilt als technisch und schwierig."
      greeting: "Hallo nochmal,"
      body_markdown: |
        Programmieren lernen gilt als technisch und schwierig. Als ich anfing zu programmieren, war ich ein achtjähriger Junge, der nichts über Programmierung wusste, außer dass **ich plötzlich coole Sachen machen konnte**. Ich wusste nicht, dass es schwierig sein soll. Ich wusste nur, dass ich plötzlich ein neues Ventil für meine Kreativität hatte.

        Die meisten Anfänger verbringen Ewigkeiten damit, sich zu entscheiden, welche Programmiersprache sie lernen sollen. [Das spielt keine Rolle](https://jiki.io/blog/just-learn-to-code). Was zählt, ist, dass du ein richtig gutes Verständnis dafür aufbaust, **wie Programmieren funktioniert**, und genau das bringt dir Jiki bei.

        Wenn du vorankommst, wird es Momente geben, in denen sich Programmieren wirklich schwierig und frustrierend anfühlt. Aber das liegt nicht daran, dass _Programmieren_ schwierig ist, sondern daran, dass **Lernen schwierig ist**. Wenn du in etwas gut werden willst, musst du Phasen durchmachen, in denen die Herausforderung zu groß wirkt, aber du musst durchhalten.

        Jiki bringt dich an den Punkt, an dem du Code verstehst, und dann kannst du unsere Schwester-Website Exercism nutzen, um eine von **85 verschiedenen Programmiersprachen** zu lernen!

        Du schaffst das!
        Jeremy
    premium:
      subject: "Hol mehr aus Jiki raus (und hilf uns dabei)"
      preview: "Wir haben Jiki kostenlos gemacht, weil es für alle zugänglich sein soll."
      greeting: "Hallo,"
      body_markdown: |
        Wir haben Jiki kostenlos gemacht, weil es **für alle zugänglich** sein soll, unabhängig von der finanziellen Situation. Jeder bekommt hunderte Stunden Übungen und Videos, alles verfügbar, ohne dass wir etwas dafür verlangen.

        Aber **Jiki kostet Geld im Betrieb**, und wir müssen unsere Mieten zahlen und uns Essen (🍜) und Koffein (☕) leisten können. Deshalb haben wir ein Premium-Angebot hinzugefügt, mit ein paar Extra-Vorteilen, die dir, glaube ich, wirklich helfen:
        - **Bleib nie hängen** mit unbegrenztem Ask-Jiki-Support.
        - **Fordere dich weiter** mit Premium-Herausforderungen.
        - **Sei Teil der Community** mit regelmäßigen Livestreams.
        - **Geh tiefer** mit unserem kompletten Walkthrough-Katalog.
        - **Zeig, was du kannst** mit einem offiziellen Zertifikat.
        - **Bleib fokussiert** mit einem werbefreien Lernerlebnis.
        - **Sei früh dabei** bei neuen Features.
        - **Zeig deine Unterstützung** mit Premium-Badges auf der Website und in den Community-Räumen.

        Wir haben es mit **Kaufkraftparität** super günstig gemacht. Das heißt, Premium kostet etwa so viel wie zwei Getränke zum Mitnehmen in deinem Land. Es sollte sich also überall auf der Welt wie ein fairer Preis anfühlen.

        Wenn dir Jiki Spaß macht, du **schneller lernen** willst und mich und das Jiki-Team unterstützen möchtest, dann [wechsle bitte zu Premium](https://jiki.io/premium).

        Danke,
        Jeremy
    community:
      subject: "Nicht allein kämpfen: Komm in die Jiki-Community"
      preview: "In einer Gruppe lernst du fast alles erfolgreicher."
      greeting: "Hallo,"
      body_markdown: |
        Deine Chancen, irgendetwas zu lernen, sind viel größer, wenn **du Teil einer Gruppe bist**. Beim Programmieren ist das nicht anders.

        Wenn du Hilfe möchtest, dich über deinen Weg beim Programmieren austauschen willst oder einfach mit anderen abhängen willst, gibt es ein paar Orte dafür:
        - [Unser Forum](https://jiki.io/r/forum): Der Ort für ruhigere, ausführliche Gespräche. Hier kannst du **tiefer eintauchen**.
        - [Exercisms Discord](https://jiki.io/r/discord): Der Ort für **Chats in Echtzeit** mit anderen, die gerade online sind. Schau nach den Kanälen #jiki-chat und #jiki-get-help.
        - [YouTube](https://jiki.io/r/youtube): Sei bei unseren AMAs (Ask Me Anything) und anderen **Livestreams** dabei und stell mir deine Fragen!

        Denk daran, dass in diesen Räumen Menschen aus vielen verschiedenen Kulturen unterwegs sind. Sei deshalb **bitte respektvoll** zu allen, wenn du dich austauschst.

        Wir sehen uns!
        Jeremy
