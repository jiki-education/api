es-ES:
  onboarding_mailer:
    overview:
      subject: "¿Has visto Karate Kid?"
      preview: "Una de las preguntas que más me hacen es para quién es Jiki."
      greeting: "Hola,"
      body_markdown: |
        La frase **«Dar cera, pulir cera»** se ha convertido en sinónimo de aprender cosas difíciles. Viene de _Karate Kid_, donde Daniel (nuestro chico del kárate) le pide a un profesor (el señor Miyagi) que le enseñe kárate. En lugar de enseñarle a dar patadas y puñetazos, el señor Miyagi le hace hacer tareas de la casa, y la más famosa es pulir coches. La clave está en hacer los movimientos exactos correctamente, y resulta (spoiler) que esa disciplina desarrolla habilidades que se pueden trasladar al kárate, y que el proceso de entrenar el cuerpo una y otra vez es lo que te hace bueno.

        Programar es un poco parecido, pero para la mente, no para el cuerpo. Todos queremos ser capaces de crear cosas interesantes desde el primer día, pero más que nada necesitamos construir unos fundamentos realmente sólidos. Tenemos que **entrenar nuestro cerebro** de la forma correcta y desarrollar las formas de pensar correctas.

        - **Si acabas de empezar con la programación**, Jiki te va a acompañar en estos ejercicios mentales (¡esperemos que de una forma más interesante que pulir coches!) y te va a enseñar todo lo que necesitas saber.
        - **Si llevas un tiempo programando**, puede que sientas que estás repasando los mismos conceptos básicos una y otra vez sin avanzar. Pero, igual que Daniel puliendo coches, hay un valor enorme en hacer bien estas primeras etapas. Quédate con Jiki y te ayudaremos a desarrollar **una mentalidad de programación profunda y unas habilidades fundamentales sólidas**.

        ¡Me hace mucha ilusión tenerte a bordo! Si tienes cualquier pregunta, responde a este correo. Soy una persona real y me encantará ayudarte 🙂

        ¡Gracias por leer!
        Jeremy
    coding:
      subject: "¿Qué lenguaje de programación debería aprender?"
      preview: "Aprender a programar tiene fama de ser técnico y difícil."
      greeting: "Hola de nuevo,"
      body_markdown: |
        Aprender a programar tiene fama de ser técnico y difícil. Cuando yo empecé a programar, era un niño de 8 años que no sabía nada de programación salvo que **de repente podía crear cosas chulas**. No sabía que se supone que es difícil. Solo sabía que de repente tenía una nueva vía para mi creatividad.

        La mayoría de los principiantes pasan mucho tiempo intentando decidir qué lenguaje de programación aprender. [Da igual](https://jiki.io/blog/just-learn-to-code). Lo que importa es que construyas una comprensión realmente buena de **cómo funciona la programación**, y eso es lo que enseña Jiki.

        A medida que avances, habrá momentos en los que programar se sienta de verdad difícil y frustrante. Pero no es porque _programar_ sea difícil, sino porque **aprender es difícil**. Si quieres llegar a ser bueno en algo, tienes que pasar por etapas en las que el reto parece demasiado, pero tienes que perseverar.

        Jiki te llevará hasta un punto en el que entiendas el código y, después, podrás usar nuestra web hermana, Exercism, para aprender cualquiera de los **85 lenguajes de programación** que hay.

        ¡Tú puedes!
        Jeremy
    premium:
      subject: "Saca más partido a Jiki (y ayúdanos)"
      preview: "Hicimos Jiki gratis para que esté al alcance de todos, sin excepciones."
      greeting: "Hola,"
      body_markdown: |
        Hicimos Jiki gratis porque queremos que sea **accesible para todo el mundo**, sea cual sea su situación económica. Todos tienen acceso a cientos de horas de ejercicios y vídeos, disponibles sin pedir nada a cambio.

        Pero **mantener Jiki cuesta dinero**, y tenemos que poder pagar el alquiler y permitirnos comer (🍜) y la cafeína (☕), así que hemos añadido un plan Premium con algunas ventajas extra que creo que te van a ayudar de verdad:
        - **No te quedes nunca atascado** con soporte ilimitado de Pregunta a Jiki.
        - **Exígete más** con los retos Premium.
        - **Forma parte de la comunidad** con directos periódicos.
        - **Profundiza más** con nuestro catálogo completo de explicaciones paso a paso.
        - **Demuestra tus habilidades** con un certificado oficial.
        - **Mantén la concentración** con una experiencia de aprendizaje sin anuncios.
        - **Accede antes que nadie** a las nuevas funcionalidades.
        - **Muestra tu apoyo** con insignias Premium en el sitio y en los espacios de la comunidad.

        Lo hemos hecho súper asequible usando la **paridad de poder adquisitivo**. Eso significa que Premium cuesta más o menos lo mismo que dos bebidas para llevar en tu país, así que debería parecerte un precio razonable estés donde estés en el mundo.

        Si estás disfrutando de Jiki, quieres **acelerar tu aprendizaje** y quieres apoyarme a mí y al equipo de Jiki, [pásate a Premium](https://jiki.io/premium).

        Gracias,
        Jeremy
    community:
      subject: "No luches solo: únete a la comunidad de Jiki"
      preview: "Es mucho más probable que tengas éxito aprendiendo cualquier cosa si formas parte de un grupo."
      greeting: "Hola,"
      body_markdown: |
        Es mucho más probable que tengas éxito aprendiendo cualquier cosa si **formas parte de un grupo**. En la programación no es diferente.

        Si te gustaría recibir ayuda, conversar sobre tu camino en la programación o simplemente pasar el rato con otros, hay algunos lugares para hacerlo:
        - [Nuestro foro](https://jiki.io/r/forum): El lugar para conversaciones más lentas y de formato largo. **Profundiza** aquí.
        - [Discord de Exercism](https://jiki.io/r/discord): El lugar para **chatear en tiempo real** con otros que están en línea. Busca los canales #jiki-chat y #jiki-get-help.
        - [YouTube](https://jiki.io/r/youtube): Únete a nuestras AMA (pregúntame lo que quieras) y otras **transmisiones en vivo** para hacerme tus preguntas.

        Recuerda que en estos espacios hay personas de muchas culturas diferentes, así que **por favor sé respetuoso** con todos mientras conversas.

        ¡Nos vemos allí!
        Jeremy
