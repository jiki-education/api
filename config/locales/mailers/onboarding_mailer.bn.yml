bn:
  onboarding_mailer:
    overview:
      subject: "২০২৬ সালে ডেভেলপার হওয়ার দুই ভাগ"
      preview: "গত কয়েক বছর ধরে আমি ধীরে ধীরে জাপানি ভাষা শিখছি।"
      greeting: "স্বাগতম!"
      body_markdown: |
        গত কয়েক বছর ধরে আমি **ধীরে ধীরে জাপানি ভাষা শিখছি**। আমি নিয়মিত জাপানে যাই আর ভাষাটার মধ্যে ডুবে থাকার চেষ্টা করি, কিন্তু কাজটা কঠিন। কারণ আজকাল Google Translate-এর সাহায্যে জাপানে সময় কাটানো আর একটাও জাপানি শব্দ না বলা বেশ সহজ। **ফলে আমার মস্তিষ্ক আলসেমি করার সুযোগ পায়**, তবু আমার দিব্যি চলে যায়।

        কোডিংও সম্প্রতি ঠিক একই পথে হাঁটতে শুরু করেছে। গত ৩০ বছর ধরে টেক নিয়ে কিছু করতে চাইলে **আপনাকে কোড শিখতেই হতো**। কম্পিউটারের সাথে কথা বলার সেটাই ছিল একমাত্র উপায়। কিন্তু গত দুই বছরে এজেন্টিক কোডিংয়ের উত্থানে সেটা বদলে গেছে। এখন আপনি নিজের ভাষাতেই একটা AI এজেন্টকে বলতে পারেন আপনি কী করাতে চান, আর **সে আপনার হয়ে কোডটা লিখে দেবে**, অর্থাৎ আপনার নির্দেশ কম্পিউটারের ভাষায় অনুবাদ করে দেবে।

        জাপান ঘুরে দেখার আগে যেমন আমাকে জাপানি ভাষায় সড়গড় হওয়ার অপেক্ষায় বসে থাকতে হয় না, তেমনি **কিছু বানানো শুরু করার আগে কোডিংয়ে দক্ষ হতে বছরের পর বছর কাটানোর আর কোনো মানে হয় না**।

        কিন্তু আমি যদি সত্যিই জাপানি সংস্কৃতির ভেতরে ঢুকতে চাই আর জাপানি বন্ধু বানাতে চাই, তাহলে আমাকে জাপানি ভাষা শিখতেই হবে। ঠিক তেমনি, আপনি যদি টেক ইন্ডাস্ট্রিতে ঢুকতে চান, আপনাকে এখনো কোড শিখতে হবে। কোড আর দরজার প্রহরী নয়, কিন্তু **"কোনোমতে চালিয়ে নেওয়া" আর সত্যিকারের সাফল্যের মধ্যে পার্থক্যটা কোডই গড়ে দেয়**।

        দ্রুত ভালো হয়ে উঠতে চাইলে শেখার সময়টাকে দুই ভাগে ভাগ করুন:
        1. **কোড শিখুন।** জিকির কোডিং ফান্ডামেন্টালস কোর্সটি শেষ করুন, তাতে আপনার ভিত্তি দারুণ মজবুত হবে।
        2. **কিছু বানান।** "Learn to Build" শেষ করুন, খুঁটিনাটির ভেতরে ঢুকুন, এমন প্রোডাক্ট বানান যা মানুষ সত্যিই ব্যবহার করতে পারে!

        **২০২৬ সালে টেক ইন্ডাস্ট্রিতে কীভাবে ঢুকবেন** সে বিষয়ে আমার ভাবনা আরও জানতে চাইলে [এই ব্লগ পোস্টটি](https://jiki.io/blog/how-to-get-into-tech-in-2026) পড়ুন।

        আগামী কয়েক দিনে আমি কোডিং আর বানানো, দুই দিক নিয়েই আপনাকে আরও কিছু বলব, আর [Jiki](https://jiki.io)-কে কীভাবে পুরোপুরি কাজে লাগাবেন সেটাও জানাব। ততক্ষণ পর্যন্ত, **লেগে পড়ুন আর উপভোগ করুন!**

        পড়ার জন্য ধন্যবাদ!
        জেরেমি
    coding:
      subject: "কোডিংয়ের মজবুত ভিত গড়ে তুলুন"
      preview: "কোড শেখা মানেই কঠিন আর টেকনিক্যাল, এমন একটা ধারণা প্রচলিত আছে।"
      greeting: "আবারও স্বাগতম!"
      body_markdown: |
        কোড শেখা মানেই কঠিন আর টেকনিক্যাল, এমন একটা ধারণা প্রচলিত আছে। আমি যখন কোড শিখতে শুরু করি, তখন আমি ৮ বছরের একটা বাচ্চা। প্রোগ্রামিং সম্পর্কে আমি কিছুই জানতাম না, শুধু জানতাম যে **হঠাৎ করেই আমি দারুণ সব জিনিস বানাতে পারি**। এটা যে কঠিন হওয়ার কথা, সেটাই আমার জানা ছিল না। আমি শুধু বুঝেছিলাম, আমার সৃজনশীলতা প্রকাশের একটা নতুন পথ হঠাৎ খুলে গেছে।

        কোড শেখার সময় **আমি চাই না আপনি এটাকে আয়ত্ত করার মতো কোনো টেকনিক্যাল বিষয় হিসেবে দেখুন**। আমি চাই আপনি এটাকে এমন একটা জায়গা হিসেবে দেখুন যেখানে **আপনার নিজের** সৃজনশীলতা মেলে ধরতে পারবেন, যেখানে জিনিস বানিয়ে আর ধাঁধা সমাধান করে **আনন্দ পাবেন**। কারণ কোডিং আসলে এটাই, সমস্যা সমাধান।

        [আপনি কোন প্রোগ্রামিং ভাষা শিখছেন](https://jiki.io/blog/just-learn-to-code) তাতে কিছু আসে যায় না, আসল কথা হলো **কোডিং কীভাবে কাজ করে** সেটা আপনি সত্যিই ভালোভাবে বুঝছেন কি না।

        এগিয়ে যেতে যেতে এমন সময়ও আসবে যখন কোডিং সত্যিই কঠিন আর বিরক্তিকর লাগবে। কিন্তু সেটা _কোডিং_ কঠিন বলে নয়, সেটা **শেখাটা কঠিন** বলে। যেকোনো কিছুতে ভালো হতে চাইলে এমন ধাপ পেরোতেই হয় যেখানে চ্যালেঞ্জটা সামর্থ্যের বাইরে মনে হয়, তবু লেগে থাকতে হয়।

        কোডিংয়ের অংশটুকু এত পরিশ্রমের যোগ্য কি না তা নিয়ে সংশয়ে থাকলে [এই ব্লগ পোস্টটি](https://jiki.io/blog/should-i-still-learn-to-code-in-2026) পড়ে দেখুন, এতে ব্যাখ্যা করা আছে কেন ২০২৬ সালেও আপনার কোড শেখা উচিত।

        পড়ার জন্য ধন্যবাদ!
        জেরেমি
    building:
      subject: "শেখার সেরা উপায় হলো কিছু বানানো!"
      preview: "আমি সত্যিই বিশ্বাস করি, টেক ইন্ডাস্ট্রিতে ঢোকার জন্য এখনই সবচেয়ে ভালো সময়।"
      greeting: "স্বাগতম!"
      body_markdown: |
        আমি সত্যিই বিশ্বাস করি, **টেক ইন্ডাস্ট্রিতে ঢোকার জন্য এখনই সবচেয়ে ভালো সময়**। মৌলিক বিষয়গুলো শেখা আর দ্রুত কিছু বানাতে পারা কখনোই এত সহজ ছিল না।

        কিন্তু (আর এই কিন্তুটা বেশ বড়!) অনেকেই যে ভুলটা করছেন তা হলো, তাঁরা পুরো লাগামটাই একটা AI এজেন্টের হাতে তুলে দিচ্ছেন, নিজে আসলে কিছু শিখছেন না। অল্প কিছুদিন এটা দারুণ লাগে, জাদুর মতো সব জিনিস চোখের সামনে তৈরি হয়ে যায়। কিন্তু আপনি যদি শুধু Claude বা ChatGPT-কে বলে দেন কী করতে হবে, তাহলে আসলে আপনি কিছুই শিখছেন না!

        তাই আমি **ধাপে ধাপে করা প্রজেক্ট** তৈরি করছি, যেগুলো নিয়ে আপনি কাজ করতে পারবেন, আর যেখানে আমি _চাই_ আপনি অনেকটা কাজ AI এজেন্টকে দিয়েই করান। তবে সেই সাথে আমি চাই, প্রতিটি ধাপে **কী ঘটছে সেটা আপনি সত্যিই বুঝে নিন**।

        এই প্রজেক্টগুলোর উদ্দেশ্য হলো **সফটওয়্যার বানানোর আলাদা আলাদা দিকগুলো** শিখে ফেলা। আমি যখন কিছু বানাব, আপনি আমার সাথে যোগ দিতে পারবেন, আর আমি ঠিক কী করছি এবং কেন করছি তা বুঝিয়ে বলব। তারপর আপনি একটা AI এজেন্টের সাথে কাজ করে সেই একই ধারণাগুলো নিজের প্রজেক্টে কাজে লাগাতে পারবেন।

        শুধু খেয়াল রাখবেন, AI এজেন্ট আপনার কাজ করে দিচ্ছে, এই **ডোপামিনের নেশায় যেন আসক্ত হয়ে না পড়েন**। কী ঘটছে তা বোঝার জন্য সময় নিতে ভুলবেন না!

        আশা করি শিগগিরই [কোনো একটা লাইভস্ট্রিমে](https://youtube.com/@jiki-coding) আপনার সাথে দেখা হবে!

        পড়ার জন্য ধন্যবাদ!
        জেরেমি
    premium:
      subject: "জিকি থেকে আরও বেশি কিছু পান (আর আমাদেরও সাহায্য করুন)"
      preview: "জিকিকে আমরা ফ্রি রেখেছি, কারণ আমরা চাই এটা সবার সাধ্যের মধ্যে থাকুক"
      greeting: "স্বাগতম!"
      body_markdown: |
        জিকিকে আমরা ফ্রি রেখেছি, কারণ আর্থিক অবস্থা যেমনই হোক, আমরা চাই এটা **সবার সাধ্যের মধ্যে** থাকুক। শত শত ঘণ্টার অনুশীলনী আর ভিডিও সবাই পান, বিনিময়ে কিছুই চাওয়া হয় না।

        কিন্তু **জিকি চালাতে টাকা লাগে**, আর আমাদেরও ঘরভাড়া দিতে হয়, খাবার (🍜) আর ক্যাফেইনের (☕) খরচ চালাতে হয়। তাই আমরা একটা প্রিমিয়াম টিয়ার যোগ করেছি, যেখানে কিছু বাড়তি সুবিধা আছে যেগুলো আমার বিশ্বাস আপনাকে সত্যিই সাহায্য করবে:
        - **জিকিকে জিজ্ঞাসা করুন**: আমাদের AI চ্যাট, যা আটকে গেলে আপনাকে দ্রুত বের করে আনবে বা আপনার প্রশ্নগুলো খুঁটিয়ে দেখতে সাহায্য করবে।
        - **প্রিমিয়াম প্রজেক্ট**: আরও কঠিন অনুশীলনী, যেখানে শিখতে থাকা দক্ষতাগুলো একসাথে কাজে লাগাতে পারবেন।
        - **Learn to Build**: আরও অনেক কন্টেন্ট, যেখানে আমার সাথে সাথে শিখতে পারবেন।
        - **ব্যাজ**: প্রিমিয়াম ব্যাজ দিয়ে সাইটে আর কমিউনিটির জায়গাগুলোতে আপনার সমর্থন তুলে ধরুন।

        **ক্রয়ক্ষমতার সমতার** ভিত্তিতে আমরা এর দাম খুবই সাশ্রয়ী রেখেছি। অর্থাৎ আপনার দেশে দোকান থেকে কেনা দুটো পানীয়ের যা দাম, প্রিমিয়ামের খরচও মোটামুটি ততটুকুই। ফলে পৃথিবীর যেখানেই থাকুন, দামটা যুক্তিসঙ্গত মনে হওয়ার কথা।

        জিকি যদি আপনার ভালো লাগে, আপনি যদি **আপনার শেখার গতি বাড়াতে** চান, আর আমাকে ও জিকি টিমকে সমর্থন করতে চান, তাহলে অনুগ্রহ করে [প্রিমিয়ামে আপগ্রেড করুন](https://jiki.io/premium)।

        ধন্যবাদ,
        জেরেমি
    community:
      subject: "একা লড়বেন না, জিকির কমিউনিটিতে যোগ দিন"
      preview: "কোনো কিছু শেখার সময় দলে থাকলে সফল হওয়ার সম্ভাবনা অনেক বেড়ে যায়।"
      greeting: "স্বাগতম!"
      body_markdown: |
        কোনো কিছু শেখার সময় **আপনি যদি একটা দলের অংশ হন**, সফল হওয়ার সম্ভাবনা অনেক বেড়ে যায়। কোডিংও এর ব্যতিক্রম নয়।

        সাহায্য পেতে চাইলে, নিজের কোডিং যাত্রা নিয়ে গল্প করতে চাইলে, কিংবা শুধু অন্যদের সাথে সময় কাটাতে চাইলে কয়েকটা জায়গা আছে:
        - [আমাদের ফোরাম](https://jiki.io/r/forum): ধীরেসুস্থে, বিস্তারিত আলোচনার জায়গা। এখানে **আরও গভীরে যান**।
        - [Exercism-এর Discord](https://jiki.io/r/discord): যাঁরা অনলাইনে আছেন তাঁদের সাথে **রিয়েল-টাইম চ্যাটের** জায়গা। #jiki-chat আর #jiki-get-help চ্যানেল দুটি খুঁজে নিন।
        - [YouTube](https://jiki.io/r/youtube): আমাদের AMA (Ask Me Anything, অর্থাৎ যা খুশি জিজ্ঞাসা করার আসর) আর অন্যান্য **লাইভস্ট্রিমে** যোগ দিয়ে আমাকে আপনার প্রশ্নগুলো করুন!

        মনে রাখবেন, এই জায়গাগুলোতে নানা সংস্কৃতির মানুষ আছেন, তাই চ্যাট করার সময় **সবার প্রতি শ্রদ্ধাশীল থাকুন**।

        সেখানে দেখা হবে!
        জেরেমি
