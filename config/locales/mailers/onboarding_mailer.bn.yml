  onboarding_mailer:
    overview:
      subject: "কারাতে কিড দেখেছেন কখনও?"
      preview: "আমাকে সবচেয়ে বেশি যে প্রশ্নটি করা হয়, তা হলো জিকি আসলে কার জন্য।"
      greeting: "স্বাগতম!"
      body_markdown: |
        **"Wax on, wax off"** বাক্যটি কঠিন কিছু শেখার সমার্থক হয়ে উঠেছে। এটি এসেছে _দ্য কারাতে কিড_ থেকে, যেখানে ড্যানিয়েল (আমাদের কারাতে কিড) একজন শিক্ষককে (মিস্টার মিয়াগি) তাঁকে কারাতে শেখাতে বলে। মিস্টার মিয়াগি তাঁকে কিক আর পাঞ্চ শেখানোর বদলে ঘরের কাজ করান, যার মধ্যে সবচেয়ে বিখ্যাত হলো গাড়িতে ওয়াক্স করা। এখানে জোরটা হলো প্রতিটি নড়াচড়া নিখুঁতভাবে করা, আর দেখা যায় (স্পয়লার) যে এই অনুশাসন এমন দক্ষতা গড়ে তোলে যা কারাতেতে কাজে লাগে, এবং শরীরকে বারবার অভ্যাস করানোর প্রক্রিয়াই আপনাকে দক্ষ করে তোলে।

        প্রোগ্রামিংও কিছুটা একই রকম, তবে শরীরের জন্য নয়, মনের জন্য। আমরা সবাই প্রথম দিন থেকেই মজার কিছু বানাতে চাই, কিন্তু সবকিছুর আগে আমাদের দরকার সত্যিই মজবুত ভিত্তি। আমাদের **মস্তিষ্ককে** সঠিকভাবে প্রশিক্ষণ দিতে হবে এবং চিন্তার সঠিক পদ্ধতি গড়ে তুলতে হবে।

        - **আপনি যদি প্রোগ্রামিংয়ে নতুন হন**, জিকি আপনাকে এই মানসিক ব্যায়ামগুলোর মধ্য দিয়ে নিয়ে যাবে (আশা করি গাড়িতে ওয়াক্স করার চেয়ে বেশি মজার উপায়ে!) এবং আপনার জানার সবকিছু শেখাবে।
        - **আপনি যদি কিছুদিন ধরে প্রোগ্রামিং করে থাকেন**, তাহলে মনে হতে পারে আপনি একই বেসিকগুলোতেই ঘুরপাক খাচ্ছেন, এগোচ্ছেন না। কিন্তু ড্যানিয়েলের গাড়িতে ওয়াক্স করার মতোই, শুরুর এই ধাপগুলো ঠিকভাবে করার মধ্যে বিশাল মূল্য আছে। জিকির সাথে থাকুন, আমরা আপনাকে **গভীর প্রোগ্রামিং মানসিকতা আর মজবুত মৌলিক দক্ষতা** গড়ে তুলতে সাহায্য করব।

        আপনাকে আমাদের সাথে পেয়ে খুব ভালো লাগছে! কোনো প্রশ্ন থাকলে এই ইমেইলের উত্তর দিন। আমি একজন মানুষ, সাহায্য করতে খুশি 🙂

        পড়ার জন্য ধন্যবাদ!
        জেরেমি
    coding:
      subject: "কোন প্রোগ্রামিং ভাষা শেখা উচিত?"
      preview: "কোড শেখাকে অনেকেই কারিগরি আর কঠিন বলে মনে করেন।"
      greeting: "আবারও স্বাগতম!"
      body_markdown: |
        কোড শেখাকে অনেকেই কারিগরি আর কঠিন বলে মনে করেন। আমি যখন কোড শেখা শুরু করি, তখন আমি আট বছরের এক বাচ্চা, প্রোগ্রামিং সম্পর্কে কিছুই জানতাম না, শুধু জানতাম **আমি হঠাৎ করে দুর্দান্ত জিনিস বানাতে পারি**। এটা যে কঠিন হওয়ার কথা, তা আমি জানতাম না। শুধু বুঝেছিলাম, হঠাৎ আমার সৃজনশীলতার জন্য নতুন একটা পথ খুলে গেছে।

        বেশিরভাগ শিক্ষানবিশ অনেক সময় নষ্ট করেন কোন প্রোগ্রামিং ভাষা শিখবেন তা ঠিক করতে। [এটা আসলে কোনো ব্যাপারই না](https://jiki.io/blog/just-learn-to-code)। আসল কথা হলো **প্রোগ্রামিং কীভাবে কাজ করে** তা আপনি যেন সত্যিই ভালোভাবে বুঝতে পারেন, আর জিকি ঠিক সেটাই শেখায়।

        আপনি যত এগোবেন, এমন সময় আসবে যখন প্রোগ্রামিং সত্যিই কঠিন আর হতাশাজনক মনে হবে। কিন্তু এর কারণ _প্রোগ্রামিং_ কঠিন নয়, কারণ **শেখাটাই কঠিন**। যে কোনো কিছুতে ভালো হতে চাইলে এমন পর্বের মধ্য দিয়ে যেতে হয় যখন চ্যালেঞ্জটা বেশি মনে হয়, কিন্তু আপনাকে লেগে থাকতে হবে।

        জিকি আপনাকে এমন জায়গায় নিয়ে আসবে যেখানে আপনি কোড বুঝবেন, এরপর আমাদের সহোদর ওয়েবসাইট Exercism ব্যবহার করে **৮৫টি ভিন্ন প্রোগ্রামিং ভাষার** যেকোনোটি শিখতে পারবেন!

        আপনি পারবেন!
        জেরেমি
    premium:
      subject: "জিকি থেকে আরও পান (আর আমাদের সাহায্য করুন)"
      preview: "জিকি বিনামূল্যে, কারণ আমরা চাই এটি সবার জন্য সহজলভ্য হোক।"
      greeting: "স্বাগতম!"
      body_markdown: |
        জিকি আমরা বিনামূল্যে রেখেছি কারণ আমরা চাই আর্থিক অবস্থা যেমনই হোক, এটি **সবার জন্য সহজলভ্য** হোক। সবাই শত শত ঘণ্টার অনুশীলনী আর ভিডিও পায়, বিনিময়ে কিছু না চেয়েই।

        কিন্তু **জিকি চালাতে খরচ হয়**, আর আমাদের ঘরভাড়া দিতে, খাবার (🍜) আর ক্যাফেইন (☕) জোগাড় করতে হয়, তাই আমরা একটি Premium পরিকল্পনা যোগ করেছি, যেখানে কিছু বাড়তি সুবিধা আছে যা আমার মনে হয় আপনাকে সত্যিই সাহায্য করবে:
        - **কখনও আটকে যাবেন না**, সীমাহীন Ask Jiki সহায়তা নিয়ে।
        - **নিজেকে আরও এগিয়ে নিন** Premium চ্যালেঞ্জের সাথে।
        - **কমিউনিটির অংশ হোন** নিয়মিত লাইভস্ট্রিমের মাধ্যমে।
        - **আরও গভীরে যান** আমাদের পূর্ণ ওয়াকথ্রু ক্যাটালগ নিয়ে।
        - **নিজের দক্ষতা দেখান** অফিসিয়াল সার্টিফিকেটের মাধ্যমে।
        - **মনোযোগ ধরে রাখুন** বিজ্ঞাপনমুক্ত শেখার অভিজ্ঞতা নিয়ে।
        - **আগে পেয়ে যান** নতুন ফিচারগুলো।
        - **আপনার সমর্থন দেখান** সাইটে ও কমিউনিটি জায়গায় Premium ব্যাজ নিয়ে।

        **Purchasing Power Parity** ব্যবহার করে আমরা এটাকে খুব সাশ্রয়ী করেছি। এর মানে হলো, আপনার দেশে বাইরে থেকে আনা দুটি পানীয়ের দামেই Premium পাওয়া যাবে, তাই বিশ্বের যেখানেই থাকুন, দামটা যুক্তিসঙ্গতই মনে হবে।

        আপনি যদি জিকি উপভোগ করছেন, **শেখার গতি বাড়াতে** চান, আর আমাকে ও জিকি টিমকে সমর্থন করতে চান, তাহলে [Premium-এ আপগ্রেড করুন](https://jiki.io/premium)।

        ধন্যবাদ,
        জেরেমি
    community:
      subject: "একা লড়বেন না, জিকির কমিউনিটিতে যোগ দিন"
      preview: "কোনো কিছু শেখার সময় দলে থাকলে সফল হওয়ার সম্ভাবনা অনেক বেড়ে যায়।"
      greeting: "স্বাগতম!"
      body_markdown: |
        কোনো কিছু শেখার সময় **আপনি যদি একটা দলের অংশ হন**, সফল হওয়ার সম্ভাবনা অনেক বেড়ে যায়। কোডিংও এর ব্যতিক্রম নয়।

        সাহায্য পেতে চাইলে, নিজের কোডিং যাত্রা নিয়ে গল্প করতে চাইলে, কিংবা শুধু অন্যদের সাথে সময় কাটাতে চাইলে কয়েকটা জায়গা আছে:
        - [আমাদের ফোরাম](https://jiki.io/r/forum): ধীরেসুস্থে, বিস্তারিত আলোচনার জায়গা। এখানে **আরও গভীরে যান**।
        - [Exercism-এর Discord](https://jiki.io/r/discord): যাঁরা অনলাইনে আছেন তাঁদের সাথে **রিয়েল-টাইম চ্যাটের** জায়গা। #jiki-chat আর #jiki-get-help চ্যানেল দুটি খুঁজে নিন।
        - [YouTube](https://jiki.io/r/youtube): আমাদের AMA (Ask Me Anything, অর্থাৎ যা খুশি জিজ্ঞাসা করার আসর) আর অন্যান্য **লাইভস্ট্রিমে** যোগ দিয়ে আমাকে আপনার প্রশ্নগুলো করুন!

        মনে রাখবেন, এই জায়গাগুলোতে নানা সংস্কৃতির মানুষ আছেন, তাই চ্যাট করার সময় **সবার প্রতি শ্রদ্ধাশীল থাকুন**।

        সেখানে দেখা হবে!
        জেরেমি
