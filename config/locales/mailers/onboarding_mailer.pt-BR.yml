"pt-BR":
  onboarding_mailer:
    overview:
      subject: "As duas metades de se tornar desenvolvedor em 2026"
      preview: "Nos últimos anos, venho aprendendo japonês aos poucos."
      greeting: "Olá,"
      body_markdown: |
        Nos últimos anos, venho **aprendendo japonês aos poucos**. Visito o Japão com frequência e tento mergulhar no idioma, mas é difícil, porque hoje em dia, com a ajuda do Google Tradutor, dá pra passar um tempo no Japão sem falar uma palavra de japonês. **Então meu cérebro pode ficar preguiçoso**, e mesmo assim eu me viro bem.

        A programação começou a seguir esse mesmo caminho. Nos últimos 30 anos, se você quisesse fazer qualquer coisa com tecnologia, **tinha que aprender a programar**. Era a única forma de se comunicar com um computador. Mas nos últimos dois anos, com a ascensão da programação com agentes, isso mudou. Agora você pode usar seu próprio idioma e dizer a um agente de IA o que quer que ele faça, e **ele escreve o código por você**, traduzindo suas instruções para o computador.

        Assim como eu não preciso esperar até ficar fluente em japonês para explorar o Japão, **não faz mais sentido passar anos ficando bom em programação** antes de começar a criar coisas.

        Mas se eu quiser entrar de verdade na cultura japonesa e fazer amigos japoneses, preciso aprender japonês. E, se você quiser entrar no mercado de tech, ainda precisa aprender a programar. O código não é mais o guardião da entrada, mas é **a diferença entre "se virar" e realmente prosperar**.

        Para ficar bom rápido, divida seu tempo de estudo em duas partes:
        1. **Aprenda a programar.** Faça o curso Fundamentos de Programação do Jiki e você vai ter uma base excelente.
        2. **Crie coisas.** Faça o "Aprenda a Construir", mergulhe nos detalhes e crie produtos que as pessoas possam usar de verdade!

        Se quiser saber mais sobre o que eu penso sobre **como entrar no mercado de tech em 2026**, leia [este post do blog](https://jiki.io/blog/how-to-get-into-tech-in-2026).

        Nos próximos dias, vou contar um pouco mais sobre os dois lados, o de programar e o de construir, e sobre como aproveitar ao máximo o [Jiki](https://jiki.io). Até lá, **mãos à obra e divirta-se!**

        Obrigado por ler!
        Jeremy
    coding:
      subject: "Construa fundamentos de programação sólidos"
      preview: "Aprender a programar tem fama de ser técnico e difícil."
      greeting: "Olá de novo,"
      body_markdown: |
        Aprender a programar tem fama de ser técnico e difícil. Quando comecei a aprender a programar, eu era um garoto de 8 anos que não sabia nada de programação, só que **de repente eu conseguia fazer coisas legais**. Eu não sabia que aquilo era pra ser difícil. Só sabia que, de repente, tinha uma nova forma de colocar minha criatividade pra fora.

        Enquanto você aprende a programar, **eu não quero que veja isso como uma disciplina técnica a ser dominada**. Quero que veja como um lugar onde você pode soltar a **sua** criatividade, onde dá pra **se divertir criando coisas** e resolvendo quebra-cabeças. Porque é isso que programar é de verdade: resolver problemas.

        Não importa [qual linguagem de programação você aprende](https://jiki.io/blog/just-learn-to-code), o que importa é você construir um entendimento muito bom de **como a programação funciona**.

        Conforme você avança, vai ter momentos em que programar parece difícil e frustrante. Mas isso não é porque _programar_ é difícil, é porque **aprender é difícil**. Para ficar bom em qualquer coisa, você precisa passar por fases em que o desafio parece grande demais, e é aí que precisa persistir.

        Se você está na dúvida se a parte de programar vale o esforço, dê uma lida [neste post do blog](https://jiki.io/blog/should-i-still-learn-to-code-in-2026), que explica por que ainda vale a pena aprender a programar em 2026.

        Obrigado por ler!
        Jeremy
    building:
      subject: "O melhor jeito de aprender é criar coisas!"
      preview: "Eu acredito mesmo que agora é o melhor momento possível para entrar no mercado de tech."
      greeting: "Olá,"
      body_markdown: |
        Eu acredito mesmo que **agora é o melhor momento possível para entrar no mercado de tech**. Nunca foi tão fácil aprender os fundamentos e conseguir criar coisas rapidamente.

        Mas (e esse "mas" é grande!) muita gente está errando ao entregar as rédeas totalmente a um agente de IA e não aprender nada de verdade. E isso é ótimo por um tempinho, dá pra fazer um monte de coisa aparecer como num passe de mágica, mas se tudo o que você faz é dizer ao Claude ou ao ChatGPT o que fazer, você não está aprendendo nada!

        Por isso estou montando **projetos passo a passo** para você acompanhar, nos quais eu _QUERO_ que você use agentes de IA para fazer boa parte do trabalho por você. Mas quero que você garanta que **entende mesmo o que está acontecendo** em cada etapa.

        A ideia desses projetos é você aprender **todas as diferentes partes de construir software**. Você pode me acompanhar enquanto eu construo as coisas, e eu vou explicar exatamente o que estou fazendo e por quê. Depois você pode trabalhar com um agente de IA para aplicar essas mesmas ideias aos seus projetos.

        Só **não se vicie nos picos de dopamina** de deixar o agente de IA fazer o trabalho por você. Reserve um tempo para entender o que está acontecendo!

        Espero ver você [em uma transmissão ao vivo](https://youtube.com/@jiki-coding) em breve!

        Obrigado por ler!
        Jeremy
    premium:
      subject: "Aproveite mais o Jiki (e ajude a gente)"
      preview: "Deixamos o Jiki gratuito porque queremos que ele seja acessível a todo mundo, independentemente"
      greeting: "Olá,"
      body_markdown: |
        Deixamos o Jiki gratuito porque queremos que ele seja **acessível a todo mundo**, independentemente da situação financeira de cada um. Todo mundo tem centenas de horas de exercícios e vídeos, tudo disponível sem nada em troca.

        Mas **manter o Jiki custa dinheiro**, e a gente precisa pagar o aluguel e ter como comprar comida (🍜) e cafeína (☕). Por isso criamos um plano Premium com alguns benefícios extras que eu acho que vão te ajudar bastante:
        - **Ask Jiki**: Nosso chat de IA para você destravar rapidinho ou explorar suas dúvidas.
        - **Projetos Premium**: Exercícios mais difíceis, onde você combina as habilidades que está aprendendo.
        - **Aprenda a Construir**: Muito mais conteúdo para você aprender junto comigo.
        - **Emblemas**: Mostre seu apoio no site e nos espaços da comunidade com emblemas Premium.

        Deixamos tudo bem em conta usando a **Paridade do Poder de Compra**. Ou seja, o Premium custa mais ou menos o mesmo que duas bebidas de cafeteria no seu país, então o preço deve parecer justo em qualquer lugar do mundo.

        Se você está curtindo o Jiki, quer **acelerar seu aprendizado** e quer apoiar a mim e à equipe do Jiki, [assine o Premium](https://jiki.io/premium).

        Obrigado,
        Jeremy
    community:
      subject: "Ninguém precisa aprender sozinho: entre na comunidade do Jiki"
      preview: "Você tem muito mais chance de aprender qualquer coisa se fizer parte de um grupo."
      greeting: "Olá,"
      body_markdown: |
        Você tem muito mais chance de aprender qualquer coisa se **fizer parte de um grupo**. Com programação não é diferente.

        Se você quer pedir ajuda, conversar sobre sua jornada na programação ou só trocar ideia com outras pessoas, tem alguns lugares para isso:
        - [Nosso fórum](https://jiki.io/r/forum): O lugar para conversas mais longas e sem pressa. **Aprofunde-se** aqui.
        - [Discord do Exercism](https://jiki.io/r/discord): O lugar para **conversar em tempo real** com quem estiver online. Procure os canais #jiki-chat e #jiki-get-help.
        - [YouTube](https://jiki.io/r/youtube): Participe das nossas AMAs (sessões de "pergunte o que quiser") e de outras **transmissões ao vivo** para me fazer suas perguntas!

        Lembre-se de que há pessoas de muitas culturas diferentes nesses espaços, então **trate todo mundo com respeito** nas conversas.

        Nos vemos por lá!
        Jeremy
