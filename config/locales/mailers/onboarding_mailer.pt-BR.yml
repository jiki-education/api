pt-BR:
  onboarding_mailer:
    overview:
      subject: "Já assistiu Karate Kid?"
      preview: "Uma das perguntas que mais me fazem é: para quem é o Jiki?"
      greeting: "Olá,"
      body_markdown: |
        A frase **“Wax on, wax off”** virou sinônimo de aprender coisas difíceis. Ela vem de _Karate Kid_, em que Daniel (o nosso karate kid) pede a um professor (Mr. Miyagi) que o ensine caratê. Em vez de ensinar chutes e socos, Mr. Miyagi faz ele fazer tarefas domésticas, a mais famosa delas passar cera nos carros. O foco está em fazer os movimentos exatos corretamente, e acontece (spoiler) que essa disciplina constrói habilidades que se transferem para o caratê, e que o processo de treinar o corpo repetidamente é o que faz você ficar bom.

        A programação é um pouco parecida, mas para a mente, não para o corpo. Todos nós queremos conseguir criar coisas interessantes desde o primeiro dia, mas mais do que qualquer outra coisa precisamos construir fundamentos muito sólidos. Precisamos **treinar o nosso cérebro** do jeito certo e desenvolver as formas certas de pensar.

        - **Se você está começando na programação**, o Jiki vai levar você por esses exercícios mentais (espero que de um jeito bem mais interessante do que passar cera em carros!) e ensinar tudo o que você precisa saber.
        - **Se você já programa há um tempo**, pode sentir que está passando pelos mesmos fundamentos sem sair do lugar. Mas, assim como Daniel passando cera nos carros, tem um valor enorme em fazer essas etapas iniciais direito. Fique com o Jiki e vamos ajudar você a desenvolver **uma mentalidade de programação profunda e habilidades fundamentais sólidas**.

        Estou muito feliz por ter você com a gente! Se tiver alguma dúvida, é só responder este e-mail. Sou humano e fico feliz em ajudar 🙂

        Obrigado por ler!
        Jeremy
    coding:
      subject: "Que linguagem de programação eu devo aprender?"
      preview: "Aprender a programar tem fama de ser técnico e difícil."
      greeting: "Olá de novo,"
      body_markdown: |
        Aprender a programar tem fama de ser técnico e difícil. Quando comecei a aprender a programar, eu era um garoto de 8 anos que não sabia nada sobre programação, a não ser que **de repente eu conseguia fazer coisas legais**. Eu não sabia que aquilo era considerado difícil. Só sabia que de repente tinha uma nova forma de expressar a minha criatividade.

        A maioria dos iniciantes passa muito tempo tentando decidir qual linguagem de programação aprender. [Isso não importa](https://jiki.io/blog/just-learn-to-code). O que importa é que você construa uma compreensão muito boa de **como a programação funciona**, e é isso que o Jiki ensina.

        Conforme você avança, vão existir momentos em que programar vai realmente parecer difícil e frustrante. Mas isso não é porque _programar_ é difícil, e sim porque **aprender é difícil**. Se você quer ficar bom em qualquer coisa, precisa passar por fases em que o desafio parece grande demais, mas precisa perseverar.

        O Jiki vai levar você até um ponto em que você entende código, e depois você pode usar o nosso site irmão, o Exercism, para aprender qualquer uma das **85 linguagens de programação diferentes**!

        Você vai conseguir!
        Jeremy
    premium:
      subject: "Aproveite mais o Jiki (e nos ajude)"
      preview: "Deixamos o Jiki gratuito porque queremos que ele seja acessível a todos."
      greeting: "Olá,"
      body_markdown: |
        Deixamos o Jiki gratuito porque queremos que ele seja **acessível a todos**, independentemente da situação financeira de cada um. Todo mundo ganha centenas de horas de exercícios e vídeos, tudo disponível sem pedir nada em troca.

        Mas **o Jiki custa dinheiro para funcionar**, e precisamos conseguir pagar o aluguel, a comida (🍜) e a cafeína (☕), então criamos um plano Premium que traz alguns benefícios extras que, na minha opinião, vão ajudar muito você:
        - **Nunca fique travado** com o suporte ilimitado do Pergunte ao Jiki.
        - **Vá mais longe** com os desafios Premium.
        - **Faça parte da comunidade** com transmissões ao vivo regulares.
        - **Aprofunde-se** com o nosso catálogo completo de passo a passo.
        - **Mostre as suas habilidades** com um certificado oficial.
        - **Mantenha o foco** com uma experiência de aprendizado sem anúncios.
        - **Tenha acesso antecipado** a novos recursos.
        - **Mostre o seu apoio** com selos Premium no site e nos espaços da comunidade.

        Deixamos tudo super acessível usando a **Paridade de Poder de Compra**. Isso significa que o Premium custa mais ou menos o mesmo que duas bebidas para viagem no seu país, então deve parecer um preço justo onde quer que você esteja no mundo.

        Se você está gostando do Jiki, quer **acelerar o seu aprendizado** e quer apoiar a mim e à equipe do Jiki, então [assine o Premium](https://jiki.io/premium).

        Obrigado,
        Jeremy
    community:
      subject: "Ninguém precisa aprender sozinho: entre na comunidade do Jiki"
      preview: "Você tem muito mais chance de aprender qualquer coisa se fizer parte de um grupo."
      greeting: "Olá,"
      body_markdown: |
        Você tem muito mais chance de aprender qualquer coisa se **fizer parte de um grupo**. Com programação não é diferente.

        Se você quer pedir ajuda, conversar sobre sua jornada na programação ou só trocar ideia com outras pessoas, tem alguns lugares para isso:
        - [Nosso fórum](https://jiki.io/r/forum): O lugar para conversas mais longas e sem pressa. **Aprofunde-se** aqui.
        - [Discord do Exercism](https://jiki.io/r/discord): O lugar para **conversar em tempo real** com quem estiver online. Procure os canais #jiki-chat e #jiki-get-help.
        - [YouTube](https://jiki.io/r/youtube): Participe das nossas AMAs (sessões de "pergunte o que quiser") e de outras **transmissões ao vivo** para me fazer suas perguntas!

        Lembre-se de que há pessoas de muitas culturas diferentes nesses espaços, então **trate todo mundo com respeito** nas conversas.

        Nos vemos por lá!
        Jeremy
