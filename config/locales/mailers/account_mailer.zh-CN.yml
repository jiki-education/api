zh-CN:
  account_mailer:
    welcome:
      subject: "欢迎来到 Jiki！"
      greeting: "你好，"
      body_markdown: |
        欢迎来到 [Jiki](https://jiki.io)！很高兴你能加入我们。

        Jiki 的设计目标，就是带你从零基础成长为自信的编程者。你会做有趣的项目，解决有意思的问题，一步一步地向前走，在这段旅程中收获满满。

        如果遇到卡住的地方，或者有任何疑问，随时联系我们。刚开始学编程可能会觉得有点吃力，但你一定可以的！

        玩得开心，享受这段旅程！

        祝好，  
        Jeremy 和团队
    account_deletion_confirmation:
      subject: "确认删除你的账户"
      preview: "请确认你想永久删除自己的 Jiki 账户"
      greeting: "你好，"
      body_markdown: |
        我们收到了删除你的 Jiki 账户的请求。

        如果这确实是你发起的，请点击下面的按钮确认。此操作是永久性的，无法撤销。你的所有学习进度和数据都会被删除。

        如果这不是你发起的，你可以放心忽略这封邮件，你的账户不会有任何变化。
      cta: "删除我的账户"
