el:
  account_mailer:
    welcome:
      subject: "Καλώς ήρθες στο Jiki!"
      greeting: "Γεια σου,"
      body_markdown: |
        Καλώς ήρθες στο [Jiki](https://jiki.io)! Χαιρόμαστε πραγματικά που είσαι εδώ.

        Το Jiki έχει σχεδιαστεί για να σε πάει από εντελώς αρχάριο σε προγραμματιστή με αυτοπεποίθηση. Θα δουλεύεις πάνω σε διασκεδαστικά πρότζεκτ και θα λύνεις ενδιαφέροντα προβλήματα, κάνοντας πρόοδο ένα μικρό βήμα τη φορά και μαθαίνοντας πάρα πολλά στη διαδρομή.

        Αν κολλήσεις ποτέ ή έχεις απορίες, μη διστάσεις να μας γράψεις. Το να μάθεις προγραμματισμό μπορεί να φαίνεται βουνό στην αρχή, αλλά θα τα καταφέρεις!

        Καλή διασκέδαση και απόλαυσε τη διαδρομή!

        Χαιρετισμούς,  
        Jeremy & η ομάδα
    account_deletion_confirmation:
      subject: "Επιβεβαίωσε τη διαγραφή του λογαριασμού σου"
      preview: "Επιβεβαίωσε ότι θέλεις να διαγράψεις μόνιμα τον λογαριασμό σου στο Jiki"
      greeting: "Γεια σου,"
      body_markdown: |
        Λάβαμε ένα αίτημα για διαγραφή του λογαριασμού σου στο Jiki.

        Αν έκανες εσύ αυτό το αίτημα, κάνε κλικ στο παρακάτω κουμπί για να το επιβεβαιώσεις. Αυτή η ενέργεια είναι μόνιμη και δε μπορεί να αναιρεθεί. Όλη η πρόοδος και τα δεδομένα σου θα διαγραφούν.

        Αν δεν έκανες εσύ αυτό το αίτημα, μπορείς να αγνοήσεις με ασφάλεια αυτό το email και ο λογαριασμός σου θα παραμείνει αμετάβλητος.
      cta: "Διέγραψε τον λογαριασμό μου"
