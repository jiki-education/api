sr:
  account_mailer:
    welcome:
      subject: "Dobrodošlica u Jiki!"
      greeting: "Zdravo,"
      body_markdown: |
        Želimo ti dobrodošlicu u [Jiki](https://jiki.io)! Baš nam je drago što si tu.

        Jiki je osmišljen tako da te od potpunog početnika odvede do samouverenog programera. Radićeš na zabavnim projektima i rešavati zanimljive probleme, napredovati korak po korak i usput naučiti gomilu stvari.

        Ako negde zapneš ili imaš pitanja, slobodno nam se obrati. Učenje programiranja ume na početku da deluje kao prevelik zalogaj, ali možeš ti to!

        Zabavi se i uživaj na putu!

        Pozdrav,  
        Džeremi i tim
    account_deletion_confirmation:
      subject: "Potvrdi brisanje naloga"
      preview: "Potvrdi da želiš trajno da obrišeš svoj Jiki nalog"
      greeting: "Zdravo,"
      body_markdown: |
        Stigao nam je zahtev za brisanje tvog Jiki naloga.

        Ako je ovaj zahtev zaista tvoj, klikni na dugme ispod da ga potvrdiš. Ova radnja je trajna i ne može se poništiti. Sav tvoj napredak i svi podaci biće obrisani.

        Ako ovaj zahtev nije tvoj, slobodno ignoriši ovaj mejl i tvoj nalog će ostati nepromenjen.
      cta: "Obriši moj nalog"
