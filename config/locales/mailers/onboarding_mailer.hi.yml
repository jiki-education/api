hi:
  onboarding_mailer:
    overview:
      subject: "2026 में डेवलपर बनने के दो हिस्से"
      preview: "पिछले कुछ सालों से मैं धीरे-धीरे जापानी सीख रहा हूँ।"
      greeting: "नमस्ते,"
      body_markdown: |
        पिछले कुछ सालों से मैं **धीरे-धीरे जापानी सीख रहा हूँ**। मैं नियमित रूप से जापान जाता हूँ और भाषा में डूबने की कोशिश करता हूँ, लेकिन यह मुश्किल है। आजकल Google Translate की मदद से जापान में समय बिताना और जापानी का एक शब्द भी न बोलना काफी आसान है। **तो मेरा दिमाग आलसी हो सकता है**, लेकिन मेरा काम चल जाता है।

        कोडिंग ने भी हाल ही में यही सफर शुरू किया है। पिछले 30 सालों में अगर आपको टेक्नोलॉजी से कुछ भी करना था, तो **आपको कोड करना सीखना पड़ता था**। कंप्यूटर से बात करने का यही एकमात्र तरीका था। लेकिन पिछले दो सालों में एजेंटिक कोडिंग के आने से यह बदल गया है। अब आप अपनी भाषा में किसी AI एजेंट को बता सकते हैं कि आप क्या करवाना चाहते हैं, और **वह आपके लिए कोड लिख देता है**, यानी आपके निर्देशों को कंप्यूटर की भाषा में बदल देता है।

        जैसे जापान घूमने के लिए मुझे जापानी में धाराप्रवाह होने का इंतज़ार नहीं करना पड़ता, वैसे ही चीज़ें बनाना शुरू करने से पहले **कोडिंग में महारत हासिल करने में सालों लगाना अब बिल्कुल समझदारी नहीं है**।

        लेकिन अगर मुझे जापानी संस्कृति में सच में उतरना है और जापानी दोस्त बनाने हैं, तो मुझे जापानी सीखनी ही होगी। और अगर आपको टेक्नोलॉजी में उतरना है, तो आपको आज भी कोड करना सीखना पड़ेगा। कोड अब अंदर आने की शर्त नहीं है, लेकिन यह **“काम चला लेने” और सच में आगे बढ़ने के बीच का फर्क** है।

        जल्दी अच्छा बनने के लिए अपने सीखने का समय दो हिस्सों में बाँटिए:
        1. **कोड करना सीखिए।** Jiki का कोडिंग फंडामेंटल्स कोर्स पूरा कीजिए, और आपकी बुनियाद मज़बूत बन जाएगी।
        2. **चीज़ें बनाइए।** “बनाना सीखिए” कोर्स कीजिए, गहराई में उतरिए और ऐसे प्रोडक्ट बनाइए जिन्हें लोग सच में इस्तेमाल कर सकें!

        अगर आप **2026 में टेक्नोलॉजी में कैसे उतरें** पर मेरे विचारों के बारे में और जानना चाहते हैं, तो [यह ब्लॉग पोस्ट](https://jiki.io/blog/how-to-get-into-tech-in-2026) पढ़िए।

        अगले कुछ दिनों में मैं आपको कोडिंग और चीज़ें बनाने, दोनों पक्षों के बारे में थोड़ा और बताऊँगा, और यह भी कि [Jiki](https://jiki.io) का भरपूर फायदा कैसे उठाया जाए। तब तक **काम में जुट जाइए और मज़े कीजिए!**

        पढ़ने के लिए धन्यवाद!
        Jeremy
    coding:
      subject: "कोडिंग की मज़बूत बुनियाद बनाइए"
      preview: "कोड सीखने को तकनीकी और मुश्किल माना जाता है।"
      greeting: "फिर से नमस्ते,"
      body_markdown: |
        कोड सीखने को तकनीकी और मुश्किल माना जाता है। जब मैं कोड सीखना शुरू कर रहा था, तब मैं आठ साल का एक बच्चा था और प्रोग्रामिंग के बारे में कुछ नहीं जानता था। बस इतना पता था कि **मैं अचानक मज़ेदार चीज़ें बना सकता हूँ**। मुझे नहीं पता था कि इसे मुश्किल माना जाता है। मुझे बस यह पता था कि मेरी रचनात्मकता के लिए अचानक एक नया रास्ता खुल गया है।

        जैसे-जैसे आप कोड सीखेंगे, **मैं नहीं चाहता कि आप इसे कोई तकनीकी विषय समझें जिसमें महारत हासिल करनी है**। मैं चाहता हूँ कि आप इसे ऐसी जगह की तरह देखें जहाँ आप अपनी रचनात्मकता को खुली छूट दे सकते हैं, जहाँ आप **चीज़ें बनाने और पहेलियाँ सुलझाने में मज़े कर सकते हैं**। क्योंकि कोडिंग वास्तव में यही है, समस्याएँ हल करना।

        इससे कोई फर्क नहीं पड़ता कि [आप कौन सी प्रोग्रामिंग भाषा सीखते हैं](https://jiki.io/blog/just-learn-to-code)। फर्क इस बात से पड़ता है कि **कोडिंग कैसे काम करती है**, इसकी आपमें अच्छी समझ बने।

        जैसे-जैसे आप आगे बढ़ेंगे, कुछ समय ऐसा भी आएगा जब कोडिंग मुश्किल और निराशाजनक लगेगी। लेकिन ऐसा इसलिए नहीं है कि _कोडिंग_ मुश्किल है, ऐसा इसलिए है कि **सीखना मुश्किल है**। अगर आप किसी भी चीज़ में अच्छे बनना चाहते हैं, तो ऐसे दौर से गुज़रना पड़ता है जब चुनौती बहुत बड़ी लगती है, लेकिन आपको डटे रहना होता है।

        अगर आपको यकीन नहीं है कि कोडिंग वाला हिस्सा इतनी मेहनत के लायक है या नहीं, तो [यह ब्लॉग पोस्ट](https://jiki.io/blog/should-i-still-learn-to-code-in-2026) पढ़िए, जिसमें बताया गया है कि 2026 में भी आपको कोड करना क्यों सीखना चाहिए।

        पढ़ने के लिए धन्यवाद!
        Jeremy
    building:
      subject: "सीखने का सबसे अच्छा तरीका है चीज़ें बनाना!"
      preview: "मेरा मानना है कि टेक्नोलॉजी में उतरने का सबसे अच्छा समय अभी है।"
      greeting: "नमस्ते,"
      body_markdown: |
        मेरा सच में मानना है कि **टेक्नोलॉजी में उतरने का इससे अच्छा समय कभी नहीं रहा**। बुनियादी बातें सीखने और जल्दी से चीज़ें बनाने लायक बन जाने का इससे आसान समय पहले कभी नहीं था।

        लेकिन (और यह “लेकिन” बड़ा है!) बहुत से लोग यह गलती कर रहे हैं कि वे पूरी कमान AI एजेंट को सौंप देते हैं और खुद कुछ सीखते ही नहीं। थोड़ी देर के लिए यह बहुत अच्छा लगता है, जैसे जादू से सारी चीज़ें बन जाती हैं। लेकिन अगर आप बस Claude या ChatGPT को बता रहे हैं कि क्या करना है, तो आप वास्तव में कुछ सीख नहीं रहे!

        इसलिए मैं **कदम-दर-कदम प्रोजेक्ट** बना रहा हूँ, जिन पर आप काम कर सकते हैं। इनमें मैं _चाहता हूँ_ कि आप बहुत सारा काम AI एजेंट से करवाएँ। लेकिन मैं यह भी चाहता हूँ कि हर चरण पर **आपको सच में समझ आए कि क्या हो रहा है**।

        इन प्रोजेक्टों का उद्देश्य यह है कि आप **सॉफ्टवेयर बनाने के सभी अलग-अलग हिस्से** सीख सकें। जब मैं चीज़ें बनाता हूँ तो आप मेरे साथ जुड़ सकते हैं, और मैं ठीक-ठीक बताऊँगा कि मैं क्या कर रहा हूँ और क्यों। फिर आप AI एजेंट के साथ मिलकर वही विचार अपने प्रोजेक्टों पर लागू कर सकते हैं।

        बस **AI एजेंट के आपका काम कर देने से मिलने वाले डोपामिन के झटकों की लत न लगाइए**। समय निकालकर यह समझिए कि सच में क्या हो रहा है!

        उम्मीद है कि जल्द ही [लाइवस्ट्रीम पर](https://youtube.com/@jiki-coding) आपसे मुलाकात होगी!

        पढ़ने के लिए धन्यवाद!
        Jeremy
    premium:
      subject: "Jiki से और ज़्यादा पाइए (और हमारी मदद कीजिए)"
      preview: "हमने Jiki मुफ्त रखा है, ताकि यह हर किसी के लिए उपलब्ध हो।"
      greeting: "नमस्ते,"
      body_markdown: |
        हमने Jiki को मुफ्त बनाया है क्योंकि हम चाहते हैं कि यह **हर किसी के लिए उपलब्ध हो**, चाहे उसकी आर्थिक स्थिति कैसी भी हो। सबको सैकड़ों घंटों के अभ्यास और वीडियो मिलते हैं, और बदले में कुछ भी नहीं माँगा जाता।

        लेकिन **Jiki को चलाने में खर्च होता है**, और हमें अपना किराया देना होता है, खाना (🍜) और कैफीन (☕) भी चाहिए। इसलिए हमने एक प्रीमियम प्लान जोड़ा है, जिसमें कुछ अतिरिक्त फायदे हैं जो मेरे ख्याल से आपकी बहुत मदद करेंगे:
        - **Ask Jiki**: हमारा AI चैट, जिससे आप जल्दी से अटकाव से निकल सकें या अपने सवालों को समझ सकें।
        - **प्रीमियम प्रोजेक्ट**: और मुश्किल अभ्यास, जिनमें आप अपने सीखे हुए कौशल मिलाकर इस्तेमाल कर सकते हैं।
        - **बनाना सीखिए**: ढेर सारा और कंटेंट, जहाँ आप मेरे साथ-साथ सीख सकते हैं।
        - **बैज**: प्रीमियम बैज के साथ साइट पर और कम्युनिटी की जगहों पर अपना समर्थन दिखाइए।

        हमने **पर्चेज़िंग पावर पैरिटी** का इस्तेमाल करके इसे बहुत किफायती बनाया है। इसका मतलब है कि प्रीमियम की कीमत आपके देश में दो टेकअवे ड्रिंक्स के लगभग बराबर है, इसलिए दुनिया में कहीं भी आपको यह ठीक-ठाक कीमत लगेगी।

        अगर आपको Jiki पसंद आ रहा है, आप **अपनी सीखने की रफ्तार तेज़ करना** चाहते हैं, और मेरा और Jiki टीम का साथ देना चाहते हैं, तो [प्रीमियम में अपग्रेड कीजिए](https://jiki.io/premium)।

        धन्यवाद,
        Jeremy
    community:
      subject: "अकेले संघर्ष न कीजिए, Jiki की कम्युनिटी से जुड़िए"
      preview: "कुछ भी सीखने में सफल होने की संभावना बहुत बढ़ जाती है, जब आप समूह का हिस्सा होते हैं।"
      greeting: "नमस्ते,"
      body_markdown: |
        कुछ भी सीखते समय सफल होने की संभावना बहुत बढ़ जाती है, अगर **आप किसी समूह का हिस्सा हैं**। कोडिंग सीखने में भी यही बात लागू होती है।

        अगर आप मदद लेना चाहते हैं, अपने कोडिंग सफर के बारे में बात करना चाहते हैं, या बस दूसरों के साथ समय बिताना चाहते हैं, तो इसके लिए कुछ जगहें हैं:
        - [हमारा फोरम](https://jiki.io/r/forum): ठहरकर, लंबी बातचीत के लिए यही जगह। यहाँ **गहराई में जाइए**।
        - [Exercism का Discord](https://jiki.io/r/discord): ऑनलाइन मौजूद लोगों के साथ **तुरंत बातचीत** के लिए यही जगह। #jiki-chat और #jiki-get-help चैनल देखिए।
        - [YouTube](https://jiki.io/r/youtube): हमारे AMA (Ask Me Anything) और दूसरे **लाइवस्ट्रीम** में शामिल होइए, और मुझसे अपने सवाल पूछिए!

        याद रखिए कि इन जगहों पर कई अलग-अलग संस्कृतियों के लोग मौजूद हैं, इसलिए बातचीत करते समय **सबके साथ सम्मान से पेश आइए**।

        वहीं मिलते हैं!
        Jeremy
