hi:
  onboarding_mailer:
    overview:
      subject: "कभी The Karate Kid देखी है?"
      preview: "मुझसे सबसे ज़्यादा पूछा जाने वाला सवाल यही है कि Jiki किसके लिए है।"
      greeting: "नमस्ते,"
      body_markdown: |
        **"वैक्स ऑन, वैक्स ऑफ"** वाला वाक्यांश मुश्किल चीज़ें सीखने का पर्याय बन गया है। यह वाक्यांश _The Karate Kid_ फिल्म से आया है, जिसमें डैनियल (यानी हमारा कराटे किड) अपने एक शिक्षक (मिस्टर मियागी) से कराटे सिखाने को कहता है। मिस्टर मियागी उसे किक और पंच मारना नहीं सिखाते, बल्कि घर के काम करवाते हैं, और सबसे मशहूर तो कारों पर वैक्स लगाना है। ध्यान इस बात पर है कि हर हरकत बिल्कुल सही हो। और (स्पॉइलर अलर्ट) अंत में पता चलता है कि इस अनुशासन से ऐसे हुनर बनते हैं जो कराटे में काम आते हैं, और यही बार-बार शरीर को प्रशिक्षित करने की प्रक्रिया है जो आपको अच्छा बनाती है।

        कोडिंग कुछ-कुछ वैसी ही है, पर शरीर के लिए नहीं, दिमाग के लिए। हम सब पहले ही दिन से मज़ेदार चीज़ें बनाना चाहते हैं, लेकिन सबसे ज़्यादा ज़रूरी यह है कि हमारी बुनियाद बहुत मज़बूत हो। हमें अपने **दिमाग को सही तरीके से प्रशिक्षित करना** है और सोचने के सही तरीके विकसित करने हैं।

        - **अगर आप कोडिंग में नए हैं**, तो Jiki आपको ये मानसिक अभ्यास कराएगा (उम्मीद है, कारों पर वैक्स लगाने से कहीं ज़्यादा मज़ेदार तरीके से!) और आपको वह सब सिखाएगा जो आपको जानना ज़रूरी है।
        - **अगर आप कुछ समय से कोडिंग कर रहे हैं**, तो लग सकता है कि आप वही बुनियादी बातें दोहरा रहे हैं और आगे नहीं बढ़ रहे। लेकिन कारों पर वैक्स लगाने वाले डैनियल की तरह, इन शुरुआती चरणों को ठीक से करने में बहुत बड़ा फायदा है। Jiki के साथ बने रहिए और हम आपको **गहरी कोडिंग सोच और मज़बूत बुनियादी हुनर** बनाने में मदद करेंगे।

        आपका स्वागत है, यह सोचकर मुझे बहुत खुशी हो रही है! कोई भी सवाल हो तो इस ईमेल का जवाब दीजिए। मैं एक इंसान हूँ और मदद करके खुश होता हूँ 🙂

        पढ़ने के लिए धन्यवाद!
        Jeremy
    coding:
      subject: "मुझे कौन-सी प्रोग्रामिंग भाषा सीखनी चाहिए?"
      preview: "कोडिंग सीखना तकनीकी और मुश्किल माना जाता है।"
      greeting: "फिर से नमस्ते,"
      body_markdown: |
        कोडिंग सीखना तकनीकी और मुश्किल माना जाता है। जब मैंने कोडिंग सीखनी शुरू की, तब मैं 8 साल का बच्चा था और प्रोग्रामिंग के बारे में सिर्फ इतना जानता था कि **अब मैं अचानक मज़ेदार चीज़ें बना सकता हूँ**। मुझे पता ही नहीं था कि यह मुश्किल माना जाता है। मुझे बस इतना पता था कि मेरी रचनात्मकता के लिए एक नया ज़रिया मिल गया है।

        ज़्यादातर शुरुआती लोग यह तय करने में बहुत समय लगाते हैं कि कौन-सी प्रोग्रामिंग भाषा सीखें। [इससे कोई फर्क नहीं पड़ता](https://jiki.io/blog/just-learn-to-code)। असली बात यह है कि आपको **कोडिंग कैसे काम करती है** इसकी अच्छी समझ बने, और Jiki यही सिखाता है।

        जैसे-जैसे आप आगे बढ़ेंगे, कुछ समय ऐसा भी आएगा जब कोडिंग मुश्किल और थका देने वाली लगेगी। लेकिन ऐसा इसलिए नहीं है कि _कोडिंग_ मुश्किल है, बल्कि इसलिए है कि **सीखना मुश्किल है**। किसी भी चीज़ में अच्छा होना है तो ऐसे दौर से गुज़रना ही पड़ता है जब चुनौती बहुत बड़ी लगती है, पर टिके रहना पड़ता है।

        Jiki आपको वहाँ तक पहुँचाएगा जहाँ आप कोड समझने लगेंगे। उसके बाद आप हमारी सहयोगी वेबसाइट Exercism पर **85 अलग-अलग प्रोग्रामिंग भाषाएँ** सीख सकते हैं!

        आप यह कर सकते हैं!
        Jeremy
    premium:
      subject: "Jiki से और ज़्यादा पाइए (और हमारी मदद कीजिए)"
      preview: "Jiki मुफ्त है, ताकि यह हर किसी के लिए उपलब्ध रहे।"
      greeting: "नमस्ते,"
      body_markdown: |
        हमने Jiki को मुफ्त रखा है क्योंकि हम चाहते हैं कि यह **हर किसी के लिए उपलब्ध** हो, चाहे उसकी आर्थिक स्थिति कुछ भी हो। सभी को सैकड़ों घंटे के अभ्यास और वीडियो मिलते हैं, और बदले में कुछ नहीं माँगा जाता।

        लेकिन **Jiki को चलाने में पैसा लगता है**, और हमें अपना किराया देना होता है, खाना (🍜) और कैफीन (☕) भी चाहिए। इसलिए हमने एक Premium प्लान जोड़ा है, जिसमें कुछ ऐसे फायदे हैं जो मेरे ख्याल से आपकी सच में मदद करेंगे:
        - **कभी अटकें नहीं**: Ask Jiki की असीमित सहायता के साथ।
        - **खुद को और आगे बढ़ाइए**: Premium चैलेंजों के साथ।
        - **समुदाय का हिस्सा बनिए**: नियमित लाइवस्ट्रीम के साथ।
        - **और गहराई तक जाइए**: हमारे पूरे वॉकथ्रू कैटलॉग के साथ।
        - **अपने हुनर दिखाइए**: आधिकारिक सर्टिफिकेट के साथ।
        - **ध्यान टिकाए रखिए**: विज्ञापन-मुक्त सीखने के अनुभव के साथ।
        - **नए फीचर सबसे पहले पाइए**: अर्ली एक्सेस के साथ।
        - **अपना सपोर्ट दिखाइए**: साइट और समुदाय के जगहों पर Premium बैज के साथ।

        हमने **क्रय शक्ति समता** का इस्तेमाल करके इसे बहुत किफायती बनाया है। इसका मतलब है कि Premium की कीमत आपके देश में दो टेकअवे ड्रिंक जितनी ही है। यानी दुनिया में कहीं भी रहिए, कीमत आपको वाजिब लगेगी।

        अगर आपको Jiki पसंद आ रहा है, आप **अपनी सीखने की रफ्तार तेज़ करना** चाहते हैं और मेरी तथा Jiki टीम की मदद करना चाहते हैं, तो [Premium में अपग्रेड कीजिए](https://jiki.io/premium)।

        धन्यवाद,
        Jeremy
    community:
      subject: "अकेले संघर्ष न कीजिए, Jiki की कम्युनिटी से जुड़िए"
      preview: "कुछ भी सीखने में सफल होने की संभावना बहुत बढ़ जाती है, जब आप समूह का हिस्सा होते हैं।"
      greeting: "नमस्ते,"
      body_markdown: |
        कुछ भी सीखते समय सफल होने की संभावना बहुत बढ़ जाती है, अगर **आप किसी समूह का हिस्सा हैं**। कोडिंग सीखने में भी यही बात लागू होती है।

        अगर आप मदद लेना चाहते हैं, अपने कोडिंग सफर के बारे में बात करना चाहते हैं, या बस दूसरों के साथ समय बिताना चाहते हैं, तो इसके लिए कुछ जगहें हैं:
        - [हमारा फोरम](https://jiki.io/r/forum): ठहरकर, लंबी बातचीत के लिए यही जगह। यहाँ **गहराई में जाइए**।
        - [Exercism का Discord](https://jiki.io/r/discord): ऑनलाइन मौजूद लोगों के साथ **तुरंत बातचीत** के लिए यही जगह। #jiki-chat और #jiki-get-help चैनल देखिए।
        - [YouTube](https://jiki.io/r/youtube): हमारे AMA (Ask Me Anything) और दूसरे **लाइवस्ट्रीम** में शामिल होइए, और मुझसे अपने सवाल पूछिए!

        याद रखिए कि इन जगहों पर कई अलग-अलग संस्कृतियों के लोग मौजूद हैं, इसलिए बातचीत करते समय **सबके साथ सम्मान से पेश आइए**।

        वहीं मिलते हैं!
        Jeremy
