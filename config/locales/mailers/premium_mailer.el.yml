el:
  premium_mailer:
    welcome_to_premium:
      subject: "Καλωσόρισες στο Jiki Premium!"
      greeting: "Γεια σου,"
      body_markdown: |
        Ευχαριστούμε που αναβαθμίστηκες στο Jiki Premium!

        Μπορείς να δεις όλες τις δυνατότητες στις οποίες έχεις πρόσβαση στη [σελίδα Premium](https://jiki.io/premium). Ελπίζουμε να περάσεις τέλεια χρησιμοποιώντας το Jiki και να σε δούμε σύντομα σε μια ζωντανή μετάδοση!

        Αν έχεις οποιαδήποτε ερώτηση, απλώς απάντησε σε αυτό το email.

        Φιλικά,  
        Jeremy & η ομάδα
    subscription_ended:
      subject: "Η συνδρομή σου στο Jiki έληξε"
      greeting: "Γεια σου,"
      body_markdown: |
        Η συνδρομή σου στο Jiki Premium έληξε και τώρα βρίσκεσαι στο δωρεάν πρόγραμμά μας.

        Έχεις ακόμη πλήρη πρόσβαση σε ολόκληρη την ενότητα «Μάθε να προγραμματίζεις». Αν θέλεις να εγγραφείς ξανά, μπορείς να το κάνεις οποτεδήποτε στη [σελίδα ρυθμίσεών σου](https://jiki.io/settings).

        Ευχαριστούμε που δοκίμασες το Jiki Premium.

        Φιλικά,  
        Jeremy & η ομάδα
    abandoned_checkout:
      subject: "Can I help with Jiki Premium?"
      greeting: "Hi there,"
      body_markdown: |
        I noticed that you started upgrading to Jiki Premium but didn't complete the payment. Is there anything you need help with?

        Thanks,  
        Jeremy
