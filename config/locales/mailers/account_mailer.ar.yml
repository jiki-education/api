  account_mailer:
    welcome:
      subject: "أهلًا بك في Jiki!"
      greeting: "مرحبًا،"
      body_markdown: |
        أهلًا بك في [Jiki](https://jiki.io)! يسعدنا حقًا وجودك معنا.

        لقد صُمّم Jiki ليأخذك من مبتدئ كامل إلى مبرمج واثق. ستعمل على مشاريع ممتعة، وتحل مشكلات مثيرة للاهتمام، وتتقدّم خطوة صغيرة في كل مرة، وتتعلّم الكثير خلال الرحلة.

        إذا واجهت أي صعوبة أو كان لديك سؤال، فلا تتردد في التواصل معنا. قد يبدو تعلّم البرمجة صعبًا في البداية، لكنك قادر على ذلك!

        نتمنى لك وقتًا ممتعًا، ورحلة سعيدة!

        تحياتنا،  
        Jeremy وفريقه
    account_deletion_confirmation:
      subject: "تأكيد حذف حسابك"
      preview: "يرجى تأكيد رغبتك في حذف حسابك في Jiki نهائيًا"
      greeting: "مرحبًا،"
      body_markdown: |
        تلقّينا طلبًا لحذف حسابك في Jiki.

        إذا كنت أنت من أرسل هذا الطلب، فانقر على الزر أدناه للتأكيد. هذا الإجراء نهائي ولا يمكن التراجع عنه، وستُحذف كل بياناتك وتقدّمك.

        إذا لم تكن قد طلبت ذلك، فيمكنك تجاهل هذا البريد بلا قلق، وسيبقى حسابك كما هو دون أي تغيير.
      cta: "احذف حسابي"
