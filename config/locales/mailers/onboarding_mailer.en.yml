en:
  onboarding_mailer:
    overview:
      subject: "Ever watched Karate Kid?"
      preview: "One of the questions I get asked the most is who Jiki is for."
      greeting: "Hi there,"
      body_markdown: |
        The phrase **"Wax on, wax off"** has become synonymous with learning hard things. It comes from _The Karate Kid_, where Daniel (our karate kid) asks a teacher (Mr. Miyagi) to teach him karate. Rather than teaching him how to kick and punch, Mr. Miyagi has him do chores, most famously waxing cars. The focus is on doing the exact movements correctly, and it turns out (spoiler) that this discipline builds skills that are transferable to karate, and that the process of training your body repeatedly is what makes you good.

        Coding is a bit similar, but for the mind, not the body. We all want to be able to make interesting stuff from day one, but more than anything we need to build really solid fundamentals. We need to **train our brains** in the right way and develop the right ways of thinking.

        - **If you're new to coding**, Jiki is going to take you through these mental exercises (hopefully in a more interesting way than waxing cars!) and teach you everything you need to know.
        - **If you've been coding for a while**, you might feel like you're traipsing over the same basics, not moving forward. But just like Daniel waxing cars, there's massive value in doing these early stages right. Stick with Jiki and we'll help you develop **a deep coding mindset and solid fundamental skills**.

        I'm excited to have you on board! Any questions - just reply to this email. I'm a human and happy to help 🙂

        Thanks for reading!
        Jeremy
    coding:
      subject: "What programming language should I learn?"
      preview: "Learning to code has a reputation for being technical and hard."
      greeting: "Hi again,"
      body_markdown: |
        Learning to code has a reputation for being technical and hard. When I started to learn to code, I was an 8-year-old kid who knew nothing about programming other than that **I could suddenly make cool stuff**. I didn't know it was supposed to be hard. I just knew I suddenly had a new outlet for my creativity.

        Most beginners spend ages trying to make decisions about what programming language to learn. [It doesn't matter](https://jiki.io/blog/just-learn-to-code). What matters is that you build a really good understanding of **how coding works**, and that's what Jiki teaches.

        As you progress, there will be times when coding does feel hard and frustrating. But this isn't because _coding_ is hard, it's because **learning is hard**. If you want to get good at anything, you have to go through phases where the challenge feels too much, but you have to persevere.

        Jiki will get you to a point where you understand code, and then you can use our sister website, Exercism, to learn any of **85 different programming languages**!

        You've got this!
        Jeremy
    premium:
      subject: "Get More Out of Jiki (and help us out)"
      preview: "We made Jiki free because we want it to be accessible to everyone regardless"
      greeting: "Hi there,"
      body_markdown: |
        We made Jiki free because we want it to be **accessible to everyone** regardless of their financial situation. Everyone gets hundreds of hours of exercises and videos, all available with nothing asked in return.

        But **Jiki costs money to run**, and we need to be able to pay our rents and afford food (🍜) and caffeine (☕), so we've added a Premium tier that adds some extra benefits that I think will really help you:
        - **Never get stuck** with unlimited Ask Jiki support.
        - **Push yourself further** with Premium challenges.
        - **Be part of the community** with regular livestreams.
        - **Dig deeper** with our full walkthroughs catalog.
        - **Showcase your skills** with an official certificate.
        - **Stay focussed** with an ad-free learning experience.
        - **Get early access** to new features.
        - **Show your support** with Premium badges on the site and in community spaces.

        We've made it super-affordable using **Purchasing Power Parity**. That means that Premium costs about the same as two takeaway drinks in your country, so it should feel like a reasonable price wherever you are in the world.

        If you're enjoying Jiki, want to **accelerate your learning**, and want to support me and the Jiki team, then please [upgrade to Premium](https://jiki.io/premium).

        Thank you,
        Jeremy
    community:
      subject: "Don't Struggle Alone - Join Jiki's Community"
      preview: "You're a lot more likely to succeed learning anything if you're part of a group."
      greeting: "Hi there,"
      body_markdown: |
        You're a lot more likely to succeed learning anything if **you're part of a group**. Coding is no different.

        If you'd like to get help, chat about your coding journey, or just hang out with others, there are some places to do it:
        - [Our forum](https://jiki.io/r/forum): The place to go for slower, long-form conversation. **Go deeper** here.
        - [Exercism's Discord](https://jiki.io/r/discord): The place to go for **real-time chat** with others who are online. Look for the #jiki-chat and #jiki-get-help channels.
        - [YouTube](https://jiki.io/r/youtube): Join our AMAs (Ask Me Anything) and other **livestreams** to ask me your questions!

        Remember that there are people from lots of different cultures in these spaces, so **please be respectful** to everyone as you chat.

        See you there!
        Jeremy
