ja:
  account_mailer:
    welcome:
      subject: "Jikiへようこそ！"
      greeting: "こんにちは！"
      body_markdown: |
        [Jiki](https://jiki.io)へようこそ！ここに来てくれて、本当にうれしく思います。

        Jikiは、まったくの初心者から、自信を持ってコードを書けるようになるまで導くために作られました。楽しいプロジェクトに取り組み、興味深い問題を解きながら、一歩ずつ前進し、その道のりでたくさんのことを学んでいきます。

        もし行き詰まったり質問があったりしたら、いつでも気軽に連絡してください。プログラミングの学習は最初は大変に感じるかもしれませんが、きっとできますよ！

        楽しみながら、この旅を満喫してください！

        それでは、  
        Jeremyとチーム
    account_deletion_confirmation:
      subject: "アカウント削除の確認"
      preview: "Jikiアカウントを完全に削除してよいか確認してください"
      greeting: "こんにちは！"
      body_markdown: |
        Jikiアカウントの削除リクエストを受け付けました。

        ご自身でリクエストした場合は、下のボタンをクリックして確認してください。この操作は取り消すことができず、元に戻せません。これまでの学習の進捗とデータはすべて削除されます。

        もしこのリクエストに心当たりがない場合は、このメールを無視してください。アカウントはそのまま残ります。
      cta: "アカウントを削除する"
