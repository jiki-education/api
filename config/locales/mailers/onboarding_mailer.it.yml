it:
  onboarding_mailer:
    overview:
      subject: "Diventare uno sviluppatore nel 2026: le due metà"
      preview: "Negli ultimi anni ho imparato il giapponese lentamente."
      greeting: "Ciao,"
      body_markdown: |
        Negli ultimi anni ho imparato il giapponese lentamente. Vado spesso in Giappone e cerco di parlare la lingua, ma non è semplice: con Google Translate puoi fare tutto senza praticare il giapponese. Quindi il mio cervello non si impegna, perché non ne ha bisogno… e io me la cavo lo stesso.

        La programmazione sta cambiando. Per trent'anni, se volevi creare qualcosa con la tecnologia, dovevi imparare a programmare: era l'unico modo per comunicare con un computer. Ma negli ultimi anni, con l'arrivo degli agenti IA, tutto è cambiato. Ora puoi usare la tua lingua madre per dire a un agente cosa vuoi ottenere, e sarà lui a scrivere il codice per te: traduce le tue istruzioni in un linguaggio che il computer può capire.

        Proprio come non devo aspettare di essere fluente in giapponese prima di poter esplorare il Giappone, **non ha più alcun senso passare anni a migliorare nella programmazione** prima di iniziare a costruire cose.

        Ma se voglio davvero immergermi nella cultura giapponese e fare amicizia con persone giapponesi, ho bisogno di imparare il giapponese. E, se vuoi entrare nel settore tech, devi comunque imparare a programmare. Il codice non è più il guardiano, ma è **la differenza tra «cavarsela» e prosperare davvero**.

        Per migliorare in fretta, dividi il tuo tempo di apprendimento in due parti:
        1. **Impara a programmare.** Completa il corso Fondamenti di programmazione di Jiki e avrai delle ottime basi.
        2. **Crea cose.** Completa «Impara a costruire», entrando nei dettagli e creando prodotti che le persone possano davvero usare!

        Se vuoi saperne di più sulle mie idee su **come entrare nel settore tech nel 2026**, leggi [questo post del blog](https://jiki.io/blog/how-to-get-into-tech-in-2026).

        Nei prossimi giorni ti parlerò un po' di più sia del lato della programmazione sia di quello della costruzione, e di come puoi sfruttare al meglio [Jiki](https://jiki.io). Fino ad allora, **buttati e divertiti!**

        Grazie per aver letto!
        Jeremy
    coding:
      subject: "Costruisci basi di programmazione solide"
      preview: "Imparare a programmare ha fama di essere tecnico e difficile."
      greeting: "Ciao di nuovo,"
      body_markdown: |
        Imparare a programmare ha fama di essere tecnico e difficile. Quando ho iniziato avevo solo 8 anni e non ne sapevo assolutamente nulla, se non **che all'improvviso avrei potuto creare cose fantastiche**. Non sapevo che potesse essere difficile. Sapevo solo che tutto ad un tratto avevo un nuovo modo per esprimere la mia creatività.

        Mentre impari a programmare, **non voglio che tu la consideri una disciplina tecnica da padroneggiare.** Voglio che tu la veda come uno spazio in cui liberare la **tua** creatività, dove puoi **divertirti a creare** e a risolvere puzzle. Perché, in fondo, la programmazione è proprio questo: risolvere problemi.

        Non importa [quale linguaggio impari](https://jiki.io/blog/just-learn-to-code): ciò che conta è costruire una comprensione davvero solida di **come funziona la programmazione**.

        Andando avanti, ci saranno momenti in cui ti sembrerà tutto difficile e frustrante. Questo non accade perché programmare sia difficile: accade perché imparare lo è. Se vuoi diventare bravo in qualcosa, devi attraversare fasi in cui la sfida sembra troppo grande, e proprio lì dovrai perseverare.

        Se non sei sicuro che valga la pena imparare a programmare, leggi [questo post del blog](https://jiki.io/blog/should-i-still-learn-to-code-in-2026) che spiega perché dovresti farlo anche nel 2026.

        Grazie per aver letto!
        Jeremy
    premium:
      subject: "Ottieni di più da Jiki (e dacci una mano)"
      preview: "Abbiamo reso Jiki gratuito perché vogliamo che sia accessibile a tutti, a prescindere"
      greeting: "Ciao,"
      body_markdown: |
        Abbiamo reso Jiki gratuito perché vogliamo che sia **accessibile a tutti**, a prescindere dalla situazione economica di ciascuno. Tutti ricevono centinaia di ore di esercizi e video, tutti disponibili senza alcun costo aggiuntivo.

        Ma **Jiki ha dei costi di manutenzione**: dobbiamo pagare l'affitto e permetterci cibo (🍜) e caffè (☕), quindi abbiamo aggiunto un piano Premium che offre alcuni vantaggi extra che penso ti aiuteranno davvero:
        - **Chiedi a Jiki**: la nostra chat IA per aiutarti a sbloccarti rapidamente o esplorare le tue domande.
        - **Progetti Premium**: esercizi più difficili, in cui puoi combinare le competenze che stai imparando.
        - **Impara a costruire**: molto più contenuto con cui puoi imparare insieme a me.
        - **Badge**: mostra il tuo supporto sul sito e negli spazi della community con i badge Premium.

        L'abbiamo reso super conveniente usando la **parità di potere d'acquisto**. Questo significa che Premium costa più o meno come due consumazioni nel tuo paese, quindi dovrebbe sembrarti un prezzo ragionevole ovunque ti trovi nel mondo.

        Se ti piace Jiki, vuoi **accelerare il tuo apprendimento** e vuoi supportare me e il team di Jiki, allora [passa a Premium](https://jiki.io/premium).

        Grazie,
        Jeremy
    community:
      subject: "Non lottare da solo: unisciti alla community di Jiki"
      preview: "Imparare è più facile quando collabori con altre persone."
      greeting: "Ciao,"
      body_markdown: |
        Imparare è più facile **quando _collabori con altre persone_**, e la programmazione non fa eccezione.

        Se vuoi ricevere aiuto, parlare del tuo percorso di programmazione o semplicemente passare del tempo con gli altri, ecco alcuni luoghi in cui farlo:
        - [Il nostro forum](https://jiki.io/r/forum): Uno spazio dove le conversazioni possono rallentare e andare a fondo. Qui si va davvero in profondità.
        - [Il Discord di Exercism](https://jiki.io/r/discord): Uno spazio ideale per chattare con gli altri utenti. Cerca i canali #jiki-chat e #jiki-get-help.
        - [YouTube](https://jiki.io/r/youtube): Partecipa alle nostre AMA (Ask Me Anything) e ad altre dirette streaming, dove potrai farmi delle domande!

        Ricorda che in questi spazi ci sono persone di culture diverse: mantieni un **tono rispettoso** quando chatti con gli altri.

        Ci vediamo!
        Jeremy
