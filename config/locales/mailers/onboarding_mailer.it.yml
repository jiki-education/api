it:
  onboarding_mailer:
    overview:
      subject: "Hai mai visto Karate Kid?"
      preview: "Una delle domande che mi fanno più spesso è a chi si rivolge Jiki."
      greeting: "Ciao,"
      body_markdown: |
        La frase **«Wax on, wax off»** è ormai diventata sinonimo dell'imparare le cose difficili. Viene da _Karate Kid_, dove Daniel (il nostro ragazzo del karate) chiede a un insegnante (il signor Miyagi) di insegnargli il karate. Invece di insegnargli a calciare e a tirare pugni, il signor Miyagi gli fa fare le faccende di casa, la più famosa delle quali è dare la cera alle auto. L'attenzione è tutta sul fare i movimenti esatti nel modo giusto, e si scopre (spoiler) che questa disciplina sviluppa capacità che si trasferiscono al karate: è l'allenamento ripetuto del corpo a renderti bravo.

        La programmazione è un po' simile, ma riguarda la mente, non il corpo. Vogliamo tutti riuscire a creare cose interessanti fin dal primo giorno, ma più di ogni altra cosa abbiamo bisogno di costruire basi davvero solide. Dobbiamo **allenare il cervello** nel modo giusto e sviluppare i modi di pensare giusti.

        - **Se sei alle prime armi con la programmazione**, Jiki ti guiderà attraverso questi esercizi mentali (speriamo in modo più interessante del dare la cera alle auto!) e ti insegnerà tutto quello che devi sapere.
        - **Se programmi già da un po'**, potresti avere la sensazione di ripassare sempre le stesse basi senza andare avanti. Ma proprio come Daniel che dà la cera alle auto, c'è un valore enorme nel fare bene queste prime fasi. Resta con Jiki e ti aiuteremo a sviluppare **una mentalità profonda da programmatore e solide competenze di base**.

        Sono felice che tu sia dei nostri! Se hai domande, rispondi pure a questa email. Sono una persona vera e sarò felice di aiutarti 🙂

        Grazie per aver letto!
        Jeremy
    coding:
      subject: "Quale linguaggio di programmazione dovrei imparare?"
      preview: "Imparare a programmare ha la fama di essere una cosa tecnica e difficile."
      greeting: "Ciao di nuovo,"
      body_markdown: |
        Imparare a programmare ha la fama di essere una cosa tecnica e difficile. Quando ho iniziato a programmare ero un bambino di 8 anni che non sapeva nulla di programmazione, se non che **all'improvviso potevo creare cose davvero belle**. Non sapevo che dovesse essere difficile. Sapevo solo che all'improvviso avevo un nuovo modo di esprimere la mia creatività.

        La maggior parte dei principianti passa un sacco di tempo a decidere quale linguaggio di programmazione imparare. [Non ha importanza](https://jiki.io/blog/just-learn-to-code). Quello che conta è capire davvero bene **come funziona la programmazione**, ed è questo che insegna Jiki.

        Andando avanti, ci saranno momenti in cui programmare sembrerà davvero difficile e frustrante. Ma non succede perché _programmare_ è difficile, succede perché **imparare è difficile**. Se vuoi diventare bravo in qualcosa, devi passare attraverso fasi in cui la sfida sembra troppo grande, ma devi resistere.

        Jiki ti porterà al punto in cui capisci il codice, e poi potrai usare il nostro sito gemello, Exercism, per imparare uno qualsiasi degli **85 linguaggi di programmazione diversi**!

        Ce la farai!
        Jeremy
    premium:
      subject: "Ottieni di più da Jiki (e dacci una mano)"
      preview: "Abbiamo reso Jiki gratuito perché vogliamo che sia accessibile a tutti, a prescindere."
      greeting: "Ciao,"
      body_markdown: |
        Abbiamo reso Jiki gratuito perché vogliamo che sia **accessibile a tutti**, indipendentemente dalla situazione economica. Tutti ricevono centinaia di ore di esercizi e video, disponibili senza chiedere nulla in cambio.

        Ma **gestire Jiki costa**, e dobbiamo poter pagare l'affitto e permetterci da mangiare (🍜) e un po' di caffeina (☕), così abbiamo aggiunto un livello Premium che offre alcuni vantaggi extra che secondo me ti aiuteranno davvero:
        - **Non restare mai bloccato**, con il supporto illimitato di Chiedi a Jiki.
        - **Spingiti oltre** con le sfide Premium.
        - **Fai parte della comunità** con le dirette regolari.
        - **Scava più a fondo** con il catalogo completo delle guide passo passo.
        - **Metti in mostra le tue capacità** con un certificato ufficiale.
        - **Resta concentrato** con un'esperienza di apprendimento senza pubblicità.
        - **Accedi in anteprima** alle nuove funzionalità.
        - **Mostra il tuo sostegno** con i badge Premium sul sito e negli spazi della comunità.

        L'abbiamo reso super conveniente grazie alla **parità di potere d'acquisto**. Significa che Premium costa più o meno come due bevande da asporto nel tuo paese, così il prezzo dovrebbe sembrarti ragionevole ovunque tu sia nel mondo.

        Se ti piace Jiki, vuoi **accelerare il tuo apprendimento** e sostenere me e il team di Jiki, allora [passa a Premium](https://jiki.io/premium).

        Grazie,
        Jeremy
    community:
      subject: "Non lottare da solo: unisciti alla community di Jiki"
      preview: "Imparare è più facile quando collabori con altre persone."
      greeting: "Ciao,"
      body_markdown: |
        Imparare è più facile **quando _collabori con altre persone_**, e la programmazione non fa eccezione.

        Se vuoi ricevere aiuto, parlare del tuo percorso di programmazione o semplicemente passare del tempo con gli altri, ecco alcuni luoghi in cui farlo:
        - [Il nostro forum](https://jiki.io/r/forum): Uno spazio dove le conversazioni possono rallentare e andare a fondo. Qui si va davvero in profondità.
        - [Il Discord di Exercism](https://jiki.io/r/discord): Uno spazio ideale per chattare con gli altri utenti. Cerca i canali #jiki-chat e #jiki-get-help.
        - [YouTube](https://jiki.io/r/youtube): Partecipa alle nostre AMA (Ask Me Anything) e ad altre dirette streaming, dove potrai farmi delle domande!

        Ricorda che in questi spazi ci sono persone di culture diverse: mantieni un **tono rispettoso** quando chatti con gli altri.

        Ci vediamo!
        Jeremy
